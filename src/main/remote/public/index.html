  const group = activeRotationGroup(modelInfo);
  const shown = group === null ? (modelInfo?.rotation ?? []) : group.entries;
  if (shown.some((entry) => entry.provider === provider && entry.model === model)) {
    showError(group === null ? 'That model is already in the pool.' : 'That model is already in ' + group.name + '.');
    return;
  }
  field.value = '';
  await saveShown([...shown, { provider, model }]);
}

function hostOf(baseURL) {
  if (!baseURL) return '';
  try {
    const url = new URL(baseURL);
    return url.host + (url.pathname === '/' ? '' : url.pathname);
  } catch { return baseURL; }
}

/* The provider whose Edit form is open. */
let editingProvider = null;

/* Name, base URL, key and model ids: the desktop's form. The saved key is
 * never shown; an empty key field keeps it. */
function providerEditor(provider) {
  const box = document.createElement('div');
  box.className = 'pedit';
  const field = (value, placeholder, type) => {
    const input = document.createElement('input');
    input.className = 'path';
    input.value = value;
    input.placeholder = placeholder;
    if (type) input.type = type;
    input.setAttribute('autocapitalize', 'off');
    input.setAttribute('autocorrect', 'off');
    input.spellcheck = false;
    return input;
  };
  const label = field(provider.label, 'Name');
  const baseURL = field(provider.baseURL ?? '', 'Base URL, e.g. https://openrouter.ai/api/v1');
  const key = field('', provider.hasKey ? 'API key saved, empty keeps it' : 'API key', 'password');
  key.autocomplete = 'off';
  const models = document.createElement('textarea');
  models.className = 'models';
  models.value = (provider.listed ?? []).join('\n');
  models.placeholder = 'Model ids, one per line';
  models.setAttribute('autocapitalize', 'off');
  models.setAttribute('autocorrect', 'off');
  models.spellcheck = false;
  const hint = document.createElement('span');
  hint.className = 'faint';
  hint.textContent = provider.kind === 'clinepass'
    ? 'The subscription models. Empty goes back to the list anticode ships with.'
    : 'They show in the model picker even when the provider has no model list; the first is the default.';
  const actions = document.createElement('div');
  actions.className = 'actions';
  actions.style.marginBottom = '0';
  const cancel = document.createElement('button');
  cancel.textContent = 'Cancel';
  cancel.onclick = () => { editingProvider = null; renderProviders(); };
  const save = document.createElement('button');
  save.textContent = 'Save';
  save.onclick = () => void savePhoneProvider(provider, {
    label: label.value, baseURL: baseURL.value, apiKey: key.value, models: models.value
  });
  actions.append(cancel, save);
  box.append(label, baseURL);
  if (provider.kind !== 'ollama') box.appendChild(key);
  box.append(models, hint, actions);
  return box;
}

function providersChanged(info) {
  modelInfo = info;
  document.getElementById('settingsError').classList.add('hidden');
  fillModelPickers('providerSelect', 'modelSelect');
  fillModelPickers('setProvider', 'setModel');
  updateChips();
  renderProviders();
}

async function pickDefaultProvider(provider) {
  try {
    await jfetch('/api/model', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ provider, model: '', sessionId: null })
    });
    await loadModels();
  } catch (error) { showError(error); }
}

async function savePhoneProvider(provider, edit) {
  try {
    const info = await jfetch('/api/providers/' + encodeURIComponent(provider.id), {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify(edit)
    });
    editingProvider = null;
    providersChanged(info);
  } catch (error) { showError(error); }
}

async function restorePhoneClinepass() {
  try {
    const info = await jfetch('/api/providers', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ label: 'Clinepass', kind: 'clinepass', baseURL: '', apiKey: '' })
    });
    // No key left to find: the form is where it gets one.
    const back = info.providers.find((provider) => provider.id === 'clinepass');
    if (back !== undefined && !back.available) editingProvider = 'clinepass';
    providersChanged(info);
  } catch (error) { showError(error); }
}

async function setPolicy(enabled) {
  try {
    const { status } = await jfetch('/api/policy', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ autoApprove: enabled })
    });
    noteStatus(status);
  } catch (error) { showError(error); }
}

async function addPhoneProvider() {
  const value = (id) => document.getElementById(id).value.trim();
  const kind = value('provKind');
  if (kind === 'ollama' && value('provURL') === '') {
    document.getElementById('provURL').value = 'http://127.0.0.1:11434/v1';
  }
  // A vendor API knows its own address; a gateway or a local server does not.
  const vendor = kind === 'anthropic' || kind === 'openai-api';
  if ((!vendor && value('provURL') === '') || (kind !== 'ollama' && value('provKey') === '')) {
    showError(vendor ? 'Fill in the API key first.' : kind === 'openai' ? 'Fill in the base URL and the API key first.' : 'Fill in the base URL first.');
    return;
  }
  try {
    modelInfo = await jfetch('/api/providers', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ label: value('provLabel'), kind, baseURL: value('provURL'), apiKey: value('provKey'), models: value('provModels') })
    });
    for (const id of ['provLabel', 'provURL', 'provKey', 'provModels']) document.getElementById(id).value = '';
    document.getElementById('settingsError').classList.add('hidden');
    fillModelPickers('providerSelect', 'modelSelect');
    fillModelPickers('setProvider', 'setModel');
    renderProviders();
  } catch (error) { showError(error); }
}

function onPhoneProviderKind() {
  const kind = document.getElementById('provKind').value;
  const url = document.getElementById('provURL');
  if (kind === 'ollama' && url.value.trim() === '') url.value = 'http://127.0.0.1:11434/v1';
}

async function removePhoneProvider(provider) {
  const note = provider.kind === 'clinepass'
    ? ' What was saved for it in Settings is forgotten; a key in the .env file stays, and Restore brings it back.'
    : ' Its key is deleted from the Mac.';
  if (!confirm('Remove ' + provider.label + '?' + note)) return;
  try {
    if (editingProvider === provider.id) editingProvider = null;
    providersChanged(await jfetch('/api/providers/' + encodeURIComponent(provider.id), { method: 'DELETE' }));
  } catch (error) { showError(error); }
}

/* The session's plan: the newest checklist todo_write published that did not
 * fail. It belongs only to the current run, needs at least three items, and
 * disappears completely as soon as that run ends. */
function planOf(messages) {
  const failed = new Set();
  for (const message of messages) for (const block of message.blocks) {
    if (block.type === 'tool_result' && block.isError) failed.add(block.toolUseId);
  }
  for (let i = messages.length - 1; i >= 0; i--) {
    const blocks = messages[i].blocks;
    for (let j = blocks.length - 1; j >= 0; j--) {
      const block = blocks[j];
      if (block.type === 'tool_use' && block.name === 'todo_write' && !failed.has(block.id) && Array.isArray(block.input?.items)) {
        return block.input.items;
      }
    }
  }
  return null;
}
function renderPlan() {
  const row = document.getElementById('planRow');
  row.replaceChildren();
  const items = (currentPlan ?? []).filter((item) => typeof item?.content === 'string');
  const working = currentRunId !== null && !pausedSessions.has(currentSession);
  const done = items.filter((item) => item.status === 'completed').length;
  const hidden = items.length < 3 || !working;
  row.classList.toggle('hidden', hidden);
  if (hidden) return;
  const open = planOpen ?? working;
  const head = document.createElement('div');
  head.className = 'phead';
  const label = document.createElement('span'); label.className = 'plabel'; label.textContent = 'Plan';
  const count = document.createElement('span'); count.className = 'pcount'; count.textContent = done + '/' + items.length;
  const now = document.createElement('span'); now.className = 'pnow';
  const current = items.find((item) => item.status === 'in_progress') ?? items.find((item) => item.status === 'pending');
  now.textContent = done === items.length ? 'all done' : !open && current ? current.content : '';
  head.append(label, count, now);
  head.onclick = () => { planOpen = !open; renderPlan(); };
  row.appendChild(head);
  if (!open) return;
  const list = document.createElement('ol');
  for (const item of items) {
    const li = document.createElement('li');
    li.className = item.status === 'completed' ? 'done' : item.status === 'in_progress' ? 'now' : '';
    const mark = document.createElement('span'); mark.className = 'pm';
    mark.textContent = item.status === 'completed' ? '\u2713' : item.status === 'in_progress' ? '\u25b8' : '\u25cb';
    const text = document.createElement('span'); text.textContent = item.content;
    li.append(mark, text);
    list.appendChild(li);
  }
  row.appendChild(list);
}

/* The queue is the Mac's: queued here or on the desktop, it shows on both,
 * and tapping one takes it off the line and back into the box. */
function renderQueue(items) {
  const row = document.getElementById('queueRow');
  row.replaceChildren();
  row.classList.toggle('hidden', items.length === 0);
  items.forEach((item, index) => {
    const el = document.createElement('div');
    el.className = 'qitem';
    const n = document.createElement('span');
    n.className = 'qn';
    n.textContent = 'queued ' + (index + 1);
    const text = document.createElement('span');
    text.className = 'qt';
    text.textContent = item.text;
    text.onclick = () => void unqueue(item, true);
    const x = document.createElement('button');
    x.className = 'qx';
    x.textContent = '\u00d7';
    x.setAttribute('aria-label', 'Remove from queue');
    x.onclick = () => void unqueue(item, false);
    if (currentRunId !== null) {
      const st = document.createElement('button');
      st.className = 'qs';
      st.textContent = '\u21a7';
      st.title = 'Steer: send into the run now';
      st.setAttribute('aria-label', 'Steer into the running session');
      st.onclick = () => void steerQueued(item);
      el.append(n, text, st, x);
    } else {
      el.append(n, text, x);
    }
    row.appendChild(el);
  });
}

/** Sends a queued prompt into the running session, as the desktop's steer
 * arrow does: it leaves the queue and goes to the model right now. */
async function steerQueued(item) {
  const id = currentSession;
  if (id === null || currentRunId === null) return;
  try {
    // `keep` is what carries the queued prompt's files into the run: their
    // staged IDs must survive the unqueue for the steer to attach them.
    const { item: taken } = await jfetch('/api/unqueue', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ sessionId: id, id: item.id, keep: true })
    });
    if (!taken) return;
    await jfetch('/api/prompt', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        sessionId: id,
        prompt: taken.text,
        attachmentIds: taken.attachmentIds ?? [],
        plan: taken.plan === true
      })
    });
  } catch (error) { showError(error); }
}

async function unqueue(item, edit) {
  const id = currentSession;
  if (id === null) return;
  try {
    const { item: taken } = await jfetch('/api/unqueue', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ sessionId: id, id: item.id })
    });
    if (edit && taken && currentSession === id) {
      const input = document.getElementById('prompt');
      input.value = input.value.trim() === '' ? taken.text : input.value + '\n\n' + taken.text;
      input.dispatchEvent(new Event('input'));
      input.focus();
    }
  } catch (error) { showError(error); }
}

/* Folds the earlier turns into a memory the model writes, the way a run does
 * on its own near the context ceiling. Only between runs. */
async function compactContext() {
  const id = currentSession;
  const result = document.getElementById('compactResult');
  if (id === null) return;
  if (currentRunId !== null) { result.textContent = 'Pause this session to compact it.'; result.classList.remove('hidden'); return; }
  const button = document.getElementById('compactBtn');
  button.disabled = true;
  button.textContent = 'Compacting\u2026';
  try {
    const { before, after } = await jfetch('/api/compact', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ sessionId: id })
    });
    result.textContent = after < before
      ? before.toLocaleString('en-US') + ' \u2192 ' + after.toLocaleString('en-US') + ' tokens'
      : 'Nothing earlier to compact';
  } catch (error) {
    result.textContent = error.message;
  }
  result.classList.remove('hidden');
  button.disabled = false;
  button.textContent = 'Compact context';
}

/* Paused because the prompt was wrong: the exchange comes back out of the Mac's
 * history and the prompt goes back in the box, ready to be fixed and sent. */
async function revertTurn() {
  const id = currentSession;
  if (id === null || currentRunId !== null) return;
  try {
    const { prompt } = await jfetch('/api/revert', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ sessionId: id })
    });
    // Nothing was taken back: leave the pause and the transcript as they were.
    if (typeof prompt !== 'string') { updateSendBtn(); return; }
    pausedSessions.delete(id);
    if (currentSession === id) {
      const input = document.getElementById('prompt');
      input.value = prompt;
      input.dispatchEvent(new Event('input'));
      await syncSession(id);
    }
  } catch (error) { showError(error); }
  updateSendBtn();
}

void restoreLastSession();

/* The model may have been switched on the desktop while the phone was away;
 * the new-session card is where the phone shows it, so it asks again. */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (!document.getElementById('newSessionCard').classList.contains('hidden')) void loadModels();
});
</script>
