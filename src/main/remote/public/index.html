<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>anticode remote</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #1a1a1a; color: #ededed;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  /* 16px+ on every control keeps Safari from zooming on focus. */
  input, textarea, select, button { font-size: 16px; }
  header {
    position: sticky; top: 0; display: flex; justify-content: center;
    padding: 12px 16px; background: #202020; border-bottom: 1px solid #303030;
    font-weight: 600; z-index: 5;
  }
  header .menubtn {
    display: flex; align-items: center; gap: 6px; background: none; border: none;
    color: #ededed; font-weight: 600; font-size: 17px; padding: 4px 10px; border-radius: 8px;
    max-width: 78vw;
  }
  header .menubtn .chev { color: #9a9a9a; font-size: 13px; }
  header .menubtn span.title {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* Plain white words under the title — no card, no rules, no chrome. The
     column is centred on the screen and its labels read flush left. */
  /* No card around the words: the page behind them simply steps back. The
     column sits in the middle of the screen and its labels read flush left. */
  #menuDrop { position: fixed; inset: 0; z-index: 30; background: rgba(26,26,26,.9); }
  #menuDrop .mcol { width: fit-content; margin: 56px auto 0; }
  #menuDrop .mrow {
    display: block; width: 100%; background: none; border: none; padding: 10px 0;
    cursor: pointer; color: #ededed; font-size: 17px; text-align: left;
  }
  #menuDrop .mrow:active { color: #d1fa22; }
  main { padding: 12px 16px 120px; }
  .card {
    background: #202020; border: 1px solid #303030; border-radius: 12px;
    padding: 10px 14px; margin-bottom: 8px;
  }
  .row {
    display: flex; align-items: baseline; gap: 8px; padding: 11px 2px;
    border-bottom: 1px solid #262626; cursor: pointer;
  }
  .row:last-child { border-bottom: none; }
  .row .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .delbtn {
    flex: none; width: 26px; height: 26px; border-radius: 6px; border: none;
    background: none; color: #6d6d6d; font-size: 18px; line-height: 1; cursor: pointer;
  }
  .delbtn:hover { color: #e06c6c; background: #2a2020; }
  .badge {
    flex: none; width: 22px; height: 22px; border-radius: 6px; display: inline-flex;
    align-items: center; justify-content: center; font-size: 12px; font-weight: 600;
    color: rgba(255,255,255,.95);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35);
  }
  .badge .radar {
    display: block; width: 15px; height: 15px; border-radius: 50%;
    background: conic-gradient(from 0deg, #d1fa22, rgba(209,250,34,0) 90deg);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 1.5px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 1.5px));
    animation: spin 1.2s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg .icode {
    font-family: ui-monospace, Menlo, monospace; font-size: 0.88em;
    background: #262626; border-radius: 4px; padding: 1px 5px; color: #d0d0d0;
  }
  .muted { color: #9a9a9a; }
  .faint { color: #6d6d6d; font-size: 14px; }
  .msg { padding: 8px 0; border-bottom: 1px solid #262626; white-space: pre-wrap; word-break: break-word; }
  .msg.user { text-align: right; }
  .msg.user .bubble {
    display: inline-block; text-align: left; background: #272727; border-radius: 12px;
    padding: 8px 12px; max-width: 85%;
  }
  .msg .tool { color: #9a9a9a; font-size: 13.5px; font-family: ui-monospace, Menlo, monospace; }
  /* A run of tool calls collapses to one line — "ran 5 steps" — exactly as on
     the desktop; the individual steps live behind the disclosure. */
  .tgroup { margin: 12px 0; }
  .tgroup > summary {
    list-style: none; display: flex; align-items: center; gap: 10px;
    padding: 2px 0; cursor: pointer; color: #9a9a9a; font-size: 14px;
  }
  .tgroup summary::-webkit-details-marker { display: none; }
  .tgroup .tdot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #6d6d6d; }
  .tgroup .tdot.live { background: #9a9a9a; animation: breathe 1.6s ease-in-out infinite; }
  .tgroup .tdot.bad { background: #e06c6c; }
  .tgroup .tlabel { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tchev { flex: none; font-size: 11px; color: #6d6d6d; }
  .tgroup .tbody { border-left: 1px solid #303030; margin: 4px 0 4px 3px; padding-left: 16px; }
  .trow { padding: 8px 0; }
  .trow > summary {
    list-style: none; display: flex; align-items: baseline; gap: 10px;
    padding: 2px 0; cursor: pointer; color: #ededed; font-size: 15px;
  }
  .trow summary::-webkit-details-marker { display: none; }
  .trow .tname { flex: none; }
  .trow .tname.bad { color: #e06c6c; }
  .trow .tsubject {
    flex: 1; min-width: 0; color: #9a9a9a; font-size: 13px;
    font-family: ui-monospace, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .trow .tout {
    margin: 8px 0 0; max-height: 320px; overflow: auto; background: #202020;
    border: 1px solid #303030; border-radius: 10px; padding: 10px 12px;
    font: 12.5px/1.6 ui-monospace, Menlo, monospace; color: #9a9a9a;
    white-space: pre-wrap; word-break: break-word;
  }
  .working { display: flex; align-items: center; gap: 8px; color: #9a9a9a; padding: 8px 0; }
  .working .dot {
    width: 10px; height: 10px; border-radius: 50%; background: #9a9a9a;
    animation: breathe 1.6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { background: #9a9a9a; }
    50% { background: #d1fa22; }
  }
  .composer {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: #1a1a1a;
    border-top: 1px solid #303030;
  }
  /* Staged files sit on their own row above the text box. */
  #stagedRow { flex: 0 0 100%; display: flex; gap: 8px; overflow-x: auto; }
  #stagedRow .chip {
    position: relative; display: flex; align-items: center; gap: 8px; flex: none;
    background: #202020; border: 1px solid #303030; border-radius: 10px; padding: 6px 26px 6px 6px;
  }
  #stagedRow .chip img, .att img { display: block; border-radius: 6px; object-fit: cover; }
  #stagedRow .chip img { width: 34px; height: 34px; }
  #stagedRow .chip .nm { display: block; font-size: 12.5px; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #stagedRow .chip .sz { display: block; font-size: 11px; color: #6d6d6d; }
  #stagedRow .chip .x {
    position: absolute; top: 2px; right: 6px; background: none; border: none; color: #6d6d6d;
    font-size: 15px; line-height: 1; padding: 0;
  }
  .tag {
    flex: none; display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 6px; background: #272727;
    font-size: 9px; font-weight: 600; letter-spacing: .5px; color: #9a9a9a;
  }
  .composer .attach {
    flex: none; background: #2e2e2e; color: #ededed; border: none; border-radius: 10px;
    padding: 0 14px; font-size: 20px; line-height: 1;
  }
  /* Attachments inside the transcript: pictures as pictures, the rest as cards. */
  .atts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin: 6px 0; }
  .att { flex: none; border: 1px solid #303030; border-radius: 12px; overflow: hidden; background: #202020; }
  .att img { max-width: 58vw; max-height: 240px; }
  .att.file { display: flex; align-items: center; gap: 10px; padding: 8px 10px; max-width: 70vw; text-align: left; }
  .att .nm { display: block; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .att .sz { display: block; font-size: 11px; color: #6d6d6d; }
  .artifact {
    display: flex; align-items: center; gap: 10px; margin: 6px 0; padding: 8px 10px;
    background: #202020; border: 1px solid #303030; border-radius: 10px;
  }
  .artifact .nm {
    flex: 1; min-width: 0; font: 12.5px ui-monospace, Menlo, monospace;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .artifact a, .dirrow .dl { color: #d1fa22; text-decoration: none; font-size: 13.5px; flex: none; }
  .dirrow .dl { padding: 0 6px; }
  .composer textarea {
    flex: 1; background: #202020; border: 1px solid #303030; border-radius: 10px;
    color: #ededed; padding: 10px 12px; resize: none; min-height: 44px;
  }
  .composer button {
    background: #2e2e2e; color: #ededed; border: none; border-radius: 10px;
    padding: 0 18px;
  }
  .composer button:disabled { color: #6d6d6d; }
  .composer button.stopping { font-size: 12px; letter-spacing: 1px; }
  .composer button.lime { background: #d1fa22; color: #1a1a1a; }
  .mode { display: flex; gap: 8px; margin-bottom: 10px; }
  .mode button {
    flex: 1; background: #202020; color: #9a9a9a; border: 1px solid #303030;
    border-radius: 10px; padding: 10px 0; font-weight: 600;
  }
  .mode button.on { color: #ededed; border-color: #d1fa22; background: #232616; }
  .path {
    width: 100%; background: #202020; border: 1px solid #303030; border-radius: 8px;
    color: #ededed; padding: 8px 10px; font: 16px ui-monospace, Menlo, monospace; margin-bottom: 8px;
  }
  select.wide {
    width: 100%; background: #202020; border: 1px solid #303030; border-radius: 8px;
    color: #ededed; padding: 8px 10px; margin-bottom: 8px;
  }
  textarea.editor {
    width: 100%; min-height: 45vh; background: #202020; border: 1px solid #303030;
    border-radius: 10px; color: #ededed; padding: 12px;
    font: 15px/1.6 ui-monospace, Menlo, monospace; white-space: pre; margin-bottom: 8px;
  }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .actions button {
    background: #2e2e2e; color: #ededed; border: 1px solid #303030; border-radius: 8px;
    padding: 9px 13px;
  }
  .actions button:disabled { color: #6d6d6d; border-color: #262626; }
  .hidden { display: none; }
  .crumb { font: 14px ui-monospace, Menlo, monospace; color: #9a9a9a; margin-bottom: 8px; word-break: break-all; }
  .dirrow { display: flex; align-items: baseline; gap: 8px; padding: 9px 2px; border-bottom: 1px solid #262626; cursor: pointer; }
  .dirrow:last-child { border-bottom: none; }
  .dirrow .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dirrow.folder .name { color: #b3b0f5; }
  .back { color: #9a9a9a; cursor: pointer; padding: 4px 2px; }
</style>
</head>
<body>
<header>
  <button class="menubtn" id="menuBtn" onclick="toggleMenu(event)">
    <span class="title" id="menuTitle">anticode</span>
    <span class="chev">▾</span>
  </button>
</header>
<div id="menuDrop" class="hidden" onclick="if (event.target === this) closeMenu()">
  <div class="mcol">
    <button class="mrow" onclick="gotoNew()">New session</button>
    <button class="mrow" onclick="gotoSessions()">Sessions</button>
    <button class="mrow" onclick="gotoFiles()">Files</button>
  </div>
</div>
<div id="errorBanner" role="alert" class="hidden" style="margin:12px 16px;padding:12px;border:1px solid #945050;border-radius:8px;color:#f3aaaa;overflow-wrap:anywhere"><span id="errorMessage"></span><button style="margin-left:10px" onclick="document.getElementById('errorBanner').classList.add('hidden')">Dismiss</button></div>
<main>
  <section id="viewChat">
    <div id="dashboard">
      <div class="card" id="newSessionCard">
        <div class="muted" style="margin-bottom:8px">New session</div>
        <div class="mode">
          <button id="modeCode" class="on" onclick="setMode('code')">anticode</button>
          <button id="modeChat" onclick="setMode('chat')">antichat</button>
        </div>
        <input class="path" id="folderInput" placeholder="Folder on the Mac, e.g. /Users/me/Projects/app" />
        <select class="wide" id="providerSelect" aria-label="Provider" onchange="pickProvider(this.value)"></select>
        <select class="wide" id="modelSelect" aria-label="Model" onchange="pickModel(this.value)"></select>
        <input class="path" id="customModelId" placeholder="Custom model ID (optional)" />
        <button onclick="applyCustomModel()">Use model ID</button>
        <div class="actions" style="margin-bottom:0">
          <button onclick="startSession()">Start</button>
        </div>
      </div>
      <div id="sessionList" class="card"></div>
    </div>
    <div id="chatView" class="hidden">
      <div id="transcript"></div>
    </div>
  </section>
  <section id="viewFiles" class="hidden">
    <div class="card">
      <div class="muted" style="margin-bottom:6px">Session folder</div>
      <select id="folderSession" onchange="onSessionChange()"></select>
      <div class="crumb" id="crumb">/</div>
      <div class="actions">
        <button onclick="upDir()">Up</button>
        <button id="saveBtn" onclick="saveFile().catch(showError)" disabled>Save</button>
        <button id="gitStatusBtn" onclick="gitAction('status').catch(showError)">Git status</button>
        <button id="gitCommitBtn" onclick="gitAction('commit').catch(showError)">Commit</button>
        <button id="gitPushBtn" onclick="gitAction('push').catch(showError)">Push</button>
      </div>
      <div class="crumb hidden" id="gitOut" style="max-height:150px;overflow:auto"></div>
      <textarea class="editor hidden" id="editor" spellcheck="false"></textarea>
      <div id="dirList"></div>
    </div>
  </section>
</main>
<div id="approvalPanel" class="hidden" style="position:fixed;left:12px;right:12px;bottom:90px;max-height:55vh;overflow:auto;background:#222;border:1px solid #555;border-radius:12px;padding:16px;z-index:30"></div>
<div class="composer hidden" id="inputRow">
  <div id="stagedRow" class="hidden"></div>
  <input type="file" id="fileInput" multiple class="hidden" onchange="onFilesPicked(this.files)" />
  <button class="attach" id="attachBtn" title="Attach files" onclick="document.getElementById('fileInput').click()">+</button>
  <textarea id="prompt" placeholder="Message…" rows="1"></textarea>
  <button id="sendBtn" onclick="onSendBtn()">↑</button>
</div>
<script>
const token = new URLSearchParams(location.search).get('token') || '';
const api = (path, options) => fetch(path + (path.includes('?') ? '&' : '?') + 'token=' + token, options);
const jfetch = (path, options) => api(path, options).then(async (r) => {
  const body = await r.json();
  if (!r.ok) {
    if (r.status === 401) {
      stopOverviewPolling();
      eventSource?.close(); eventSource = null; currentRunId = null;
      throw new Error('Pairing expired. Open the current pairing link from desktop Settings → Remote.');
    }
    throw new Error(body.error || r.status);
  }
  return body;
});
let currentSession = null;
let currentRunId = null;
let submitting = false;
let streamReady = null;
let sessionEventVersion = 0;
let openedSessionId = null;
let fileVersion = null;
let savedContent = '';
function escapeHtml(value) { return String(value).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showError(error) {
  document.getElementById('errorMessage').textContent = error?.message || String(error);
  document.getElementById('errorBanner').classList.remove('hidden');
}
let eventSource = null;
const pausedSessions = new Set();
let currentPath = '.';
let openedFile = null;
let folderReady = false;
let creatingSession = false;
let phoneMode = 'code';
let modelInfo = null;
let overviewTimer = null;
let lastSessions = [];

let approvalRequestId = null;
async function pollApprovals() {
  const panel = document.getElementById('approvalPanel');
  if (!currentSession) { panel.classList.add('hidden'); approvalRequestId = null; return; }
  const id = currentSession;
  try {
    const { requests } = await jfetch('/api/approvals?sessionId=' + encodeURIComponent(id));
    if (currentSession !== id) return;
    const request = requests[0];
    if (!request) { panel.classList.add('hidden'); approvalRequestId = null; return; }
    if (request.requestId === approvalRequestId) return;
    approvalRequestId = request.requestId;
    panel.replaceChildren();
    const title = document.createElement('strong'); title.textContent = 'Approval · ' + request.toolName + ' · ' + request.risk;
    const detail = document.createElement('pre'); detail.style.cssText = 'white-space:pre-wrap;overflow-wrap:anywhere;max-height:30vh;overflow:auto'; detail.textContent = request.preview.subject + '\n' + request.preview.detail;
    panel.append(title, detail);
    for (const decision of ['reject', 'approve', ...(request.allowAlways ? ['always'] : [])]) {
      const button = document.createElement('button'); button.textContent = decision === 'always' ? 'Allow this session' : decision === 'approve' ? 'Approve' : 'Reject';
      button.style.marginRight = '8px';
      button.onclick = async () => {
        button.disabled = true;
        try { await jfetch('/api/approval', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({requestId:request.requestId,decision})}); panel.classList.add('hidden'); approvalRequestId=null; }
        catch (error) { showError(error); button.disabled=false; }
      };
      panel.append(button);
    }
    panel.classList.remove('hidden');
  } catch { /* Poll again after a transient connection failure. */ }
}
setInterval(() => { void pollApprovals(); }, 1000);

/* ---------- Navigation: one dropdown behind the session title ---------- */

function setMenuTitle(text) {
  document.getElementById('menuTitle').textContent = text;
}

function titleFor(id) {
  const s = lastSessions.find((entry) => entry.id === id);
  if (s === undefined) return phoneMode === 'code' ? 'anticode' : 'antichat';
  if (s.title) return s.title;
  return s.mode === 'code' && s.workspaceRoot
    ? s.workspaceRoot.split(/[\\/]/).pop()
    : 'antichat';
}

function toggleMenu(event) {
  event?.stopPropagation();
  document.getElementById('menuDrop').classList.toggle('hidden');
}

function closeMenu() {
  document.getElementById('menuDrop').classList.add('hidden');
}

function showChatSection() {
  document.getElementById('viewChat').classList.remove('hidden');
  document.getElementById('viewFiles').classList.add('hidden');
  updateSendBtn();
}

function showFilesSection() {
  document.getElementById('viewChat').classList.add('hidden');
  document.getElementById('viewFiles').classList.remove('hidden');
  document.getElementById('inputRow').classList.add('hidden');
  void refreshFilesTab().catch(showError);
}

function stopOverviewPolling() {
  if (overviewTimer !== null) { clearInterval(overviewTimer); overviewTimer = null; }
}

/** The Sessions list must mirror deletions made on the desktop, so it
 * re-fetches on a short cadence while it is on screen. */
function startOverviewPolling() {
  stopOverviewPolling();
  void loadOverview().catch(showError);
  overviewTimer = setInterval(() => { void loadOverview().catch(showError); }, 5000);
}

function gotoNew() {
  if (!canLeaveEditor()) return;
  staged = [];
  renderStaged();
  document.getElementById('approvalPanel').classList.add('hidden');
  closeMenu();
  currentSession = null;
  currentRunId = null;
  if (eventSource) { eventSource.close(); eventSource = null; }
  liveEl = null;
  stopOverviewPolling();
  showChatSection();
  document.getElementById('chatView').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  document.getElementById('sessionList').classList.add('hidden');
  document.getElementById('newSessionCard').classList.remove('hidden');
  setMenuTitle('anticode');
  setMode(phoneMode);
  void loadModels();
}

function gotoSessions() {
  if (!canLeaveEditor()) return;
  staged = [];
  renderStaged();
  document.getElementById('approvalPanel').classList.add('hidden');
  closeMenu();
  currentSession = null;
  currentRunId = null;
  if (eventSource) { eventSource.close(); eventSource = null; }
  liveEl = null;
  showChatSection();
  document.getElementById('chatView').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  document.getElementById('newSessionCard').classList.add('hidden');
  document.getElementById('sessionList').classList.remove('hidden');
  setMenuTitle('Sessions');
  startOverviewPolling();
}

function gotoFiles() {
  document.getElementById('approvalPanel').classList.add('hidden');
  closeMenu();
  currentSession = null;
  currentRunId = null;
  if (eventSource) { eventSource.close(); eventSource = null; }
  liveEl = null;
  stopOverviewPolling();
  setMenuTitle('Files');
  showFilesSection();
}

/* ---------- Chat ---------- */

async function loadOverview() {
  const { sessions } = await jfetch('/api/overview');
  lastSessions = sessions;
  const list = document.getElementById('sessionList');
  list.innerHTML = '<div class="muted" style="padding:4px 2px">Sessions</div>';
  if (sessions.length === 0) {
    list.innerHTML += '<div class="faint" style="padding:4px 2px">No sessions yet — start one from the menu.</div>';
  }
  for (const s of sessions) {
    const row = document.createElement('div');
    row.className = 'row';
    row.setAttribute('role', 'button'); row.tabIndex = 0;
    row.onkeydown = (event) => { if (event.key === 'Enter') void openSession(s.id).catch(showError); };
    const badge = badgeFor(s);
    row.innerHTML = `<span class="badge" style="background:${badge.bg}">${s.running ? '<span class="radar"></span>' : badge.letter}</span>
      <span class="title">${escapeHtml(s.title || (s.workspaceRoot ? s.workspaceRoot.split(/[\\\\/]/).pop() : 'chat'))}</span>
      <span class="faint">${s.messageCount} msg</span>`;
    row.onclick = () => openSession(s.id).catch(showError);
    const del = document.createElement('button');
    del.className = 'delbtn';
    del.textContent = '×';
    del.title = 'Delete session';
    del.onclick = (e) => {
      e.stopPropagation();
      if (!confirm('Delete this session? Its transcript is removed everywhere.')) return;
      jfetch('/api/session/' + s.id, { method: 'DELETE' })
        .then(() => {
          if (currentSession === s.id) { gotoSessions(); return; }
          void loadOverview().catch(showError);
        })
        .catch((error) => showError(error));
    };
    row.appendChild(del);
    list.appendChild(row);
  }
}

function setMode(mode) {
  phoneMode = mode;
  document.getElementById('modeCode').classList.toggle('on', mode === 'code');
  document.getElementById('modeChat').classList.toggle('on', mode === 'chat');
  document.getElementById('folderInput').classList.toggle('hidden', mode !== 'code');
}

async function loadModels() {
  try {
    modelInfo = await jfetch('/api/models');
  } catch { modelInfo = null; }
  const providers = document.getElementById('providerSelect');
  providers.replaceChildren();
  for (const provider of modelInfo?.providers ?? []) {
    const option = document.createElement('option'); option.value = provider.id; option.textContent = provider.label; option.disabled = !provider.available; option.selected = provider.id === modelInfo.provider; providers.append(option);
  }
  const select = document.getElementById('modelSelect');
  if (modelInfo !== null) {
    select.innerHTML = '';
    const current = document.createElement('option');
    current.value = modelInfo.provider + '|' + modelInfo.model;
    current.textContent = 'model: ' + (modelInfo.model || modelInfo.provider);
    select.appendChild(current);
    const entry = modelInfo.providers.find((p) => p.id === modelInfo.provider);
    for (const m of entry?.models ?? []) {
      if (m === modelInfo.model) continue;
      const option = document.createElement('option');
      option.value = modelInfo.provider + '|' + m;
      option.textContent = m;
      select.appendChild(option);
    }
  }
}

async function pickProvider(provider) {
  await pickModel(provider + '|');
}
async function applyCustomModel() {
  const model = document.getElementById('customModelId').value.trim();
  if (model && modelInfo) await pickModel(modelInfo.provider + '|' + model);
}

async function pickModel(value) {
  const [provider, model] = value.split('|');
  try {
    await jfetch('/api/model', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ provider, model })
    });
  } catch (error) { showError('Ganti model gagal: ' + error.message); }
  void loadModels();
}

async function startSession() {
  if (creatingSession) return;
  const body = { mode: phoneMode };
  if (phoneMode === 'code') {
    body.folder = document.getElementById('folderInput').value.trim();
    if (body.folder === '') { showError('Isi dulu folder proyeknya di Mac.'); return; }
  }
  creatingSession = true;
  try {
    const { sessionId } = await jfetch('/api/session', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body)
    });
    await openSession(sessionId);
  } catch (error) { showError(error); }
  finally { creatingSession = false; }
}

async function openSession(id) {
  currentSession = id;
  currentRunId = null;
  liveEl = null;
  hideWorking();
  stopOverviewPolling();
  closeMenu();
  showChatSection();
  document.getElementById('dashboard').classList.add('hidden');
  document.getElementById('chatView').classList.remove('hidden');
  document.getElementById('inputRow').classList.remove('hidden');
  setMenuTitle(titleFor(id));
  await listen(id);
  await syncSession(id);
}
async function syncSession(id) {
  const version = sessionEventVersion;
  const { messages, runId } = await jfetch('/api/session/' + id);
  if (currentSession !== id || version !== sessionEventVersion) return;
  currentRunId = runId;
  hideWorking();
  liveEl = null;
  liveGroup = null;
  renderTranscript(messages);
  // The pause marker is ours, not the transcript's, so a re-sync has to put it
  // back; it disappears on its own once the session is resumed.
  if (pausedSessions.has(id)) appendUserBubble(PAUSE_LABEL);
  // A group still holding an unfinished step already reads as working; a
  // second dot below it would double up on the desktop's single indicator.
  if (runId && !tailRunning) showWorking();
  updateSendBtn();
}

/* Tool calls fold into three simple groups, mirroring the desktop. */
function toolCategory(name) {
  if (name === 'run_command') return 'code';
  if (/^(write|edit|delete|add|fill)_/.test(name)) return 'edit';
  return 'explore';
}

function toolSubject(item) {
  const input = item.input || {};
  for (const key of ['command', 'path', 'url', 'query', 'cell']) {
    if (typeof input[key] === 'string' && input[key] !== '') return input[key];
  }
  return item.name;
}


/* The same glass gradients the desktop badges use; a session always gets the
 * same colour by hashing its id. */
const BADGE_COLOURS = [
  ['#7a5cc4', '#4f3a8f'], ['#3f8f86', '#2c6b64'], ['#c2603f', '#8f4630'],
  ['#3f7fc2', '#2c5e92'], ['#b0873a', '#82632c'], ['#8f4f7a', '#6a3c5c'],
  ['#4f8f4f', '#386b38'], ['#c24f7a', '#923a5c'], ['#5c7ac2', '#43598f'],
  ['#c27a3f', '#925c30']
];

function badgeFor(s) {
  const title = s.mode === 'code'
    ? (s.workspaceRoot ? s.workspaceRoot.split(/[\\/]/).pop() : 'session')
    : 'antichat';
  let hash = 0;
  for (const ch of s.id) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
  const [c1, c2] = BADGE_COLOURS[hash % BADGE_COLOURS.length];
  return { letter: title.charAt(0).toUpperCase(), bg: `linear-gradient(135deg, ${c1}f2, ${c2}d9)` };
}

/* Lightweight markdown so the phone reads like the desktop: **bold**, `code`
 * as plain mono (no purple chip), and # headings demoted to bold lines. */
function appendRichText(parent, text) {
  for (const line of text.split('\n')) {
    const row = document.createElement('div');
    const heading = line.match(/^#{1,6}\s+(.*)$/);
    const content = heading !== null ? heading[1] : line;
    const re = /(\*\*[^*]+\*\*|`[^`]+`)/g;
    let last = 0;
    let match;
    while ((match = re.exec(content)) !== null) {
      if (match.index > last) row.appendChild(document.createTextNode(content.slice(last, match.index)));
      const token = match[0];
      if (token.startsWith('**')) {
        const b = document.createElement('strong');
        b.textContent = token.slice(2, -2);
        row.appendChild(b);
      } else {
        const c = document.createElement('code');
        c.className = 'icode';
        c.textContent = token.slice(1, -1);
        row.appendChild(c);
      }
      last = match.index + token.length;
    }
    if (last < content.length) row.appendChild(document.createTextNode(content.slice(last)));
    parent.appendChild(row);
  }
}

/** Which of the three work types a tool belongs to, as a display label. */
function toolLabel(name) {
  return { code: 'Code', edit: 'Edit', explore: 'Explore' }[toolCategory(name)];
}

/** One step inside an open group: its name, subject, and output on tap. */
function toolRowEl(item) {
  const row = document.createElement('details');
  row.className = 'trow';
  const head = document.createElement('summary');
  const name = document.createElement('span');
  name.className = 'tname' + (item.result?.isError === true ? ' bad' : '');
  name.textContent = toolLabel(item.name);
  const subject = document.createElement('span');
  subject.className = 'tsubject';
  subject.textContent = toolSubject(item);
  const chev = document.createElement('span');
  chev.className = 'tchev';
  chev.textContent = item.result === undefined ? '\u00b7\u00b7\u00b7' : '\u2304';
  head.append(name, subject, chev);
  const out = document.createElement('pre');
  out.className = 'tout';
  const shell = item.name === 'run_command' ? '$ ' + toolSubject(item) + '\n\n' : '';
  out.textContent = shell + (item.result?.content || '(no output yet)');
  row.append(head, out);
  row.addEventListener('toggle', () => {
    if (item.result !== undefined) chev.textContent = row.open ? '\u2303' : '\u2304';
  });
  return row;
}

/* A run of tool calls folds into one line — the desktop's ToolGroup, verbatim:
 * "ran 5 steps" while it is history, "working · 5 steps" while it runs. */
function toolGroupEl(items) {
  const details = document.createElement('details');
  details.className = 'tgroup';
  const summary = document.createElement('summary');
  const running = items.some((item) => item.result === undefined);
  const failed = items.filter((item) => item.result?.isError === true).length;
  const dot = document.createElement('span');
  dot.className = 'tdot' + (running ? ' live' : failed > 0 ? ' bad' : '');
  const label = document.createElement('span');
  label.className = 'tlabel';
  label.textContent = running
    ? 'working \u00b7 ' + items.length + ' steps'
    : failed > 0
      ? 'ran ' + items.length + ' steps \u00b7 ' + failed + ' failed'
      : 'ran ' + items.length + ' steps';
  const chev = document.createElement('span');
  chev.className = 'tchev';
  chev.textContent = '\u2304';
  summary.append(dot, label, chev);
  details.appendChild(summary);
  details.addEventListener('toggle', () => { chev.textContent = details.open ? '\u2303' : '\u2304'; });

  const body = document.createElement('div');
  body.className = 'tbody';
  for (const item of items) body.appendChild(toolRowEl(item));
  details.appendChild(body);
  return details;
}

/**
 * The provider transcript splits one run across many assistant messages, with
 * a tool-result message wedged between each pair. The desktop draws that run
 * as a single message, so the same folding happens here before rendering.
 */
function foldTurns(messages) {
  const turns = [];
  for (const m of messages) {
    const blocks = m.blocks.filter((b) => b.type !== 'tool_result');
    if (blocks.length === 0) continue;
    const last = turns.at(-1);
    if (m.role === 'assistant' && last !== undefined && last.role === 'assistant') {
      last.blocks.push(...blocks);
    } else {
      turns.push({ role: m.role, blocks });
    }
  }
  return turns;
}

/** True when the transcript ends on a tool group whose last step is still running. */
let tailRunning = false;

function renderTranscript(messages) {
  const el = document.getElementById('transcript');
  el.innerHTML = '';
  tailRunning = false;
  const results = new Map();
  for (const m of messages) {
    for (const b of m.blocks) {
      if (b.type === 'tool_result') results.set(b.toolUseId, b);
    }
  }
  for (const m of foldTurns(messages)) {
    tailRunning = false;
    if (m.role === 'user') {
      const files = m.blocks.filter((block) => block.type === 'attachment').map((block) => block.attachment);
      const text = m.blocks.map((b) => (b.type === 'text' ? b.text : '')).join('').trim();
      if (text === '' && files.length === 0) continue;
      const div = document.createElement('div');
      div.className = 'msg user';
      if (files.length > 0) div.appendChild(attachmentsEl(files));
      if (text !== '') {
        const bubble = document.createElement('span');
        bubble.className = 'bubble';
        bubble.textContent = promptLabel(text);
        div.appendChild(bubble);
      }
      el.appendChild(div);
      continue;
    }
    const div = document.createElement('div');
    div.className = 'msg assistant';
    const textBuf = [];
    const produced = [];
    let group = null;
    const flushText = () => {
      const text = textBuf.join('').trim();
      if (text !== '') {
        const p = document.createElement('div');
        p.style.whiteSpace = 'pre-wrap';
        appendRichText(p, text);
        div.appendChild(p);
        tailRunning = false;
      }
      textBuf.length = 0;
    };
    const flushGroup = () => {
      if (group === null) return;
      div.appendChild(toolGroupEl(group));
      tailRunning = group.some((item) => item.result === undefined);
      group = null;
    };
    for (const b of m.blocks) {
      if (b.type === 'text') { flushGroup(); textBuf.push(b.text); continue; }
      if (b.type !== 'tool_use') continue;
      if (group === null) { flushText(); group = []; }
      const item = { name: b.name, input: b.input, result: results.get(b.id) };
      group.push(item);
      produced.push(item);
    }
    flushGroup();
    flushText();
    for (const target of documentsProduced(produced)) {
      div.appendChild(artifactEl(currentSession, target));
    }
    el.appendChild(div);
  }
}

function listen(id) {
  if (eventSource && eventSource.url.includes('sessionId=' + encodeURIComponent(id) + '&') && eventSource.readyState !== EventSource.CLOSED) return streamReady;
  if (eventSource) eventSource.close();
  const source = new EventSource('/api/events?sessionId=' + encodeURIComponent(id) + '&token=' + encodeURIComponent(token));
  eventSource = source;
  let connected = false;
  streamReady = new Promise((resolve, reject) => {
    const timer = setTimeout(() => { source.close(); reject(new Error('Connection timed out. Reopen this session.')); }, 10000);
    source.onopen = () => { clearTimeout(timer); resolve(); if (connected) void syncSession(id).catch(showError); connected = true; };
    source.onerror = () => { clearTimeout(timer); reject(new Error('Connection lost. Reconnecting…')); };
  });
  source.onmessage = async (e) => {
    if (currentSession !== id || eventSource !== source) return;
    const event = JSON.parse(e.data);
    if (event.type !== 'usage') sessionEventVersion++;
    if (event.type === 'prompt') { currentRunId = event.runId; liveEl = null; liveGroup = null; hideWorking(); appendUserBubble(event.text, event.attachments); showWorking(); }
    else if (event.type === 'text_delta') { currentRunId = event.runId; liveGroup = null; hideWorking(); appendLive(event.text); }
    else if (event.type === 'tool_start') { currentRunId = event.runId; liveEl = null; liveToolStart(event.toolUseId, event.name, event.input); }
    else if (event.type === 'tool_end') { liveToolEnd(event.toolUseId, event.ok, event.output); }
    else if (event.type === 'end' || event.type === 'error') {
      hideWorking();
      liveGroup = null;
      currentRunId = null;
      if (event.reason === 'cancelled') pausedSessions.add(id);
      updateSendBtn();
      try { await syncSession(id); } catch (error) { showError(error); }
      if (event.type === 'error' && currentSession === id) appendLive('Error: ' + event.message);
    }
    updateSendBtn();
  };
  return streamReady;
}

let workingEl = null;
function showWorking() {
  if (workingEl === null) {
    workingEl = document.createElement('div');
    workingEl.className = 'working';
    const dot = document.createElement('span');
    dot.className = 'dot';
    const label = document.createElement('span');
    workingEl.appendChild(dot);
    workingEl.appendChild(label);
    document.getElementById('transcript').appendChild(workingEl);
  }
  workingEl.lastChild.textContent = 'working';
  window.scrollTo(0, document.body.scrollHeight);
}
function hideWorking() {
  workingEl?.remove();
  workingEl = null;
}

/* The run of tool calls currently streaming. It is one element, rebuilt as
 * steps arrive, so the phone reads "working · 5 steps" mid-run and settles to
 * "ran 5 steps" — the same live group the desktop draws. */
let liveGroup = null;

function liveToolStart(toolUseId, name, input) {
  const el = document.getElementById('transcript');
  if (liveGroup === null || !el.contains(liveGroup.el)) liveGroup = { el: null, items: [] };
  liveGroup.items.push({ id: toolUseId, name, input, result: undefined });
  redrawLiveGroup();
}

function liveToolEnd(toolUseId, ok, output) {
  const item = liveGroup?.items.find((entry) => entry.id === toolUseId);
  if (item === undefined) return;
  item.result = { content: output, isError: !ok };
  redrawLiveGroup();
}

/* While a step is in flight the group says so itself; once they have all
 * landed the model is thinking again, which is what the working dot means. */
function redrawLiveGroup() {
  const el = document.getElementById('transcript');
  const next = toolGroupEl(liveGroup.items);
  if (liveGroup.el !== null && el.contains(liveGroup.el)) el.replaceChild(next, liveGroup.el);
  else el.appendChild(next);
  liveGroup.el = next;
  if (liveGroup.items.some((item) => item.result === undefined)) hideWorking();
  else showWorking();
  window.scrollTo(0, document.body.scrollHeight);
}

let liveEl = null;
function appendLive(text) {
  const el = document.getElementById('transcript');
  if (liveEl === null || !el.contains(liveEl)) {
    liveEl = document.createElement('div');
    liveEl.className = 'msg assistant';
    el.appendChild(liveEl);
  }
  liveEl.textContent += text;
  window.scrollTo(0, document.body.scrollHeight);
}

/* ---------- Attachments ---------- */

let staged = [];

function formatBytes(size) {
  if (size < 1024) return size + ' B';
  if (size < 1024 * 1024) return Math.round(size / 1024) + ' KB';
  return (size / 1024 / 1024).toFixed(1) + ' MB';
}

function tagFor(kind) {
  return { image: 'IMG', text: 'TXT', excel: 'XLS', docx: 'DOC', pdf: 'PDF', binary: 'BIN' }[kind] || 'BIN';
}

function renderStaged() {
  const row = document.getElementById('stagedRow');
  row.replaceChildren();
  row.classList.toggle('hidden', staged.length === 0);
  for (const item of staged) {
    const chip = document.createElement('div');
    chip.className = 'chip';
    if (item.thumbnail) {
      const img = document.createElement('img');
      img.src = item.thumbnail;
      img.alt = item.name;
      chip.appendChild(img);
    } else {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = tagFor(item.kind);
      chip.appendChild(tag);
    }
    const label = document.createElement('span');
    const name = document.createElement('span');
    name.className = 'nm';
    name.textContent = item.name;
    const size = document.createElement('span');
    size.className = 'sz';
    size.textContent = formatBytes(item.size);
    label.append(name, size);
    chip.appendChild(label);
    const remove = document.createElement('button');
    remove.className = 'x';
    remove.textContent = '×';
    remove.title = 'Remove';
    remove.onclick = () => { staged = staged.filter((entry) => entry.id !== item.id); renderStaged(); };
    chip.appendChild(remove);
    row.appendChild(chip);
  }
}

function readAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = () => reject(new Error('Could not read ' + file.name));
    reader.readAsDataURL(file);
  });
}

async function onFilesPicked(files) {
  const picked = Array.from(files || []);
  document.getElementById('fileInput').value = '';
  for (const file of picked) {
    try {
      const data = await readAsBase64(file);
      const info = await jfetch('/api/attachment', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ name: file.name, data })
      });
      staged.push(info);
      renderStaged();
    } catch (error) { showError(error); }
  }
}

/* The files that rode with a prompt, drawn the way they were sent. */
function attachmentsEl(items) {
  const wrap = document.createElement('div');
  wrap.className = 'atts';
  for (const item of items) {
    if (item.thumbnail) {
      const box = document.createElement('div');
      box.className = 'att';
      const img = document.createElement('img');
      img.src = item.thumbnail;
      img.alt = item.name;
      box.appendChild(img);
      wrap.appendChild(box);
      continue;
    }
    const card = document.createElement('div');
    card.className = 'att file';
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = tagFor(item.kind);
    const label = document.createElement('span');
    const name = document.createElement('span');
    name.className = 'nm';
    name.textContent = item.name;
    const size = document.createElement('span');
    size.className = 'sz';
    size.textContent = formatBytes(item.size);
    label.append(name, size);
    card.append(tag, label);
    wrap.appendChild(card);
  }
  return wrap;
}

/* Documents a run produced, offered as downloads — the same rule the desktop
 * uses: a successful write of something a person opens rather than reads. */
const DOCUMENT_EXTENSIONS = ['.pdf', '.xlsx', '.xlsm', '.docx', '.csv', '.pptx', '.zip'];

function documentsProduced(items) {
  const paths = [];
  for (const item of items) {
    if (!/^(write|create|fill|add)_/.test(item.name)) continue;
    if (item.result === undefined || item.result.isError) continue;
    const input = item.input || {};
    const target = typeof input.output_path === 'string' ? input.output_path : input.path;
    if (typeof target !== 'string') continue;
    const dot = target.lastIndexOf('.');
    if (dot === -1 || !DOCUMENT_EXTENSIONS.includes(target.slice(dot).toLowerCase())) continue;
    if (!paths.includes(target)) paths.push(target);
  }
  return paths;
}

function artifactEl(sessionId, target) {
  const row = document.createElement('div');
  row.className = 'artifact';
  const tag = document.createElement('span');
  tag.className = 'tag';
  tag.textContent = target.slice(target.lastIndexOf('.') + 1, target.lastIndexOf('.') + 4).toUpperCase();
  const name = document.createElement('span');
  name.className = 'nm';
  name.textContent = target;
  const link = document.createElement('a');
  link.href = '/api/download?sessionId=' + encodeURIComponent(sessionId) +
    '&path=' + encodeURIComponent(target) + '&token=' + encodeURIComponent(token);
  link.textContent = 'Download';
  link.setAttribute('download', target.split('/').pop());
  row.append(tag, name, link);
  return row;
}

function sendBtnState() {
  const running = currentRunId !== null;
  const paused = currentSession !== null && pausedSessions.has(currentSession);
  if (running) return 'running';
  if (paused) return 'resume';
  return 'send';
}

function updateSendBtn() {
  document.getElementById('inputRow').classList.toggle('hidden', !currentSession || !document.getElementById('viewFiles').classList.contains('hidden'));
  const btn = document.getElementById('sendBtn');
  const state = sendBtnState();
  btn.disabled = submitting || (currentRunId !== null && pausedSessions.has(currentSession));
  btn.classList.toggle('lime', state === 'resume');
  btn.classList.toggle('stopping', state === 'running');
  btn.textContent = state === 'running' ? '❚❚' : '↑';
  btn.title = state === 'resume' ? 'Resume' : state === 'running' ? 'Pause' : 'Send';
}

function onSendBtn() {
  const state = sendBtnState();
  if (state === 'running') void pauseSession();
  else if (state === 'resume') void resumeSession();
  else void sendPrompt();
}

async function pauseSession() {
  if (currentRunId === null || currentSession === null) return;
  try {
    await jfetch('/api/cancel', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ runId: currentRunId }) });
    pausedSessions.add(currentSession);
    appendUserBubble(PAUSE_LABEL);
    updateSendBtn();
  } catch (error) { showError(error); }
}
/* The words the pause button leaves in the transcript, matching the desktop. */
const PAUSE_LABEL = 'Okay, taking a break mate!';
const RESUME_LABEL = 'ah sh**, here we go again';
/* What a resume actually asks for; the transcript shows RESUME_LABEL instead. */
const CONTINUE_PROMPT = 'Lanjutkan pekerjaan yang terhenti persis dari titik terakhir. Jangan ulangi langkah yang sudah selesai.';
function promptLabel(text) { return text === CONTINUE_PROMPT ? RESUME_LABEL : text; }
async function resumeSession() { await submitPrompt(CONTINUE_PROMPT); }

function appendUserBubble(text, files) {
  const el = document.getElementById('transcript');
  const div = document.createElement('div');
  div.className = 'msg user';
  if (files !== undefined && files.length > 0) div.appendChild(attachmentsEl(files));
  const bubble = document.createElement('span');
  bubble.className = 'bubble';
  bubble.textContent = promptLabel(text);
  div.appendChild(bubble);
  el.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
}

async function sendPrompt() {
  const input = document.getElementById('prompt');
  const prompt = input.value.trim();
  if (await submitPrompt(prompt)) input.value = '';
}
async function submitPrompt(prompt) {
  if (!prompt || !currentSession || currentRunId || submitting) return false;
  const id = currentSession;
  const attachmentIds = staged.map((item) => item.id);
  submitting = true;
  updateSendBtn();
  try {
    await listen(id);
    await jfetch('/api/prompt', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ sessionId: id, prompt, attachmentIds })
    });
    staged = [];
    renderStaged();
    pausedSessions.delete(id);
    // The stream is already subscribed, including for immediately completed runs.

    return true;
  } catch (error) { showError(error); return false; }
  finally { submitting = false; updateSendBtn(); }
}

function canLeaveEditor() { return openedFile === null || document.getElementById('editor').value === savedContent || confirm('Discard unsaved file changes?'); }

/* ---------- Files ---------- */

async function refreshFilesTab() {
  const { sessions } = await jfetch('/api/overview');
  const select = document.getElementById('folderSession');
  const code = sessions.filter((s) => s.mode === 'code' && s.workspaceRoot);
  select.innerHTML = '';
  if (code.length === 0) {
    select.innerHTML = '<option value="">Create an anticode session first</option>';
    setFileControlsEnabled(false);
    document.getElementById('crumb').textContent = '/';
    document.getElementById('dirList').innerHTML = '';
    document.getElementById('editor').classList.add('hidden');
    return;
  }
  for (const s of code) {
    const option = document.createElement('option');
    option.value = s.id;
    option.textContent = s.workspaceRoot.split(/[\\\\/]/).pop();
    select.appendChild(option);
  }
  if (!folderReady || code.some((s) => s.id === select.value) === false) folderReady = true;
  setFileControlsEnabled(true);
  currentPath = '.';
  openedFile = null;
  document.getElementById('editor').classList.add('hidden');
  await renderListing();
}

function onSessionChange() {
  if (!canLeaveEditor()) { document.getElementById('folderSession').value = openedSessionId; return; }
  currentPath = '.';
  openedFile = null;
  document.getElementById('editor').classList.add('hidden');
  void renderListing().catch(showError);
}

function setFileControlsEnabled(enabled) {
  for (const id of ['saveBtn', 'gitStatusBtn', 'gitCommitBtn', 'gitPushBtn']) {
    document.getElementById(id).disabled = !enabled;
  }
  if (!enabled) {
    document.getElementById('saveBtn').disabled = true;
    document.getElementById('gitStatusBtn').disabled = true;
    document.getElementById('gitCommitBtn').disabled = true;
    document.getElementById('gitPushBtn').disabled = true;
  }
}

function joinPath(base, name) {
  return base === '.' ? name : base.replace(/\/$/, '') + '/' + name;
}

function parentPath(p) {
  if (p === '.' || p === '') return '.';
  const parts = p.replace(/\/$/, '').split('/');
  parts.pop();
  return parts.length === 0 ? '.' : parts.join('/');
}

async function renderListing() {
  const sessionId = document.getElementById('folderSession').value;
  if (!sessionId) return;
  document.getElementById('crumb').textContent = currentPath;
  const requestedPath = currentPath;
  const result = await jfetch('/api/files?sessionId=' + sessionId + '&path=' + encodeURIComponent(currentPath));
  if (requestedPath !== currentPath || sessionId !== document.getElementById('folderSession').value) return;
  const dir = document.getElementById('dirList');
  const editor = document.getElementById('editor');
  dir.innerHTML = '';
  if (result.kind !== 'directory') {
    editor.classList.remove('hidden');
    editor.value = result.content;
    savedContent = result.content;
    fileVersion = result.version;
    openedFile = currentPath;
    openedSessionId = sessionId;
    document.getElementById('saveBtn').disabled = false;
    return;
  }
  editor.classList.add('hidden');
  openedFile = null;
  document.getElementById('saveBtn').disabled = true;
  if (currentPath !== '.') {
    const back = document.createElement('div');
    back.className = 'dirrow';
    back.innerHTML = '<span class="back">← up</span>';
    back.onclick = () => { currentPath = parentPath(currentPath); void renderListing().catch(showError); };
    dir.appendChild(back);
  }
  const folders = result.entries.filter((e) => e.endsWith('/'));
  const files = result.entries.filter((e) => !e.endsWith('/'));
  for (const entry of [...folders, ...files]) {
    const isFolder = entry.endsWith('/');
    const row = document.createElement('div');
    row.className = 'dirrow' + (isFolder ? ' folder' : '');
    row.innerHTML = `<span class="name">${escapeHtml(entry)}</span>`;
    row.onclick = () => {
      currentPath = joinPath(currentPath, entry);
      void renderListing().catch(showError);
    };
    // Anything the agent produced — a PDF, a workbook — leaves the Mac here.
    if (!isFolder) {
      const link = document.createElement('a');
      link.className = 'dl';
      link.textContent = '↓';
      link.title = 'Download';
      link.href = '/api/download?sessionId=' + encodeURIComponent(sessionId) +
        '&path=' + encodeURIComponent(joinPath(currentPath, entry)) +
        '&token=' + encodeURIComponent(token);
      link.setAttribute('download', entry);
      link.onclick = (event) => event.stopPropagation();
      row.appendChild(link);
    }
    dir.appendChild(row);
  }
}

function upDir() {
  if (!canLeaveEditor()) return;
  currentPath = parentPath(currentPath);
  openedFile = null;
  void renderListing().catch(showError);
}

async function saveFile() {
  if (openedFile === null) return;
  const sessionId = document.getElementById('folderSession').value;
  const content = document.getElementById('editor').value;
  const saved = await jfetch('/api/files', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ sessionId, path: openedFile, content, version: fileVersion })
  });
  const out = document.getElementById('gitOut');
  out.classList.remove('hidden');
  out.textContent = 'Saved ' + openedFile;
  fileVersion = saved.version; savedContent = content;
}

async function gitAction(action) {
  const sessionId = document.getElementById('folderSession').value;
  let message = '';
  if (action === 'commit') {
    message = window.prompt('Commit message (includes all project changes):');
    if (message === null) return;
    if (!message.trim()) { showError('Enter a commit message.'); return; }
  }
  const result = await jfetch('/api/git', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ sessionId, action, message })
  });
  const out = document.getElementById('gitOut');
  out.classList.remove('hidden');
  out.textContent = result.ok ? result.output || 'ok' : 'FAILED: ' + result.output;
}

document.getElementById('prompt').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendPrompt(); }
});
document.addEventListener('click', (e) => {
  const drop = document.getElementById('menuDrop');
  if (!drop.classList.contains('hidden') && !drop.contains(e.target) && e.target.closest('#menuBtn') === null) {
    closeMenu();
  }
});
gotoSessions();
</script>
