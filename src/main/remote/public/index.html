    row.className = quote !== null ? 'md-quote' : 'md-p';
    appendInline(row, (quote !== null ? quote[1] : line).replace(/\s*[\u2713\u2714](\s*)$/, ' \u2705$1'));
    push(row, 'text');
  }
}

/** A file change, one line per row, green and red like the desktop's viewer. */
function renderDiff(out, diff) {
  out.classList.add('diff');
  for (const line of diff.split('\n')) {
    if (/^(Index:|={3,}|--- |\+\+\+ )/.test(line)) continue;
    const row = document.createElement('div');
    row.className = line.startsWith('+') ? 'dadd' : line.startsWith('-') ? 'ddel' : line.startsWith('@@') ? 'dhunk' : '';
    row.textContent = line === '' ? ' ' : line;
    out.appendChild(row);
  }
}

/** Which of the three work types a tool belongs to, as a display label. */
function toolLabel(name) {
  return { agent: 'Agent', mcp: 'MCP', code: 'Code', edit: 'Edit', explore: 'Explore' }[toolCategory(name)];
}

/** One step inside an open group: its name, subject, and output on tap. */
function toolRowEl(item) {
  const row = document.createElement('details');
  row.className = 'trow';
  const head = document.createElement('summary');
  const name = document.createElement('span');
  name.className = 'tname' + (item.result?.isError === true ? ' bad' : '');
  name.textContent = toolLabel(item.name);
  const subject = document.createElement('span');
  subject.className = 'tsubject';
  subject.textContent = toolSubject(item);
  const chev = document.createElement('span');
  chev.className = 'tchev';
  chev.textContent = item.result === undefined ? '\u00b7\u00b7\u00b7' : '\u2304';
  head.append(name, subject, chev);
  const out = document.createElement('pre');
  out.className = 'tout';
  const shell = item.name === 'run_command' ? '$ ' + toolSubject(item) + '\n\n' : '';
  if (typeof item.result?.diff === 'string') renderDiff(out, item.result.diff);
  else out.textContent = shell + (item.result?.content || '(no output yet)');
  row.append(head, out);
  row.addEventListener('toggle', () => {
    if (item.result !== undefined) chev.textContent = row.open ? '\u2303' : '\u2304';
  });
  return row;
}

function stepCount(count) {
  return count + (count === 1 ? ' step' : ' steps');
}

/* A run of tool calls folds into one line — the desktop's ToolGroup, verbatim:
 * "ran 5 steps" while it is history, "working · 5 steps" while it runs. */
function toolGroupEl(items, live = false) {
  const details = document.createElement('details');
  details.className = 'tgroup';
  const summary = document.createElement('summary');
  // The live group says "working" between steps too, while the model picks
  // its next tool — otherwise it flips to "ran" and back on every step.
  const running = live || items.some((item) => item.result === undefined);
  const failed = items.filter((item) => item.result?.isError === true).length;
  const dot = document.createElement('span');
  dot.className = 'tdot' + (running ? ' live' : failed > 0 ? ' bad' : '');
  const label = document.createElement('span');
  label.className = 'tlabel';
  // The step count is kept on the element so a `phase` event can rewrite the
  // header in place — one line naming both the phase and the count, as the
  // desktop draws it, instead of a second "working" line under the group.
  const count = stepCount(items.length);
  label.dataset.count = count;
  label.textContent = running
    ? (runPhaseLabel ?? 'working') + ' \u00b7 ' + count
    : failed > 0
      ? 'ran ' + count + ' \u00b7 ' + failed + ' failed'
      : 'ran ' + count;
  const chev = document.createElement('span');
  chev.className = 'tchev';
  chev.textContent = '\u2304';
  summary.append(dot, label, chev);
  details.appendChild(summary);
  details.addEventListener('toggle', () => {
    chev.textContent = details.open ? '\u2303' : '\u2304';
    // While this group is the live run, the working line mirrors it: expanded
    // hides "working", collapsed shows it — so either line collapses the steps.
    if (running && workingEl !== null) {
      workingEl.style.display = details.open ? 'none' : '';
    }
  });

  const body = document.createElement('div');
  body.className = 'tbody';
  for (const item of items) body.appendChild(toolRowEl(item));
  details.appendChild(body);
  return details;
}

/**
 * The provider transcript splits one run across many assistant messages, with
 * a tool-result message wedged between each pair. The desktop draws that run
 * as a single message, so the same folding happens here before rendering.
 */
function formatDuration(ms) {
  const total = Math.max(0, Math.round(ms / 1000));
  return total < 60 ? total + 's' : Math.floor(total / 60) + 'm ' + (total % 60) + 's';
}

/** The closing line for one finished run, mirroring the desktop's footnote. */
function runSummaryEl(summary, said) {
  const row = document.createElement('div');
  row.className = 'runsum';
  const model = document.createElement('span');
  model.textContent = summary.model === '' ? 'done' : summary.model;
  const copy = document.createElement('button');
  copy.className = 'copy';
  copy.title = 'Copy this reply';
  copy.textContent = '\u29c9';
  const tokens = (summary.inputTokens || 0) + (summary.outputTokens || 0);
  copy.onclick = () => {
    const stats = [summary.model, formatDuration(summary.durationMs), tokens.toLocaleString('en-US') + ' tokens'];
    const text = [said.trim(), stats.join(' \u00b7 ')].filter((part) => part !== '').join('\n\n');
    void navigator.clipboard?.writeText(text).then(() => {
      copy.textContent = 'copied';
      setTimeout(() => { copy.textContent = '\u29c9'; }, 1500);
    }).catch(() => { copy.textContent = '\u29c9'; });
  };
  const rest = document.createElement('span');
  rest.textContent = '\u00b7 ' + formatDuration(summary.durationMs) +
    (tokens > 0 ? ' \u00b7 ' + tokens.toLocaleString('en-US') + ' tokens' : '');
  row.append(model, copy, rest);
  return row;
}

function foldTurns(messages) {
  const turns = [];
  for (const m of messages) {
    const blocks = m.blocks.filter((b) => b.type !== 'tool_result');
    if (blocks.length === 0) continue;
    const last = turns.at(-1);
    if (m.role === 'user' && blocks.length === 1 && blocks[0].type === 'text' && blocks[0].text === CONTINUE_PROMPT) {
      if (last !== undefined && last.role === 'assistant') {
        last.blocks.push({ type: 'display', kind: 'notice', text: RESUME_LABEL });
      }
      continue;
    }
    if (m.role === 'assistant' && last !== undefined && last.role === 'assistant') {
      last.blocks.push(...blocks);
    } else {
      // An assistant turn followed by a follow-up the run took in did not end
      // that run: it gets no closing line, the turn after it does.
      const followUp = m.role === 'user' ? blocks.find((b) => b.type === 'text' && b.followUp)?.followUp : undefined;
      if (followUp === 'during' && last !== undefined && last.role === 'assistant') last.continued = true;
      turns.push({ role: m.role, blocks, followUp });
    }
  }
  return turns;
}

/** True when the transcript ends on a tool group whose last step is still running. */
let tailRunning = false;

function renderTranscript(messages, summaries) {
  const el = document.getElementById('transcript');
  el.innerHTML = '';
  tailRunning = false;
  // One summary per assistant turn, oldest first — the main process drops the
  // ones whose run never answered, so the two lists line up from the end.
  const list = Array.isArray(summaries) ? summaries : [];
  const turnCount = foldTurns(messages).filter((turn) => turn.role === 'assistant' && !turn.continued).length;
  const offset = turnCount - list.length;
  let turnIndex = 0;
  const results = new Map();
  for (const m of messages) {
    for (const b of m.blocks) {
      if (b.type === 'tool_result') results.set(b.toolUseId, b);
    }
  }
  for (const m of foldTurns(messages)) {
    tailRunning = false;
    if (m.role === 'user') {
      const files = m.blocks.filter((block) => block.type === 'attachment').map((block) => block.attachment);
      const text = m.blocks.map((b) => (b.type === 'text' ? b.text : '')).join('').trim();
      if (text === '' && files.length === 0) continue;
      // A resume is the app talking, so it reads as a marker, not a prompt.
      if (text === CONTINUE_PROMPT && files.length === 0) {
        appendNotice(RESUME_LABEL);
        continue;
      }
      const div = document.createElement('div');
      div.className = 'msg user';
      if (files.length > 0) div.appendChild(attachmentsEl(files));
      if (text !== '') {
        const bubble = document.createElement('span');
        bubble.className = 'bubble';
        bubble.textContent = text;
        div.appendChild(bubble);
      }
      el.appendChild(div);
      if (m.followUp) appendNotice(FOLLOW_UP_LABEL);
      continue;
    }
    const div = document.createElement('div');
    div.className = 'msg assistant';
    const textBuf = [];
    const produced = [];
    let group = null;
    const flushText = () => {
      const text = textBuf.join('').trim();
      if (text !== '') {
        const p = document.createElement('div');
        p.style.whiteSpace = 'pre-wrap';
        appendRichText(p, text);
        div.appendChild(p);
        tailRunning = false;
      }
      textBuf.length = 0;
    };
    const flushGroup = () => {
      if (group === null) return;
      div.appendChild(toolGroupEl(group));
      tailRunning = group.some((item) => item.result === undefined);
      group = null;
    };
    for (const b of m.blocks) {
      if (b.type === 'text') { flushGroup(); textBuf.push(b.text); continue; }
      if (b.type === 'display') {
        flushGroup(); flushText();
        const state = document.createElement('div');
        state.className = 'notice';
        if (b.kind === 'error') state.style.color = '#f3aaaa';
        state.textContent = b.text;
        div.appendChild(state);
        continue;
      }
      if (b.type !== 'tool_use') continue;
      if (group === null) { flushText(); group = []; }
      const item = { name: b.name, input: b.input, result: results.get(b.id) };
      group.push(item);
      produced.push(item);
    }
    flushGroup();
    flushText();
    const chat = lastSessions.find((entry) => entry.id === currentSession)?.mode === 'chat';
    for (const target of documentsProduced(produced, chat)) {
      div.appendChild(artifactEl(currentSession, target));
    }
    // A turn the run carried on from takes no closing line or place in the list.
    const summary = m.continued ? undefined : list[turnIndex - offset];
    if (!m.continued) turnIndex++;
    if (summary !== undefined) {
      const said = m.blocks.filter((b) => b.type === 'text').map((b) => b.text).join('');
      div.appendChild(runSummaryEl(summary, said));
    }
    el.appendChild(div);
  }
}

function listen(id) {
  if (eventSource && eventSource.url.includes('sessionId=' + encodeURIComponent(id) + '&') && eventSource.readyState !== EventSource.CLOSED) return streamReady;
  if (eventSource) eventSource.close();
  const source = new EventSource('/api/events?sessionId=' + encodeURIComponent(id) + '&token=' + encodeURIComponent(token));
  eventSource = source;
  let connected = false;
  streamReady = new Promise((resolve, reject) => {
    const timer = setTimeout(() => { source.close(); reject(new Error('Connection timed out. Reopen this session.')); }, 10000);
    source.onopen = () => { clearTimeout(timer); resolve(); if (connected && currentSession === id && eventSource === source) void syncSession(id).catch(showError); connected = true; };
    source.onerror = () => { connected = true; clearTimeout(timer); reject(new Error('Connection lost. Reconnecting…')); };
  });
  source.onmessage = (e) => {
    if (currentSession !== id || eventSource !== source) return;
    const event = JSON.parse(e.data);
    if (syncing) { syncEvents.push({ id, event }); return; }
    if ((event.revision ?? Infinity) <= appliedRevision) return;
    void applyStreamEvent(id, event).catch(showError);
  };
  return streamReady;
}

async function applyStreamEvent(id, event) {
    if (currentSession !== id) return;
    appliedRevision = Math.max(appliedRevision, event.revision ?? 0);
    if (event.type === 'history') {
      // A turn was reverted on the desktop: what is drawn here no longer exists.
      try { await syncSession(id); } catch (error) { showError(error); }
    }
    else if (event.type === 'pause') {
      // Pressed on either screen; the marker is drawn by whoever hears it.
      if (event.paused) {
        pausedSessions.add(id);
        const last = document.getElementById('transcript').lastElementChild;
        if (!(last?.classList.contains('notice') && last.textContent === PAUSE_LABEL)) appendNotice(PAUSE_LABEL);
      } else {
        pausedSessions.delete(id);
      }
    }
    else if (event.type === 'title') {
      // Named by the main process once its first prompt is in — from here or the desktop.
      const spec = lastSessions.find((entry) => entry.id === id);
      if (spec !== undefined) spec.title = event.title;
      // Made here a moment ago, so not in the last overview yet.
      if (currentSession === id && spec === undefined) setMenuTitle(event.title, phoneMode === 'code' ? 'anticode' : 'antichat', true);
      else if (currentSession === id) showSessionHeader(id);
    }
    else if (event.type === 'prompt') {
      currentRunId = event.runId; liveEl = null; liveRun = null; liveGroup = null; sealedGroups = []; steerAnchor = null; runPhaseLabel = null; hideWorking();
      currentPlan = null; planOpen = null; renderPlan();
      if (event.text === CONTINUE_PROMPT) appendNotice(RESUME_LABEL);
      else appendUserBubble(event.text, event.attachments);
      liveRunEl();
      showWorking();
    }
    else if (event.type === 'steer') {
      // Shown the moment it is sent, under everything; the run keeps writing
      // above it until it takes the instruction in.
      currentRunId = event.runId;
      const bubble = appendUserBubble(event.text, event.attachments);
      if (steerAnchor === null) steerAnchor = bubble;
      appendNotice(FOLLOW_UP_LABEL);
    }
    else if (event.type === 'steer_taken') {
      // From here the run answers the new instructions: its output goes below
      // them, and steps still in flight settle where they were drawn.
      currentRunId = event.runId; steerAnchor = null; liveEl = null; liveRun = null; runPhaseLabel = null; hideWorking();
      settleLiveGroup();
      if (liveGroup !== null) sealedGroups.push(liveGroup);
      liveGroup = null;
      showWorking();
    }
    else if (event.type === 'text_delta') {
      currentRunId = event.runId; settleLiveGroup(); liveGroup = null; appendLive(event.text);
      // Under the text as it streams, as on the desktop — not taken away the
      // moment words arrive, which dropped the transcript by a line.
      showWorking();
    }
    else if (event.type === 'tool_start') { currentRunId = event.runId; liveEl = null; liveToolStart(event.toolUseId, event.name, event.input); }
    else if (event.type === 'phase') {
      // The phase is drawn in one place: the working line while the run waits,
      // or the running step group's own header once steps are streaming.
      runPhaseLabel = PHASE_LABELS[event.phase] ?? null;
      if (workingEl !== null) workingEl.lastChild.textContent = runPhaseLabel ?? 'working';
      const live = document.getElementById('transcript').querySelector('.tdot.live');
      const label = live?.parentElement?.querySelector('.tlabel');
      if (label !== null && label !== undefined && label.dataset.count !== undefined) {
        label.textContent = (runPhaseLabel ?? 'working') + ' \u00b7 ' + label.dataset.count;
      }
    }
    else if (event.type === 'tool_end') { liveToolEnd(event.toolUseId, event.ok, event.output, event.diff); }
    else if (event.type === 'queue') { if (currentSession === id) renderQueue(event.items); }
    else if (event.type === 'notice') { currentRunId = event.runId; liveEl = null; liveRun = null; appendNotice(event.text); }
    else if (event.type === 'end' || event.type === 'error') {
      if (event.type === 'error' && event.retryable === true) pausedSessions.add(id);
      steerAnchor = null;
      liveGroup = null;
      currentRunId = null;
      updateSendBtn();
      // The working line stays until the redraw puts the closing line in its
      // place; taken away first, the transcript dipped while the fetch ran.
      try { await syncSession(id); } catch (error) { hideWorking(); showError(error); }
      if (event.type === 'error' && currentSession === id) appendLive('Error: ' + event.message);
    }
    updateSendBtn();
}

/* The transcript follows new output only while the reader is at its end.
 * Scrolling up to read stops it — the page used to be pulled back down on
 * every word — and scrolling back down, sending a prompt, or opening a
 * session starts it again. */
const FOLLOW_SLACK = 80;
let following = true;
window.addEventListener('scroll', () => {
  following = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - FOLLOW_SLACK;
}, { passive: true });
function followBottom(force) {
  if (force === true) following = true;
  if (following) window.scrollTo(0, document.documentElement.scrollHeight);
}

let workingEl = null;
/** What the run says it is doing — set by `phase` events, shown on the line. */
let runPhaseLabel = null;
const PHASE_LABELS = {
  thinking: 'Thinking',
  command: 'Running command',
  browsing: 'Browsing',
  condensing: 'Condensing context',
  'follow-up': 'Processing follow-up'
};
function showWorking() {
  // A running step group already names its phase in its own header — the one
  // line the desktop draws — so the working line steps aside while it is up.
  if (document.getElementById('transcript').querySelector('.tdot.live') !== null) {
    hideWorking();
    return;
  }
  if (workingEl === null) {
    workingEl = document.createElement('div');
    workingEl.className = 'working';
    workingEl.style.cursor = 'pointer';
    const dot = document.createElement('span');
    dot.className = 'dot';
    const label = document.createElement('span');
    workingEl.appendChild(dot);
    workingEl.appendChild(label);
    // Tapping "working" folds the live steps back up — no scrolling up to find
    // the "ran N steps" header, and back down again to continue watching.
    workingEl.addEventListener('click', () => {
      if (liveGroup?.el !== null && liveGroup?.el !== undefined && document.contains(liveGroup.el)) {
        const summary = liveGroup.el.querySelector('summary');
        if (summary !== null) summary.click();
      }
    });
    if (liveRun !== null && document.getElementById('transcript').contains(liveRun)) liveRun.appendChild(workingEl);
    else placeLive(workingEl);
  }
  // The steps are open right now: the working line steps aside instead of
  // duplicating what the expanded group already says.
  workingEl.style.display = liveGroup?.el?.open === true ? 'none' : '';
  workingEl.lastChild.textContent = runPhaseLabel ?? 'working';
  followBottom();
}
function hideWorking() {
  workingEl?.remove();
  workingEl = null;
}

/* The run of tool calls currently streaming. It is one element, rebuilt as
 * steps arrive, so the phone reads "working · 5 steps" mid-run and settles to
 * "ran 5 steps" — the same live group the desktop draws. */
let liveGroup = null;

function liveToolStart(toolUseId, name, input) {
  if (name === 'todo_write' && Array.isArray(input?.items)) { currentPlan = input.items; renderPlan(); }
  const el = document.getElementById('transcript');
  if (liveGroup === null || !el.contains(liveGroup.el)) liveGroup = { el: null, items: [] };
  liveGroup.items.push({ id: toolUseId, name, input, result: undefined });
  redrawLiveGroup();
}

/* Groups a follow-up closed off while their steps were still running. */
let sealedGroups = [];

function liveToolEnd(toolUseId, ok, output, diff) {
  const item = liveGroup?.items.find((entry) => entry.id === toolUseId);
  if (item === undefined) {
    const sealed = sealedGroups.find((group) => group.items.some((entry) => entry.id === toolUseId));
    const entry = sealed?.items.find((candidate) => candidate.id === toolUseId);
    if (sealed === undefined || entry === undefined) return;
    entry.result = { content: output, isError: !ok, diff };
    const el = document.getElementById('transcript');
    const next = toolGroupEl(sealed.items);
    if (sealed.el !== null && el.contains(sealed.el)) {
      next.open = sealed.el.open;
      sealed.el.replaceWith(next);
    }
    sealed.el = next;
    return;
  }
  item.result = { content: output, isError: !ok, diff };
  redrawLiveGroup();
}

/* The group says "working" itself for as long as it is the newest thing the
 * run drew, so no separate working line comes and goes between steps. It is
 * rebuilt on every step; an open group stays open. */
function redrawLiveGroup() {
  const el = document.getElementById('transcript');
  const next = toolGroupEl(liveGroup.items, true);
  if (liveGroup.el !== null && el.contains(liveGroup.el)) {
    next.open = liveGroup.el.open;
    liveGroup.el.replaceWith(next);
  } else {
    placeInRun(next);
  }
  liveGroup.el = next;
  hideWorking();
  followBottom();
}

/* Something came after the live group — text, or a follow-up taken in — so
 * it is history now and reads "ran N steps", still open if it was. */
function settleLiveGroup() {
  const el = document.getElementById('transcript');
  if (liveGroup === null || liveGroup.el === null || !el.contains(liveGroup.el)) return;
  const next = toolGroupEl(liveGroup.items);
  next.open = liveGroup.el.open;
  liveGroup.el.replaceWith(next);
  liveGroup.el = next;
}

let liveEl = null;

/* One run's output, drawn the way the settled transcript draws it — one
 * assistant message holding its text and its step groups, the working line
 * last — so the redraw when the run ends puts everything where it already is. */
let liveRun = null;
function liveRunEl() {
  const el = document.getElementById('transcript');
  if (liveRun === null || !el.contains(liveRun)) {
    liveRun = document.createElement('div');
    liveRun.className = 'msg assistant';
    // A working line drawn before the run had a place of its own moves in.
    if (workingEl !== null && workingEl.parentNode === el) {
      el.insertBefore(liveRun, workingEl);
      liveRun.appendChild(workingEl);
    } else {
      placeLive(liveRun);
    }
  }
  return liveRun;
}
/** Adds to the live run, above the working line when it is there. */
function placeInRun(node) {
  const run = liveRunEl();
  if (workingEl !== null && workingEl.parentNode === run) run.insertBefore(node, workingEl);
  else run.appendChild(node);
}

/* The first instruction sent into the working run, until the run takes it in.
 * What the run is still writing belongs above it, so live output is placed
 * before this rather than at the end of the transcript. */
let steerAnchor = null;

function placeLive(node) {
  const el = document.getElementById('transcript');
  if (steerAnchor !== null && el.contains(steerAnchor)) el.insertBefore(node, steerAnchor);
  else el.appendChild(node);
}

/* Streamed text goes through the same markdown as the settled transcript, so
 * `code` chips, headings and bullets appear while the model writes rather than
 * only once the run ends. Deltas arrive faster than frames; each live element
 * keeps its raw text and is redrawn at most once a frame. */
const dirtyLive = new Set();
let liveFrame = 0;

/* Redrawing a reply while part of it is selected would drop the selection,
 * and with it the Balas button. Such a reply waits, and catches up with
 * everything it was sent the moment the selection is let go. */
function holdsSelection(node) {
  const selection = window.getSelection();
  return selection !== null && !selection.isCollapsed && selection.rangeCount > 0 &&
    node.contains(selection.getRangeAt(0).commonAncestorContainer);
}

function flushLive() {
  liveFrame = 0;
  for (const node of [...dirtyLive]) {
    if (holdsSelection(node)) continue;
    node.replaceChildren();
    appendRichText(node, node.rawText.trim());
    dirtyLive.delete(node);
  }
  followBottom();
}

function appendLive(text) {
  const el = document.getElementById('transcript');
  if (liveEl === null || !el.contains(liveEl)) {
    // The block the settled transcript draws for the same text.
    liveEl = document.createElement('div');
    liveEl.style.whiteSpace = 'pre-wrap';
    liveEl.rawText = text;
    appendRichText(liveEl, text.trim());
    placeInRun(liveEl);
    followBottom();
    return;
  }
  liveEl.rawText += text;
  dirtyLive.add(liveEl);
  if (liveFrame === 0) liveFrame = requestAnimationFrame(flushLive);
}

/* ---------- Attachments ---------- */

let staged = [];

function formatBytes(size) {
  if (size < 1024) return size + ' B';
  if (size < 1024 * 1024) return Math.round(size / 1024) + ' KB';
  return (size / 1024 / 1024).toFixed(1) + ' MB';
}

/* The file's own extension where it has a short one, so .xlsx never reads as
 * .xls; the kind only when the name does not say. */
function tagFor(item) {
  const dot = item.name.lastIndexOf('.');
  const ext = dot > 0 ? item.name.slice(dot + 1) : '';
  if (/^[a-z0-9]{1,4}$/i.test(ext)) return ext.toUpperCase();
  return { image: 'IMG', text: 'TXT', excel: 'XLSX', docx: 'DOCX', pdf: 'PDF', binary: 'BIN' }[item.kind] || 'BIN';
}

function modelCannotSeeImages(model) {
  return /deepseek-(?:v[34].*flash|chat|coder)|llama3\.2(?!.*vision)/i.test(model || '');
}

function renderStaged() {
  const row = document.getElementById('stagedRow');
  row.replaceChildren();
  row.classList.toggle('hidden', staged.length === 0);
  if (staged.some((item) => item.kind === 'image') && modelCannotSeeImages(modelInfo?.model)) {
    const warning = document.createElement('div');
    warning.className = 'vision-warning';
    warning.textContent = (modelInfo?.model || 'This model') + ' is text-only. Choose a vision model before sending.';
    row.appendChild(warning);
  }
  for (const item of staged) {
    const chip = document.createElement('div');
    chip.className = 'chip';
    if (item.kind === 'image' && (item.localUrl || item.thumbnail)) {
      chip.classList.add('pic');
      chip.onclick = () => openImage({ name: item.name, thumbnail: item.localUrl || item.thumbnail });
    }
    if (item.thumbnail) {
      const img = document.createElement('img');
      img.src = item.thumbnail;
      img.alt = item.name;
      chip.appendChild(img);
    } else {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = tagFor(item);
      chip.appendChild(tag);
    }
    const label = document.createElement('span');
    const name = document.createElement('span');
    name.className = 'nm';
    name.textContent = item.name;
    const size = document.createElement('span');
    size.className = 'sz';
    size.textContent = formatBytes(item.size);
    label.append(name, size);
    chip.appendChild(label);
    const remove = document.createElement('button');
    remove.className = 'x';
    remove.textContent = '×';
    remove.title = 'Remove';
    remove.onclick = (event) => {
      event.stopPropagation();
      if (item.localUrl) URL.revokeObjectURL(item.localUrl);
      staged = staged.filter((entry) => entry.id !== item.id);
      renderStaged();
    };
    chip.appendChild(remove);
    row.appendChild(chip);
  }
}

function readAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = () => reject(new Error('Could not read ' + file.name));
    reader.readAsDataURL(file);
  });
}

async function onFilesPicked(files) {
  const picked = Array.from(files || []);
  document.getElementById('fileInput').value = '';
  for (const file of picked) {
    try {
      const data = await readAsBase64(file);
      const info = await jfetch('/api/attachment', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ name: file.name, data })
      });
      // The phone still holds the picture it just sent up, so the full-size
      // view of a staged one needs no round trip at all.
      staged.push(file.type.startsWith('image/') ? { ...info, localUrl: URL.createObjectURL(file) } : info);
      renderStaged();
    } catch (error) { showError(error); }
  }
}

/* The files that rode with a prompt, drawn the way they were sent. */
/* ---------- Looking at an attached picture ---------- */

function openImage(item) {
  const viewer = document.getElementById('imgViewer');
  const full = document.getElementById('imgFull');
  document.getElementById('imgName').textContent = item.name;
  viewer.classList.remove('zoomed');
  document.getElementById('imgZoom').textContent = 'Perbesar';
  // The original if the session still knows it, the thumbnail if not.
  full.src = item.thumbnail ?? '';
  full.alt = item.name;
  if (currentSession !== null && item.path) {
    const url = '/api/attachment?sessionId=' + encodeURIComponent(currentSession) +
      '&path=' + encodeURIComponent(item.path) + '&token=' + encodeURIComponent(token);
    const probe = new Image();
    probe.onload = () => { full.src = url; };
    probe.src = url;
  }
  viewer.classList.remove('hidden');
}

function closeImage() {
  document.getElementById('imgViewer').classList.add('hidden');
  document.getElementById('imgFull').src = '';
}

function toggleImageZoom() {
  const viewer = document.getElementById('imgViewer');
  const zoomed = viewer.classList.toggle('zoomed');
  document.getElementById('imgZoom').textContent = zoomed ? 'Perkecil' : 'Perbesar';
  document.getElementById('imgBody').scrollTop = 0;
}

function attachmentsEl(items) {
  const wrap = document.createElement('div');
  wrap.className = 'atts';
  for (const item of items) {
    if (item.thumbnail) {
      const box = document.createElement('div');
      box.className = 'att';
      const img = document.createElement('img');
      img.src = item.thumbnail;
      img.alt = item.name;
      img.onclick = () => openImage(item);
      box.appendChild(img);
      wrap.appendChild(box);
      continue;
    }
    const card = document.createElement('div');
    card.className = 'att file';
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = tagFor(item);
    const label = document.createElement('span');
    label.className = 'lbl';
    const name = document.createElement('span');
    name.className = 'nm';
    const dot = item.name.lastIndexOf('.');
    const stem = document.createElement('span');
    stem.className = 'stem';
    stem.textContent = dot > 0 ? item.name.slice(0, dot) : item.name;
    name.appendChild(stem);
    if (dot > 0) {
      const ext = document.createElement('span');
      ext.className = 'ext';
      ext.textContent = item.name.slice(dot);
      name.appendChild(ext);
    }
    const size = document.createElement('span');
    size.className = 'sz';
    size.textContent = formatBytes(item.size);
    label.append(name, size);
    card.append(tag, label);
    if (item.path && currentSession !== null) {
      const sessionId = currentSession;
      card.onclick = () => openFileViewer(sessionId, item.path, true);
    }
    wrap.appendChild(card);
  }
  return wrap;
}

/* Documents a run produced, offered as downloads — the same rule the desktop
 * uses: a successful write of something a person opens rather than reads. In
 * antichat every file it writes counts; it has no project to leave them in.
 * A file passed to share_file always counts, whatever its kind. */
const DOCUMENT_EXTENSIONS = ['.pdf', '.xlsx', '.xlsm', '.docx', '.csv', '.pptx', '.zip', '.png', '.jpg', '.jpeg', '.webp', '.gif'];

function documentsProduced(items, everyFile = false) {
  const paths = [];
  for (const item of items) {
    const shared = item.name === 'share_file';
    if (!shared && !/^(write|create|fill|add|format|generate)_/.test(item.name)) continue;
    if (item.result === undefined || item.result.isError) continue;
    const input = item.input || {};
    const target = typeof input.output_path === 'string' ? input.output_path : input.path;
    if (typeof target !== 'string') continue;
    const dot = target.lastIndexOf('.');
    if (!shared && !everyFile && (dot === -1 || !DOCUMENT_EXTENSIONS.includes(target.slice(dot).toLowerCase()))) continue;
    if (!paths.includes(target)) paths.push(target);
  }
  return paths;
}

function artifactEl(sessionId, target) {
  const row = document.createElement('div');
  row.className = 'artifact';
  const tag = document.createElement('span');
  tag.className = 'tag';
  const dot = target.lastIndexOf('.');
  tag.textContent = dot === -1 ? 'FILE' : target.slice(dot + 1, dot + 5).toUpperCase();
  const name = document.createElement('span');
  name.className = 'nm';
  name.textContent = target;
  const link = document.createElement('a');
  link.href = downloadUrl(sessionId, target);
  link.textContent = 'Unduh';
  link.setAttribute('download', target.split('/').pop());
  link.onclick = (event) => event.stopPropagation();
  row.append(tag, name, link);
  // Tapping the file itself opens it here; Download is still one tap away.
  row.onclick = () => openFileViewer(sessionId, target, false);
  return row;
}

function downloadUrl(sessionId, target) {
  return '/api/download?sessionId=' + encodeURIComponent(sessionId) +
    '&path=' + encodeURIComponent(target) + '&token=' + encodeURIComponent(token);
}

/* ---------- Looking at a file without leaving the session ---------- */

let viewerSeq = 0;

/** A produced file by its path in the session's folder, or an attachment by its own. */
async function openFileViewer(sessionId, target, attachment) {
  const seq = ++viewerSeq;
  const name = target.split(/[\\/]/).pop();
  document.getElementById('fileName').textContent = name;
  const download = document.getElementById('fileDownload');
  download.classList.remove('hidden');
  if (attachment) {
    download.href = '/api/attachment/download?sessionId=' + encodeURIComponent(sessionId) +
      '&path=' + encodeURIComponent(target) + '&token=' + encodeURIComponent(token);
  } else {
    download.href = downloadUrl(sessionId, target);
  }
  download.setAttribute('download', name);
  document.getElementById('fileTabs').innerHTML = '';
  document.getElementById('fileNote').textContent = '';
  showViewerMessage('Membuka…');
  document.getElementById('fileViewer').classList.remove('hidden');
  const query = 'sessionId=' + encodeURIComponent(sessionId) + '&path=' + encodeURIComponent(target) +
    (attachment ? '&attachment=1' : '');
  let preview;
  try {
    preview = await jfetch('/api/preview?' + query);
  } catch (error) {
    if (seq === viewerSeq) showViewerMessage(error.message || String(error));
    return;
  }
  if (seq !== viewerSeq) return;
  const body = document.getElementById('fileBody');
  const raw = '/api/view?' + query + '&token=' + encodeURIComponent(token);
  if (preview.kind === 'image') {
    const img = document.createElement('img');
    img.src = raw;
    img.alt = preview.name;
    body.replaceChildren(img);
  } else if (preview.kind === 'pdf') {
    const frame = document.createElement('iframe');
    frame.src = raw;
    frame.title = preview.name;
    body.replaceChildren(frame);
  } else if (preview.kind === 'pages') {
    showViewerPages(preview.pages);
  } else {
    showViewerMessage(preview.reason);
  }
}

/** A workbook's sheets become tabs; one-page documents show no tab row at all. */
function showViewerPages(pages) {
  const tabs = document.getElementById('fileTabs');
  tabs.innerHTML = '';
  const show = (index) => {
    const pageEntry = pages[index];
    document.getElementById('fileNote').textContent = pageEntry.note || '';
    [...tabs.children].forEach((button, i) => button.classList.toggle('on', i === index));
    const frame = document.createElement('iframe');
    // The page is the Mac's rendering of a file, not code to run: no scripts,
    // no forms, no reaching back into this page.
    frame.setAttribute('sandbox', '');
    frame.srcdoc = pageEntry.html;
    frame.title = pageEntry.label;
    document.getElementById('fileBody').replaceChildren(frame);
  };
  if (pages.length > 1) {
    pages.forEach((pageEntry, index) => {
      const button = document.createElement('button');
      button.textContent = pageEntry.label;
      button.onclick = () => show(index);
      tabs.appendChild(button);
    });
  }
  show(0);
}

function showViewerMessage(text) {
  const message = document.createElement('div');
  message.className = 'vmsg';
  message.textContent = text;
  document.getElementById('fileBody').replaceChildren(message);
}

function closeFileViewer() {
  ++viewerSeq;
  document.getElementById('fileViewer').classList.add('hidden');
  document.getElementById('fileBody').replaceChildren();
}

function sendBtnState() {
  const running = currentRunId !== null;
  const paused = currentSession !== null && pausedSessions.has(currentSession);
  // Working, with something typed: the button sends it into the run as a
  // follow-up instead of pausing. Empty, it pauses, as before.
  const typed = document.getElementById('prompt').value.trim() !== '';
  if (running && !paused && typed) return 'send';
  if (running) return 'running';
  // Paused with something typed: that is sent, and it ends the pause.
  if (paused && !typed) return 'resume';
  return 'send';
}

function togglePhonePlan() {
  phonePlan = !phonePlan;
  updateSendBtn();
}

const SEND_GLYPH = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const PAUSE_GLYPH = '<span class="sq" aria-hidden="true"></span>';
const RESUME_GLYPH = '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M5 3.2v9.6a.6.6 0 0 0 .9.5l7.6-4.8a.6.6 0 0 0 0-1L5.9 2.7a.6.6 0 0 0-.9.5z"/></svg>';

function updateSendBtn() {
  // The new-session page is a chat that has not started: currentSession is
  // null there, but the composer must stay — it is where the first prompt is
  // typed. Only the sessions list (and the web/files views) put it away.
  const onNewPage = !document.getElementById('newSessionCard').classList.contains('hidden');
  document.getElementById('inputRow').classList.toggle('hidden', (!currentSession && !onNewPage)
    || !document.getElementById('viewFiles').classList.contains('hidden')
    || !document.getElementById('viewWeb').classList.contains('hidden'));
  const btn = document.getElementById('sendBtn');
  const state = sendBtnState();
  btn.disabled = submitting || (currentRunId !== null && pausedSessions.has(currentSession));
  btn.classList.toggle('lime', state === 'resume');
  // Same glyphs as the desktop: an arrow to send, a square to pause, a play
  // mark to resume — never the send arrow, which read as sending nothing.
  const glyph = state === 'running' ? PAUSE_GLYPH : state === 'resume' ? RESUME_GLYPH + '<span>Continue</span>' : SEND_GLYPH;
  if (btn.dataset.glyph !== state) { btn.innerHTML = glyph; btn.dataset.glyph = state; }
  const label = state === 'resume' ? 'Continue' : state === 'running' ? 'Pause' : 'Send';
  btn.title = label;
  btn.setAttribute('aria-label', label);
  // Revert sits beside Continue, as on the desktop: paused, and nothing running.
  const reverting = currentSession !== null && pausedSessions.has(currentSession) && currentRunId === null;
  document.getElementById('revertBtn').classList.toggle('hidden', !reverting);
  const working = currentRunId !== null && !pausedSessions.has(currentSession);
  renderPlan();
  const planChip = document.getElementById('planChip');
  planChip.textContent = phonePlan ? 'plan' : 'build';
  planChip.classList.toggle('on', phonePlan);
  // A prompt typed while a run works always waits its turn, exactly as the
  // desktop does; steering is the queue's own arrow, not a chip.
  document.getElementById('promptHint').textContent = working ? 'Queue the next prompt\u2026' : 'Message\u2026';
  requestAnimationFrame(updateModelFade);
}

function onSendBtn() {
  const state = sendBtnState();
  if (state === 'running') void pauseSession();
  else if (state === 'resume') void resumeSession();
  else void sendPrompt();
}

/* The Mac pauses whichever run is working in the session — started here or on
 * the desktop — and tells both screens; the marker arrives on the stream. When
 * nothing was running, the run had already finished without this screen
 * hearing of it: there is nothing to resume, so it catches up instead of
 * offering a Continue that would start the work over. */
async function pauseSession() {
  if (currentRunId === null || currentSession === null) return;
  const id = currentSession;
  try {
    const { paused } = await jfetch('/api/pause', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ sessionId: id }) });
    if (paused) pausedSessions.add(id);
    else if (currentSession === id) await syncSession(id);
    updateSendBtn();
  } catch (error) { showError(error); }
}
/* The words the app leaves in the transcript, matching the desktop's labels. */
const PAUSE_LABEL = 'Paused.';
const RESUME_LABEL = 'Resumed.';
const FOLLOW_UP_LABEL = 'Follow-up added.';
/* What a resume actually asks for; the transcript shows RESUME_LABEL instead. */
const CONTINUE_PROMPT = 'Lanjutkan langsung dari titik terakhir tanpa pembuka seperti “lanjutan”. Jangan ulangi langkah yang sudah selesai. Jika fragmen kata terakhir belum lengkap, tulis hanya sambungan yang hilang lalu teruskan.';
async function resumeSession() { await submitPrompt(CONTINUE_PROMPT); }

function appendNotice(text) {
  const el = document.getElementById('transcript');
  const div = document.createElement('div');
  div.className = 'notice';
  div.textContent = text;
  el.appendChild(div);
  followBottom();
}

function appendUserBubble(text, files) {
  const el = document.getElementById('transcript');
  const div = document.createElement('div');
  div.className = 'msg user';
  if (files !== undefined && files.length > 0) div.appendChild(attachmentsEl(files));
  const bubble = document.createElement('span');
  bubble.className = 'bubble';
  bubble.textContent = text;
  div.appendChild(bubble);
  el.appendChild(div);
  followBottom(true);
  return div;
}

/* ---------- Replying to a selected passage ---------- */

let quoted = '';

function renderQuote() {
  document.getElementById('quoteRow').classList.toggle('hidden', quoted === '');
  document.getElementById('quoteText').textContent = quoted;
}

function clearQuote() {
  quoted = '';
  renderQuote();
}

function hideReplyBtn() {
  document.getElementById('replyBtn').classList.add('hidden');
  pendingSelection = '';
}

/**
 * What was selected when the button appeared. iOS collapses the selection as
 * soon as the button is tapped, so reading it back inside the tap handler finds
 * nothing — the text has to be kept from the moment it was selected.
 */
let pendingSelection = '';

function quoteSelection() {
  const live = window.getSelection()?.toString().trim() ?? '';
  const text = live !== '' ? live : pendingSelection;
  if (text !== '') quoted = text;
  renderQuote();
  window.getSelection()?.removeAllRanges();
  pendingSelection = '';
  hideReplyBtn();
  document.getElementById('prompt').focus();
}

document.addEventListener('selectionchange', () => {
  if (dirtyLive.size > 0 && liveFrame === 0) liveFrame = requestAnimationFrame(flushLive);
  const button = document.getElementById('replyBtn');
  const selection = window.getSelection();
  const text = selection?.toString().trim() ?? '';
  if (selection === null || selection.rangeCount === 0 || text === '' || currentSession === null) {
    hideReplyBtn();
    return;
  }
  const anchor = selection.anchorNode;
  const host = anchor instanceof Element ? anchor : anchor?.parentElement;
  if (host === null || host === undefined || host.closest('#transcript') === null) {
    hideReplyBtn();
    return;
  }
  pendingSelection = text;
  const box = selection.getRangeAt(0).getBoundingClientRect();
  const composerTop = document.getElementById('inputRow').getBoundingClientRect().top;
  button.style.left = Math.min(Math.max(box.left + box.width / 2, 70), window.innerWidth - 70) + 'px';
  // Under the selection, and never behind the composer.
  button.style.top = Math.min(box.bottom + 10, composerTop - 56) + 'px';
  button.classList.remove('hidden');
});

/* A tap outside the composer drops the quote, the way a popup closes. */
document.addEventListener('pointerdown', (event) => {
  if (quoted === '') return;
  if (event.target.closest('#inputRow') !== null || event.target.closest('#replyBtn') !== null) return;
  clearQuote();
});

/* The box empties the moment the prompt goes, not when the server answers —
 * waiting left the sent words sitting there as if nothing had happened, and
 * the iOS keyboard could commit a pending word back into the cleared box. A
 * refused send puts the words back. */
async function sendPrompt() {
  const input = document.getElementById('prompt');
  const prompt = input.value.trim();
  if (!prompt || submitting) return;
  // On the new-session page there is no session yet: the first prompt creates
  // one ( honouring the chosen mode and folder) and then sends into it.
  if (currentSession === null) {
    if (!document.getElementById('newSessionCard').classList.contains('hidden')) {
      const folder = document.getElementById('folderInput');
      if (phoneMode === 'code' && folder.value.trim() === '') {
        folder.focus();
        return;
      }
      pendingFirstPrompt = prompt;
      input.value = '';
      input.dispatchEvent(new Event('input'));
      await startSession();
      return;
    }
    return;
  }
  input.value = '';
  input.dispatchEvent(new Event('input'));
  const sent = await submitPrompt(prompt);
  if (!sent && input.value.trim() === '') {
    input.value = prompt;
    input.dispatchEvent(new Event('input'));
  } else if (sent && input.value.trim() === prompt) {
    input.value = '';
  }
  updateSendBtn();
}
async function submitPrompt(prompt) {
  // A prompt sent while the session is working is taken by that run as a
  // follow-up; only a resume needs the run to be over.
  if (!prompt || !currentSession || submitting) return false;
  if (prompt === CONTINUE_PROMPT && currentRunId) return false;
  const id = currentSession;
  if (quoted !== '' && prompt !== CONTINUE_PROMPT) {
    prompt = quoted.replace(/^/gm, '> ') + '\n\n' + prompt;
  }
  const attachmentIds = staged.map((item) => item.id);
  submitting = true;
  updateSendBtn();
  try {
    await listen(id);
    const queue = currentRunId !== null && prompt !== CONTINUE_PROMPT;
    await jfetch('/api/prompt', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ sessionId: id, prompt, attachmentIds, queue, plan: phonePlan })
    });
    for (const item of staged) if (attachmentIds.includes(item.id) && item.localUrl) URL.revokeObjectURL(item.localUrl);
    staged = staged.filter((item) => !attachmentIds.includes(item.id));
    renderStaged();
    clearQuote();
    pausedSessions.delete(id);
    // The stream is already subscribed, including for immediately completed runs.

    return true;
  } catch (error) { showError(error); return false; }
  finally { submitting = false; updateSendBtn(); }
}

function canLeaveEditor() { return openedFile === null || document.getElementById('editor').value === savedContent || confirm('Discard unsaved file changes?'); }

/* ---------- Web ---------- */

function webEntry() {
  return webList.find((entry) => entry.sessionId === webSessionId) ?? null;
}

function activeTabOf(entry) {
  if (entry === null) return null;
  return entry.tabs.find((tab) => tab.id === entry.activeTabId) ?? entry.tabs[0] ?? null;
}

function hasPage(entry) {
  return entry.tabs.some((tab) => tab.url !== '');
}

/** Picks up where the last session left off: the pane the desktop is showing
 * wins, and failing that the most recent session that has a page at all. */
function defaultWebSession() {
  const shown = webList.find((entry) => !entry.hidden && hasPage(entry));
  if (shown !== undefined) return shown.sessionId;
  const any = webList.find((entry) => hasPage(entry));
  return any?.sessionId ?? webList[0]?.sessionId ?? null;
}

function pickWebSession(id) {
  webSessionId = id === '' ? null : id;
  renderWeb();
  void refreshWebShot().catch(showError);
}

function labelForWebSession(id) {
  const session = lastSessions.find((entry) => entry.id === id);
  if (session === undefined) return 'Session';
  return session.title || (session.workspaceRoot ? session.workspaceRoot.split(/[\\/]/).pop() : 'chat');
}

function tabLabel(tab) {
  if (tab.title) return tab.title;
  if (tab.url === '') return 'New tab';
  try { return new URL(tab.url).host; } catch { return tab.url; }
}

async function postWeb(body) {
  const { web, history } = await jfetch('/api/web', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ sessionId: webSessionId, ...body })
  });
  webList = web;
  if (history) webHistory = history;
  renderWeb();
}

/** Back or Forward on the active tab; the desktop pane follows the page. */
async function stepWeb(action) {
  if (webSessionId === null) return;
  await postWeb({ action });
  await refreshWebShot();
}

function renderWebTabs(entry) {
  const strip = document.getElementById('webTabs');
  strip.innerHTML = '';
  if (entry === null) return;
  for (const tab of entry.tabs) {
    const chip = document.createElement('div');
    chip.className = 'wtab' + (tab.id === entry.activeTabId ? ' on' : '');
    chip.setAttribute('role', 'button');
    const label = document.createElement('span');
    label.className = 'wlabel';
    label.textContent = tabLabel(tab);
    chip.appendChild(label);
    chip.onclick = () => {
      if (tab.id === entry.activeTabId) return;
      void postWeb({ action: 'selectTab', tabId: tab.id }).then(() => refreshWebShot()).catch(showError);
    };
    const close = document.createElement('button');
    close.className = 'wx';
    close.textContent = '×';
    close.setAttribute('aria-label', 'Close tab');
    close.onclick = (event) => {
      event.stopPropagation();
      void postWeb({ action: 'closeTab', tabId: tab.id }).then(() => refreshWebShot()).catch(showError);
    };
    chip.appendChild(close);
    strip.appendChild(chip);
  }
  const add = document.createElement('button');
  add.className = 'wadd';
  add.textContent = '+';
  add.setAttribute('aria-label', 'New tab');
  add.onclick = () => {
    void postWeb({ action: 'newTab' })
      .then(() => document.getElementById('webAddress').focus())
      .catch(showError);
  };
  strip.appendChild(add);
}

function renderWeb() {
  const select = document.getElementById('webSession');
  select.innerHTML = '';
  for (const entry of webList) {
    const option = document.createElement('option');
    option.value = entry.sessionId;
    option.textContent = labelForWebSession(entry.sessionId) + (entry.hidden ? ' · hidden' : '');
    select.appendChild(option);
  }
  select.classList.toggle('hidden', webList.length === 0);
  if (webSessionId !== null) select.value = webSessionId;

  const entry = webEntry();
  const tab = activeTabOf(entry);
  renderWebTabs(entry);
  const note = document.getElementById('webNote');
  const frame = document.getElementById('webFrame');
  document.getElementById('webHideBtn').textContent = entry?.hidden ? 'Show' : 'Hide';
  document.getElementById('webHideBtn').disabled = entry === null;
  const nav = (entry !== null && webHistory[entry.sessionId]) || {};
  document.getElementById('webBackBtn').disabled = nav.back !== true;
  document.getElementById('webFwdBtn').disabled = nav.forward !== true;
  if (entry === null) {
    note.textContent = 'No page open yet — start one from a session, or type an address.';
    frame.classList.add('hidden');
    return;
  }
  note.textContent = tab === null || tab.url === '' ? 'Type an address for this tab.' : tab.url;
  frame.classList.toggle('hidden', tab === null || tab.url === '');
}

async function refreshWebList() {
  const { web, history } = await jfetch('/api/web');
  webList = web;
  if (history) webHistory = history;
  if (webSessionId === null || !webList.some((entry) => entry.sessionId === webSessionId)) {
    webSessionId = defaultWebSession();
  }
  renderWeb();
}

/* What the picture on screen shows, so a poll only re-renders when the page
 * actually moved — a tall page that reloads under your thumb loses your place. */
let shownWebKey = null;
let webShotRequest = 0;

async function refreshWebShot(reload) {
  const entry = webEntry();
  const tab = activeTabOf(entry);
  if (entry === null || tab === null || tab.url === '') {
    shownWebKey = null;
    webShotRequest++;
    document.getElementById('webShot').removeAttribute('src');
    return;
  }
  const key = entry.sessionId + ' ' + tab.id + ' ' + tab.url;
  if (!reload && key === shownWebKey) return;
  const request = ++webShotRequest;
  const changed = key !== shownWebKey;
  shownWebKey = key;
  const shot = document.getElementById('webShot');
  if (changed) shot.removeAttribute('src');
  const loading = document.getElementById('webLoading');
  loading.classList.remove('hidden');
  const next = new Image();
  next.onload = () => {
    if (request !== webShotRequest) return;
    shot.src = next.src;
    loading.classList.add('hidden');
  };
  next.onerror = () => {
    if (request !== webShotRequest) return;
    loading.textContent = 'The page could not be rendered — tap Reload.';
    shownWebKey = null;
  };
  loading.textContent = 'Loading…';
  // Rendered on demand at a phone's width, so the cache is stepped around.
  next.src = '/api/web/shot?sessionId=' + encodeURIComponent(entry.sessionId)
    + (reload ? '&reload=1' : '') + '&token=' + token + '&t=' + Date.now();
}

async function openWebAddress() {
  const typed = document.getElementById('webAddress').value.trim();
  if (typed === '' || webSessionId === null) return;
  const url = /^https?:\/\//i.test(typed) ? typed : 'http://' + typed;
  const tab = activeTabOf(webEntry());
  await postWeb({ url, ...(tab !== null ? { tabId: tab.id } : {}) });
  document.getElementById('webAddress').value = '';
  document.getElementById('webAddress').blur();
  await refreshWebShot();
}

/** The same sticky hide the desktop has: once off, a page the agent opens
 * later updates the pane quietly instead of pushing it back on screen. */
async function toggleWebHidden() {
  const entry = webEntry();
  if (entry === null) return;
  await postWeb({ visible: entry.hidden });
}

function stopWebPolling() {
  webShotRequest++;
  if (webTimer !== null) { clearInterval(webTimer); webTimer = null; }
}

function startWebPolling() {
  stopWebPolling();
  shownWebKey = null;
  void refreshWebList()
    .then(() => refreshWebShot())
    .catch(showError);
  webTimer = setInterval(() => {
    void refreshWebList().then(() => refreshWebShot()).catch(() => {});
  }, 4000);
}

/* ---------- Files ---------- */

async function refreshFilesTab() {
  const { sessions } = await jfetch('/api/overview');
  const select = document.getElementById('folderSession');
  const preferred = currentSession || select.value;
  const code = sessions.filter((s) => s.mode === 'code' && s.workspaceRoot);
  select.innerHTML = '';
  if (code.length === 0) {
    select.innerHTML = '<option value="">Create an anticode session first</option>';
    setFileControlsEnabled(false);
    document.getElementById('crumb').textContent = '/';
    document.getElementById('dirList').innerHTML = '';
    document.getElementById('editor').classList.add('hidden');
    return;
  }
  for (const s of code) {
    const option = document.createElement('option');
    option.value = s.id;
    option.textContent = s.workspaceRoot.split(/[\\\\/]/).pop();
    select.appendChild(option);
  }
  if (code.some((s) => s.id === preferred)) select.value = preferred;
  if (!folderReady || code.some((s) => s.id === select.value) === false) folderReady = true;
  setFileControlsEnabled(true);
  currentPath = '.';
  openedFile = null;
  document.getElementById('editor').classList.add('hidden');
  await renderListing();
}

function onSessionChange() {
  if (!canLeaveEditor()) { document.getElementById('folderSession').value = openedSessionId; return; }
  currentPath = '.';
  openedFile = null;
  document.getElementById('editor').classList.add('hidden');
  void renderListing().catch(showError);
}

function setFileControlsEnabled(enabled) {
  for (const id of ['saveBtn', 'gitStatusBtn', 'gitCommitBtn', 'gitPushBtn']) {
    document.getElementById(id).disabled = !enabled;
  }
  if (!enabled) {
    document.getElementById('saveBtn').disabled = true;
    document.getElementById('gitStatusBtn').disabled = true;
    document.getElementById('gitCommitBtn').disabled = true;
    document.getElementById('gitPushBtn').disabled = true;
  }
}

function joinPath(base, name) {
  return base === '.' ? name : base.replace(/\/$/, '') + '/' + name;
}

function parentPath(p) {
  if (p === '.' || p === '') return '.';
  const parts = p.replace(/\/$/, '').split('/');
  parts.pop();
  return parts.length === 0 ? '.' : parts.join('/');
}

async function renderListing() {
  const sessionId = document.getElementById('folderSession').value;
  if (!sessionId) return;
  document.getElementById('crumb').textContent = currentPath;
  const requestedPath = currentPath;
  const result = await jfetch('/api/files?sessionId=' + sessionId + '&path=' + encodeURIComponent(currentPath));
  if (requestedPath !== currentPath || sessionId !== document.getElementById('folderSession').value) return;
  const dir = document.getElementById('dirList');
  const editor = document.getElementById('editor');
  dir.innerHTML = '';
  if (result.kind !== 'directory') {
    editor.classList.remove('hidden');
    editor.value = result.content;
    savedContent = result.content;
    fileVersion = result.version;
    openedFile = currentPath;
    openedSessionId = sessionId;
    document.getElementById('saveBtn').disabled = false;
    return;
  }
  editor.classList.add('hidden');
  openedFile = null;
  document.getElementById('saveBtn').disabled = true;
  if (currentPath !== '.') {
    const back = document.createElement('div');
    back.className = 'dirrow';
    back.innerHTML = '<span class="back">← up</span>';
    back.onclick = () => { currentPath = parentPath(currentPath); void renderListing().catch(showError); };
    dir.appendChild(back);
  }
  const folders = result.entries.filter((e) => e.endsWith('/'));
  const files = result.entries.filter((e) => !e.endsWith('/'));
  for (const entry of [...folders, ...files]) {
    const isFolder = entry.endsWith('/');
    const row = document.createElement('div');
    row.className = 'dirrow' + (isFolder ? ' folder' : '');
    row.innerHTML = `<span class="name">${escapeHtml(entry)}</span>`;
    row.onclick = () => {
      currentPath = joinPath(currentPath, entry);
      void renderListing().catch(showError);
    };
    // Anything the agent produced — a PDF, a workbook — leaves the Mac here.
    if (!isFolder) {
      const link = document.createElement('a');
      link.className = 'dl';
      link.textContent = '↓';
      link.title = 'Unduh';
      link.href = '/api/download?sessionId=' + encodeURIComponent(sessionId) +
        '&path=' + encodeURIComponent(joinPath(currentPath, entry)) +
        '&token=' + encodeURIComponent(token);
      link.setAttribute('download', entry);
      link.onclick = (event) => event.stopPropagation();
      row.appendChild(link);
    }
    dir.appendChild(row);
  }
}

function upDir() {
  if (!canLeaveEditor()) return;
  currentPath = parentPath(currentPath);
  openedFile = null;
  void renderListing().catch(showError);
}

async function saveFile() {
  if (openedFile === null) return;
  const sessionId = document.getElementById('folderSession').value;
  const content = document.getElementById('editor').value;
  const saved = await jfetch('/api/files', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ sessionId, path: openedFile, content, version: fileVersion })
  });
  const out = document.getElementById('gitOut');
  out.classList.remove('hidden');
  out.textContent = 'Saved ' + openedFile;
  fileVersion = saved.version; savedContent = content;
}

async function gitAction(action) {
  const sessionId = document.getElementById('folderSession').value;
  let message = '';
  if (action === 'commit') {
    message = window.prompt('Commit message (includes all project changes):');
    if (message === null) return;
    if (!message.trim()) { showError('Enter a commit message.'); return; }
  }
  const result = await jfetch('/api/git', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ sessionId, action, message })
  });
  const out = document.getElementById('gitOut');
  out.classList.remove('hidden');
  out.textContent = result.ok ? result.output || 'ok' : 'FAILED: ' + result.output;
}

document.getElementById('prompt').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendPrompt(); }
});
function autoSizePrompt() {
  const field = document.getElementById('prompt');
  field.style.height = '0px';
  const height = Math.max(48, Math.min(field.scrollHeight, 140));
  field.style.height = height + 'px';
  field.style.overflowY = field.scrollHeight > 140 ? 'auto' : 'hidden';
}
// Typing while the session works turns the pause button into a send button,
// and wrapped text grows the same glass shell instead of scrolling at line two.
document.getElementById('prompt').addEventListener('input', () => {
  autoSizePrompt();
  updateSendBtn();
  updatePromptHintFade();
});
const composerObserver = new ResizeObserver(([entry]) => {
  const hidden = entry.target.classList.contains('hidden');
  document.documentElement.style.setProperty('--composer-height', hidden ? '0px' : entry.contentRect.height + 'px');
  updateModelFade();
});
composerObserver.observe(document.getElementById('inputRow'));
window.addEventListener('resize', () => { autoSizePrompt(); updateModelFade(); });
window.visualViewport?.addEventListener('resize', () => { autoSizePrompt(); updateModelFade(); });
autoSizePrompt();
document.addEventListener('click', (e) => {
  const drop = document.getElementById('menuDrop');
  if (!drop.classList.contains('hidden') && !drop.contains(e.target) && e.target.closest('#menuBtn') === null) {
    closeMenu();
  }
});
/* A reload used to drop the user back on the session list even when they were
 * reading a session. The last one opened is remembered for exactly that. */
const LAST_SESSION_KEY = 'anticode:lastSession';
function forgetLastSession() {
  try { sessionStorage.removeItem(LAST_SESSION_KEY); } catch { /* private mode */ }
}

async function restoreLastSession() {
  let remembered = null;
  try { remembered = sessionStorage.getItem(LAST_SESSION_KEY); } catch { /* private mode */ }
  if (remembered === null) { gotoSessions(); return; }
  try {
    const { sessions } = await jfetch('/api/overview');
    lastSessions = sessions;
    if (!sessions.some((entry) => entry.id === remembered)) { forgetLastSession(); gotoSessions(); return; }
    await openSession(remembered);
  } catch { forgetLastSession(); gotoSessions(); }
}

/* ---------- Settings, Revert, and the composer chips ---------- */

/** The status as the open session sees it: its own model over the default. */
function shownStatus(status) {
  const own = currentSession ? status?.sessions?.[currentSession] : undefined;
  return own ? { ...status, ...own } : status;
}

function noteStatus(status) {
  const shown = shownStatus(status);
  const modelMoved = modelInfo?.provider !== shown.provider || modelInfo?.model !== shown.model ||
    JSON.stringify(modelInfo?.lastUsed ?? null) !== JSON.stringify(shown.lastUsed ?? null) ||
    JSON.stringify(modelInfo?.rotation ?? []) !== JSON.stringify(shown.rotation ?? []) ||
    JSON.stringify(modelInfo?.rotationGroups ?? []) !== JSON.stringify(shown.rotationGroups ?? []) ||
    (modelInfo?.rotationGroup ?? null) !== (shown.rotationGroup ?? null) ||
    (modelInfo?.rotationEnabled === true) !== (shown.rotationEnabled === true);
  lastStatus = status;
  if (modelMoved) void loadModels();
  updateChips();
}

/** The group in use, or null for the whole pool — the desktop's activeRotationGroup. */
function activeRotationGroup(info) {
  if (!info || info.rotationGroup === null || info.rotationGroup === undefined) return null;
  return (info.rotationGroups ?? []).find((group) => group.id === info.rotationGroup) ?? null;
}

/** What the model chip says — the desktop's modelLabel. */
function modelLabel(info) {
  if (!info) return '';
  if (info.provider === ROTATE) {
    const group = activeRotationGroup(info);
    return [ROTATE_LABEL, group?.name, info.lastUsed?.model].filter(Boolean).join(' · ');
  }
  return info.model || '';
}

/** The model and Default/Auto under the box, as the desktop composer shows them. */
function updateChips() {
  const model = modelLabel(modelInfo) || modelLabel(lastStatus ? shownStatus(lastStatus) : null);
  const chip = document.getElementById('modelChip');
  const label = chip.querySelector('.modelText');
  label.textContent = model === '' ? 'pick a model' : model;
  chip.title = model === '' ? 'Pick a model' : model;
  const modelLocked = modelInfo?.rotationEnabled === true;
  // Under Rotate usage the model is not picked here, but the group in use is:
  // with groups made, the chip opens straight at that choice.
  chip.disabled = modelLocked && (modelInfo?.rotationGroups ?? []).length === 0;
  document.getElementById('customModelId').disabled = modelLocked;
  document.getElementById('useModelBtn').disabled = modelLocked;
  document.getElementById('setCustomModel').disabled = modelLocked;
  document.querySelector('#secModel .actions button').disabled = modelLocked;
  document.getElementById('modeChip').textContent = lastStatus?.autoApprove === true ? 'Auto' : 'Default';
  requestAnimationFrame(updateModelFade);
  if (!document.getElementById('settingsSheet').classList.contains('hidden')) renderSettings();
}

function updateModelFade() {
  const chip = document.getElementById('modelChip');
  const label = chip.querySelector('.modelText');
  chip.classList.toggle('clipped', label.scrollWidth > label.clientWidth + 1);
  updatePromptHintFade();
}

/** The empty box's hint fades its end only when the phone is too narrow for it. */
function updatePromptHintFade() {
  const hint = document.getElementById('promptHint');
  // Hidden while something is typed; it keeps the last answer until it shows.
  if (hint.clientWidth === 0) return;
  hint.classList.toggle('clipped', hint.scrollWidth > hint.clientWidth + 1);
}

function openSettings(section) {
  closeMenu();
  document.getElementById('settingsError').classList.add('hidden');
  document.getElementById('settingsSheet').classList.remove('hidden');
  renderSettings();
  void loadModels();
  void jfetch('/api/overview').then(({ status }) => { if (status) noteStatus(status); }).catch(() => undefined);
  const target = section === 'model' ? 'secModel' : section === 'mode' ? 'secMode' : section === 'rotation' ? 'secRotation' : null;
  if (target !== null) document.getElementById(target).scrollIntoView({ block: 'start' });
}

function closeSettings() {
  document.getElementById('settingsSheet').classList.add('hidden');
  document.getElementById('settingsError').classList.add('hidden');
}

function renderSettings() {
  const auto = lastStatus?.autoApprove === true;
  document.getElementById('policyDefault').classList.toggle('on', !auto);
  document.getElementById('policyAuto').classList.toggle('on', auto);
  document.getElementById('policyHint').textContent = auto
    ? 'Run everything without asking. Turn Auto off to be asked again.'
    : 'Ask before changing anything.';
  const grid = document.getElementById('usageGrid');
  grid.replaceChildren();
  if (currentSession === null || lastUsage?.id !== currentSession) {
    document.getElementById('usageTitle').textContent = 'Session usage';
    grid.className = 'faint';
    grid.textContent = 'Open a session to see what it has used.';
  } else {
    document.getElementById('usageTitle').textContent = 'Session usage · ' + titleFor(currentSession);
    grid.className = 'usage';
    const input = lastUsage.summaries.reduce((sum, entry) => sum + (entry.inputTokens || 0), 0);
    const output = lastUsage.summaries.reduce((sum, entry) => sum + (entry.outputTokens || 0), 0);
    const cost = lastUsage.summaries.reduce((sum, entry) => sum + (entry.costUsd || 0), 0);
    const partial = lastUsage.summaries.some((entry) => entry.costPartial === true);
    const dollars = cost === 0 ? '$0' : cost < 0.01 ? '$' + cost.toFixed(4) : '$' + cost.toFixed(2);
    for (const [name, value] of [['Input tokens', input], ['Output tokens', output],
      ['Total tokens', input + output], ['Messages', lastUsage.messages], ['Estimated cost', (partial ? '\u2265 ' : '') + dollars]]) {
      const label = document.createElement('span'); label.textContent = name;
      const figure = document.createElement('span'); figure.textContent = typeof value === 'number' ? value.toLocaleString('en-US') : value;
      grid.append(label, figure);
    }
  }
  document.getElementById('modelHint').textContent = currentSession
    ? 'Only this session changes model; other sessions keep theirs. New sessions start on it too.'
    : 'The model new sessions start on. Each session keeps its own afterwards.';
  renderProviders();
}

function renderProviders() {
  const list = document.getElementById('providerList');
  list.replaceChildren();
  const providers = modelInfo?.providers ?? [];
  for (const provider of providers) {
    const row = document.createElement('div');
    row.className = 'prow';
    const text = document.createElement('div');
    text.className = 'nm';
    const name = document.createElement('div');
    name.textContent = provider.label;
    const detail = document.createElement('div');
    detail.className = 'pdetail';
    const listed = provider.listed ?? [];
    detail.textContent = [
      hostOf(provider.baseURL) || 'no base URL',
      provider.kind === 'ollama' ? 'local' : provider.hasKey ? 'key saved' : 'no key',
      listed.length > 0 ? listed.length + (listed.length === 1 ? ' model' : ' models') : ''
    ].filter((part) => part !== '').join(' · ');
    text.append(name, detail);
    const state = document.createElement('span');
    state.className = provider.id === modelInfo.defaultProvider ? 'pstate' : 'faint';
    state.textContent = provider.id === modelInfo.defaultProvider ? 'default' : provider.available ? '' : 'no key';
    const makeDefault = document.createElement('button');
    makeDefault.className = 'pm';
    makeDefault.textContent = 'Default';
    makeDefault.title = 'Use ' + provider.label + ' as the default provider';
    makeDefault.classList.toggle('hidden', provider.id === modelInfo.defaultProvider || !provider.available);
    makeDefault.onclick = () => void pickDefaultProvider(provider.id);
    const edit = document.createElement('button');
    edit.className = 'pm';
    edit.textContent = 'Edit';
    edit.onclick = () => { editingProvider = editingProvider === provider.id ? null : provider.id; renderProviders(); };
    const remove = document.createElement('button');
    remove.className = 'px';
    remove.textContent = '×';
    remove.setAttribute('aria-label', 'Remove ' + provider.label);
    remove.onclick = () => void removePhoneProvider(provider);
    row.append(text, state, makeDefault, edit, remove);
    list.appendChild(row);
    if (editingProvider === provider.id) list.appendChild(providerEditor(provider));
  }
  // Clinepass, once removed, comes back from here.
  if (modelInfo && !providers.some((provider) => provider.id === 'clinepass')) {
    const restore = document.createElement('button');
    restore.className = 'prestore';
    restore.textContent = 'Restore Clinepass';
    restore.onclick = () => void restorePhoneClinepass();
    list.appendChild(restore);
  }
  renderRotation();
}

/* ---------- Rotate usage: the pool that shares the token load ---------- */

function compactTokens(value) {
  if (value < 1000) return String(value);
  if (value < 1000000) return (value / 1000).toFixed(value < 10000 ? 1 : 0) + 'k';
  return (value / 1000000).toFixed(1) + 'M';
}

function renderRotation() {
  const enabled = modelInfo?.rotationEnabled === true;
  const toggle = document.getElementById('rotSwitch');
  toggle.classList.toggle('on', enabled);
  toggle.setAttribute('aria-checked', String(enabled));
  document.getElementById('rotationBody').classList.toggle('hidden', !enabled);
  // Groups are made on the Mac; here one is put in use. The list below is
  // the one in use — the group's models, or the whole pool.
  const groups = modelInfo?.rotationGroups ?? [];
  const group = activeRotationGroup(modelInfo);
  const picker = document.getElementById('rotGroup');
  picker.classList.toggle('hidden', groups.length === 0);
  picker.replaceChildren();
  for (const choice of [{ id: '', name: 'All models' }, ...groups]) {
    const option = document.createElement('option');
    option.value = choice.id;
    option.textContent = choice.id === '' ? 'Group: all models' : 'Group: ' + choice.name;
    option.selected = choice.id === (group?.id ?? '');
    picker.appendChild(option);
  }
  const list = document.getElementById('rotationList');
  list.replaceChildren();
  const pool = modelInfo?.rotation ?? [];
  const shown = group === null
    ? pool
    : group.entries.flatMap((entry) => pool.filter((item) => item.provider === entry.provider && item.model === entry.model));
  const now = Date.now();
  for (const entry of shown) {
    const row = document.createElement('div');
    row.className = 'prow';
    const text = document.createElement('div');
    text.className = 'nm';
    const name = document.createElement('div');
    name.style.fontFamily = 'ui-monospace, Menlo, monospace';
    name.style.fontSize = '14px';
    name.textContent = entry.model;
    const detail = document.createElement('div');
    detail.className = 'pdetail';
    detail.textContent = [
      entry.label,
      entry.outOfUsage ? '' : compactTokens(entry.inputTokens) + ' in · ' + compactTokens(entry.outputTokens) + ' out',
      entry.ready ? '' : 'no key',
      !entry.outOfUsage && entry.coolingUntil && entry.coolingUntil > now ? 'resting' : ''
    ].filter((part) => part !== '').join(' · ');
    text.append(name, detail);
    // Its quota ran out: said in red, so it can be taken out and replaced.
    if (entry.outOfUsage) {
      const spent = document.createElement('div');
      spent.className = 'pdetail';
      spent.style.color = '#e06c6c';
      spent.textContent = 'out of usage — replace it, or it is tried only when nothing else is left';
      spent.title = entry.outOfUsage.reason;
      text.appendChild(spent);
    }
    // Taking a model out of the pool deletes nothing: lime, not red.
    const remove = document.createElement('button');
    remove.className = 'pm';
    remove.textContent = '×';
    remove.setAttribute('aria-label', 'Take ' + entry.model + (group === null ? ' out of the rotation' : ' out of ' + group.name));
    remove.onclick = () => void saveShown(shown.filter((item) => !(item.provider === entry.provider && item.model === entry.model)));
    row.append(text, remove);
    list.appendChild(row);
  }
  if (shown.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'faint';
    empty.style.padding = '4px 0 8px';
    empty.textContent = group === null
      ? 'No models yet. Add two or more to rotate between them.'
      : 'No models in ' + group.name + ' yet.';
    list.appendChild(empty);
  }
  // The add row offers only providers that can be reached.
  const select = document.getElementById('rotProvider');
  const chosen = select.value;
  select.replaceChildren();
  for (const provider of (modelInfo?.providers ?? []).filter((entry) => entry.available)) {
    const option = document.createElement('option'); option.value = provider.id; option.textContent = provider.label;
    option.selected = provider.id === chosen; select.appendChild(option);
  }
  fillRotationModels();
  document.getElementById('rotReset').classList.toggle('hidden', pool.length === 0);
}

/** The ids the chosen provider lists, offered while typing one to add. */
function fillRotationModels() {
  const provider = (modelInfo?.providers ?? []).find((entry) => entry.id === document.getElementById('rotProvider').value);
  const list = document.getElementById('rotModels');
  list.replaceChildren();
  for (const id of new Set([...(provider?.listed ?? []), ...(provider?.models ?? [])])) {
    const option = document.createElement('option'); option.value = id; list.appendChild(option);
  }
  const field = document.getElementById('rotModel');
  field.placeholder = provider?.defaultModel ? provider.defaultModel : 'Model id';
}

async function saveRotation(entries, reset = false) {
  try {
    const info = await jfetch('/api/rotation', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify(reset ? { reset: true, sessionId: currentSession } : {
        entries: entries.map(({ provider, model }) => ({ provider, model })), sessionId: currentSession
      })
    });
    providersChanged(info);
  } catch (error) { showError(error); }
}

/** The list on screen changed: the group in use when there is one, else the pool. */
async function saveShown(entries) {
  const group = activeRotationGroup(modelInfo);
  if (group === null) { await saveRotation(entries); return; }
  const groups = (modelInfo?.rotationGroups ?? []).map((item) => ({
    id: item.id,
    name: item.name,
    entries: (item.id === group.id ? entries : item.entries).map(({ provider, model }) => ({ provider, model }))
  }));
  try {
    const info = await jfetch('/api/rotation', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ groups, sessionId: currentSession })
    });
    providersChanged(info);
  } catch (error) { showError(error); }
}

/** Every session rotates over this group from its next prompt; '' is the whole pool. */
async function useRotationGroup(id) {
  try {
    const info = await jfetch('/api/rotation', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ group: id === '' ? null : id, sessionId: currentSession })
    });
    providersChanged(info);
  } catch (error) { showError(error); }
}

async function setRotationEnabled(enabled) {
  try {
    const info = await jfetch('/api/rotation', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ enabled, sessionId: currentSession })
    });
    providersChanged(info);
  } catch (error) { showError(error); }
}

async function addRotationModel() {
  const provider = document.getElementById('rotProvider').value;
  const field = document.getElementById('rotModel');
  const known = (modelInfo?.providers ?? []).find((entry) => entry.id === provider);
  const model = field.value.trim() || known?.defaultModel || '';
  if (provider === '' || model === '') { showError('Pick a provider and type a model id first.'); return; }
