<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>anticode remote</title>
<style>
  :root {
    color-scheme: dark;
    --glass-panel: linear-gradient(145deg, rgba(255,255,255,.055), transparent 44%), rgba(31,31,31,.54);
    --glass-control: linear-gradient(145deg, rgba(255,255,255,.065), transparent 52%), rgba(46,46,46,.48);
    --glass-field: rgba(31,31,31,.46);
    --glass-border: rgba(255,255,255,.13);
  }
  * { box-sizing: border-box; }
  html { background: #1a1a1a; }
  body {
    margin: 0; color: #ededed;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  /* The soft light in two corners lives on its own layer, pinned to the
     screen. Painted on the page it was sized to the page, and a page shorter
     than the screen repeated it in bands down the glass, like steps. */
  body::before {
    content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(circle at 18% -8%, rgba(255,255,255,.045), transparent 32%), radial-gradient(circle at 84% 108%, rgba(255,255,255,.025), transparent 38%);
  }
  /* 16px+ on every control keeps Safari from zooming on focus. */
  input, textarea, select, button { font-size: 16px; }
  header {
    position: sticky; top: 0; display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px;
    align-items: center; gap: 10px;
    padding: calc(9px + env(safe-area-inset-top)) 14px 9px;
    font-weight: 600; z-index: 5;
  }
  /* No edge under the header: the page scrolls beneath it, and the blur over
     it thins out downward until the last few pixels are the page itself.
     Four stacked layers stand in for a true variable blur — each blurs what
     the one before already blurred, and each stops higher up. The layers
     run a little past the header so the fade finishes below the title. */
  header .hfade {
    position: absolute; left: 0; right: 0; top: 0; bottom: -16px; z-index: -1; pointer-events: none;
    background: linear-gradient(to bottom, rgba(26,26,26,.82) 0%, rgba(26,26,26,.55) 55%, rgba(26,26,26,0) 100%);
  }
  header .hfade i { position: absolute; inset: 0; }
  header .hfade i:nth-child(1) {
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 65%, transparent 100%);
    mask-image: linear-gradient(to bottom, #000 0%, #000 65%, transparent 100%);
  }
  header .hfade i:nth-child(2) {
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 50%, transparent 88%);
    mask-image: linear-gradient(to bottom, #000 0%, #000 50%, transparent 88%);
  }
  header .hfade i:nth-child(3) {
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 35%, transparent 75%);
    mask-image: linear-gradient(to bottom, #000 0%, #000 35%, transparent 75%);
  }
  header .hfade i:nth-child(4) {
    -webkit-backdrop-filter: blur(24px) saturate(125%); backdrop-filter: blur(24px) saturate(125%);
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 20%, transparent 60%);
    mask-image: linear-gradient(to bottom, #000 0%, #000 20%, transparent 60%);
  }
  /* Header and composer buttons are bare glyphs; their glass circle or box
     shows only while a finger is on them, together with the lime. */
  header .roundbtn {
    display: flex; width: 48px; height: 48px; align-items: center; justify-content: center;
    border: 1px solid transparent; border-radius: 50%; background: transparent;
    color: #ededed; padding: 0;
    transition: color .15s, background .15s, border-color .15s;
  }
  header .roundbtn:active {
    color: #d1fa22; border-color: rgba(255,255,255,.14);
    background: linear-gradient(145deg, rgba(255,255,255,.09), rgba(36,36,36,.34));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
  }
  header .roundbtn.placeholder { visibility: hidden; }
  header .headcopy {
    min-width: 0; text-align: center; line-height: 1.25;
    touch-action: pan-y; user-select: none; -webkit-user-select: none;
  }
  header .title {
    display: block; font-size: 17px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  header .subtitle:empty { display: none; }
  header .subtitle { display: block; min-height: 16px; margin-top: 2px; color: #9a9a9a; font-size: 12px; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* The three-dot menu is anchored to its trigger like a real popover. Both
     the scrim and the panel transmit the page, at different blur depths. */
  #menuDrop {
    position: fixed; inset: 0; z-index: 30; background: rgba(10,10,10,.24);
    -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
  }
  #menuDrop .mcol {
    width: 210px; margin: calc(70px + env(safe-area-inset-top)) 14px 0 auto;
    background: linear-gradient(145deg, rgba(255,255,255,.07), transparent 36%), rgba(35,35,35,.58);
    border: 1px solid rgba(255,255,255,.15); border-radius: 16px;
    padding: 7px; box-shadow: 0 18px 42px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.06);
    -webkit-backdrop-filter: blur(28px) saturate(125%); backdrop-filter: blur(28px) saturate(125%);
  }
  #menuDrop .mrow {
    display: block; width: 100%; min-height: 42px; background: transparent; border: none;
    border-radius: 10px; padding: 9px 12px;
    cursor: pointer; color: #ededed; font-size: 16px; font-weight: 500; text-align: left;
  }
  #menuDrop .mrow:active { color: #d1fa22; background: rgba(255,255,255,.065); }
  /* --composer-height is the composer's content box; its padding, border and
     bottom offset add 26px more. The rest is air between the transcript's
     last line (or the working dot) and the composer's edge. */
  /* Vertical scrolling and zoom stay the browser's; a sideways drag is left
     to the page, which uses it to change session. */
  main { padding: 12px 16px calc(var(--composer-height, 160px) + 26px + 18px); touch-action: pan-y pinch-zoom; }
  .card {
    background: var(--glass-panel); border: 1px solid var(--glass-border); border-radius: 12px;
    padding: 10px 14px; margin-bottom: 8px;
    box-shadow: 0 14px 34px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.055);
    -webkit-backdrop-filter: blur(22px) saturate(122%); backdrop-filter: blur(22px) saturate(122%);
  }
  .row {
    display: flex; align-items: baseline; gap: 8px; padding: 11px 2px;
    border-bottom: 1px solid #262626; cursor: pointer;
  }
  .row:last-child { border-bottom: none; }
  .row .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .delbtn {
    flex: none; min-width: 26px; height: 26px; padding: 0 5px; border-radius: 6px; border: none;
    background: none; color: #6d6d6d; font-size: 11px; line-height: 1; cursor: pointer;
  }
  .delbtn:hover { color: #e06c6c; background: #2a2020; }
  .badge {
    flex: none; width: 22px; height: 22px; border-radius: 6px; display: inline-flex;
    align-items: center; justify-content: center; font-size: 12px; font-weight: 600;
    color: rgba(255,255,255,.95);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35);
  }
  .badge .radar {
    display: block; width: 15px; height: 15px; border-radius: 50%;
    background: conic-gradient(from 0deg, #d1fa22, rgba(209,250,34,0) 90deg);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 1.5px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 1.5px));
    animation: spin 1.2s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg .icode {
    font-family: ui-monospace, Menlo, monospace; font-size: 0.86em;
    background: #262626; border-radius: 5px; padding: 1px 5px; color: #d0d0d0;
    -webkit-box-decoration-break: clone; box-decoration-break: clone;
  }
  /* The reply's markdown, spaced the way the desktop spaces it: a blank line
     is a gap, headings step down in size, list items hang from a dot. */
  .msg.assistant { line-height: 1.55; }
  .msg strong { font-weight: 600; color: #f5f5f5; }
  .md-p { padding: 1px 0; }
  .md-gap { height: 12px; }
  .md-h { font-weight: 650; color: #f5f5f5; line-height: 1.3; margin: 20px 0 8px; }
  .md-h.first { margin-top: 2px; }
  .md-gap + .md-h { margin-top: 8px; }
  .md-h1 { font-size: 21px; }
  .md-h2 { font-size: 18.5px; }
  .md-h3 { font-size: 16.5px; }
  .md-hr { border-top: 1px solid #303030; margin: 16px 0; }
  .md-li { display: flex; align-items: flex-start; gap: 10px; padding: 3px 0; white-space: normal; }
  .md-li .md-body { flex: 1; min-width: 0; }
  .md-dot {
    flex: none; width: 5px; height: 5px; border-radius: 50%; background: #9a9a9a;
    margin: calc(0.775em - 2.5px) 3px 0 4px;
  }
  .md-dot.sub { background: none; border: 1px solid #7a7a7a; width: 5px; height: 5px; box-sizing: border-box; }
  .md-num { flex: none; min-width: 1.3em; color: #9a9a9a; font-variant-numeric: tabular-nums; text-align: right; }
  .md-tick { flex: none; }
  .md-quote { border-left: 2px solid #3a3a3a; padding: 1px 0 1px 12px; margin: 2px 0; color: #9a9a9a; }
  .md-table { margin: 6px 0; overflow-x: auto; white-space: normal; }
  .md-table table { border-collapse: collapse; font-size: 14px; min-width: 100%; }
  .md-table th, .md-table td { padding: 6px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid #262626; }
  .md-table th { color: #9a9a9a; font-weight: 500; border-bottom-color: #303030; }
  .muted { color: #9a9a9a; }
  .faint { color: #6d6d6d; font-size: 14px; }
  .msg { padding: 8px 0; border-bottom: 1px solid #262626; white-space: pre-wrap; word-break: break-word; }
  .msg.user { text-align: right; }
  .msg.user .bubble {
    display: inline-block; text-align: left; background: #272727; border-radius: 12px;
    padding: 8px 12px; max-width: 85%;
  }
  .msg .tool { color: #9a9a9a; font-size: 13.5px; font-family: ui-monospace, Menlo, monospace; }
  /* A run of tool calls collapses to one line — "ran 5 steps" — exactly as on
     the desktop; the individual steps live behind the disclosure. */
  .tgroup { margin: 12px 0; }
  .tgroup > summary {
    list-style: none; display: flex; align-items: center; gap: 10px;
    padding: 2px 0; cursor: pointer; color: #9a9a9a; font-size: 14px;
  }
  .tgroup summary::-webkit-details-marker { display: none; }
  .tgroup .tdot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #6d6d6d; }
  .tgroup .tdot.live { background: #9a9a9a; animation: breathe 1.6s ease-in-out infinite; }
  .tgroup .tdot.bad { background: #e06c6c; }
  .tgroup .tlabel { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tchev { flex: none; font-size: 11px; color: #6d6d6d; }
  .tgroup .tbody { border-left: 1px solid #303030; margin: 4px 0 4px 3px; padding-left: 16px; }
  .trow { padding: 8px 0; }
  .trow > summary {
    list-style: none; display: flex; align-items: baseline; gap: 10px;
    padding: 2px 0; cursor: pointer; color: #ededed; font-size: 15px;
  }
  .trow summary::-webkit-details-marker { display: none; }
  .trow .tname { flex: none; }
  .trow .tname.bad { color: #e06c6c; }
  .trow .tout.diff { white-space: pre; overflow-x: auto; }
  .tout.diff .dadd { color: #5ac37f; background: rgba(90,195,127,.1); }
  .tout.diff .ddel { color: #e06c6c; background: rgba(224,108,108,.1); }
  .tout.diff .dhunk { color: #6d6d6d; }
  .trow .tsubject {
    flex: 1; min-width: 0; color: #9a9a9a; font-size: 13px;
    font-family: ui-monospace, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .trow .tout {
    margin: 8px 0 0; max-height: 320px; overflow: auto; background: #202020;
    border: 1px solid #303030; border-radius: 10px; padding: 10px 12px;
    font: 12.5px/1.6 ui-monospace, Menlo, monospace; color: #9a9a9a;
    white-space: pre-wrap; word-break: break-word;
  }
  /* A line the app writes about itself — pausing, resuming. Left, grey, no
     bubble, exactly like a tool-group line. */
  .notice { padding: 8px 0; color: #9a9a9a; font-size: 14px; transition: color .15s; }
  .notice:hover, .notice:active { color: #d1fa22; }
  /* The line that closes a run: model, a copy button, how long it took, and
     what it cost. Centred and faint, exactly as on the desktop. */
  .runsum {
    display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
    gap: 8px; margin: 12px 0; min-height: 25px; color: #6d6d6d; font-size: 12.5px;
  }
  .runsum .copy {
    display: inline-flex; align-items: center; background: none; border: none;
    color: #6d6d6d; padding: 2px 4px; font-size: 12.5px; line-height: 1;
  }
  .runsum .copy:active, .runsum:hover .copy:hover { color: #d1fa22; }
  /* Text the model wrote to be used elsewhere — a drafted prompt, a block of
     code — in the same mono face the model name wears, with a copy control at
     each end so a long block needs no scrolling back. */
  .promptblock { margin: 12px 0; }
  .promptblock .pbar { display: flex; align-items: center; gap: 8px; padding: 0 2px 4px; }
  .promptblock .pbar.bottom { padding: 4px 2px 0; }
  .promptblock .plabel {
    flex: 1; min-width: 0; color: #6d6d6d; font-size: 11px;
    letter-spacing: .06em; text-transform: uppercase;
  }
  .promptblock .pcopy {
    flex: none; background: none; border: none; color: #6d6d6d; font-size: 12px;
    padding: 2px 6px;
  }
  .promptblock .pcopy:active { color: #d1fa22; }
  .promptblock pre {
    margin: 0; overflow-x: auto; background: #202020; border: 1px solid #303030;
    border-radius: 10px; padding: 10px 12px; color: #ededed;
    font: 12.5px/1.6 ui-monospace, Menlo, monospace;
    white-space: pre-wrap; word-break: break-word;
  }
  /* Selecting part of a reply offers to answer that passage. The button rides
     above the selection; the quote it makes sits over the composer, like a
     staged file, and clears on a tap outside. */
  /* Below the selection, never above it: iOS puts its own Salin / Temukan
     Pilihan / Terjemahkan bar over the top edge and would bury this. */
  #replyBtn {
    position: fixed; z-index: 40; transform: translateX(-50%);
    background: #d1fa22; border: none; border-radius: 10px;
    color: #1a1a1a; font-size: 14px; font-weight: 600; padding: 9px 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  #replyBtn:active { background: #c4ef1f; }
  #quoteRow {
    flex: 0 0 100%; display: flex; align-items: flex-start; gap: 8px;
    background: #202020; border: 1px solid #303030; border-radius: 10px;
    padding: 8px 10px;
  }
  #quoteRow .qbar { flex: none; align-self: stretch; width: 2px; border-radius: 2px; background: #d1fa22; }
  #quoteRow .qtext { flex: 1; min-width: 0; font-size: 12.5px; color: #9a9a9a; }
  #quoteRow .qlabel { display: block; font-size: 11px; color: #6d6d6d; margin-bottom: 2px; }
  #quoteRow .qbody {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3;
    overflow: hidden; white-space: pre-wrap; word-break: break-word;
  }
  #quoteRow .qx { flex: none; background: none; border: none; color: #6d6d6d; font-size: 16px; line-height: 1; padding: 0 2px; }
  /* A picture opens over the conversation. The page itself cannot zoom (the
     viewport is pinned so controls do not jump), so the viewer carries its own
     fit / actual-size toggle — a dense screenshot has to be readable. */
  #imgViewer { position: fixed; inset: 0; z-index: 60; background: rgba(26,26,26,.97); display: flex; flex-direction: column; }
  #imgViewer .vhead {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px; color: #9a9a9a; font-size: 13px;
  }
  #imgViewer .vname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #imgViewer .vbtn { flex: none; background: none; border: none; color: #ededed; font-size: 14px; padding: 6px 10px; }
  #imgViewer .vbtn:active { color: #d1fa22; }
  #imgViewer .vbody { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; }
  #imgViewer .vbody img { display: block; margin: auto; max-width: 100%; }
  #imgViewer.zoomed .vbody img { max-width: none; width: 200%; margin: 0; }
  /* A file opens over the conversation too, rendered by the Mac — a workbook
     with its colours, a document as paper — instead of leaving as a download. */
  #fileViewer { position: fixed; inset: 0; z-index: 60; background: #1a1a1a; display: flex; flex-direction: column; }
  #fileViewer .vhead {
    flex: none; display: flex; align-items: center; gap: 6px;
    padding: calc(10px + env(safe-area-inset-top)) 10px 8px 16px; color: #9a9a9a; font-size: 13px;
  }
  #fileViewer .vname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #ededed; font-size: 14px; }
  #fileViewer .vbtn { flex: none; background: none; border: none; color: #ededed; font-size: 14px; padding: 6px 10px; text-decoration: none; }
  #fileViewer .vbtn:active { color: #d1fa22; }
  #fileTabs { flex: none; display: flex; gap: 6px; overflow-x: auto; padding: 0 12px 8px; scrollbar-width: none; }
  #fileTabs:empty { display: none; }
  #fileTabs button {
    flex: none; background: none; border: 1px solid transparent; border-radius: 9px; color: #9a9a9a;
    font-size: 13px; padding: 5px 10px; white-space: nowrap;
  }
  #fileTabs button.on { color: #ededed; border-color: var(--glass-border); background: var(--glass-control); }
  #fileTabs button:active { color: #d1fa22; }
  /* A pressed control turns lime while the finger is on it. */
  #questionPanel .qopt:active { color: #d1fa22; border-color: #d1fa22; }
  #fileNote { flex: none; padding: 0 16px 8px; color: #8a8a8a; font-size: 12px; }
  #fileNote:empty { display: none; }
  #fileBody { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; }
  #fileBody iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
  #fileBody img { display: block; margin: auto; max-width: 100%; }
  #fileBody .vmsg { padding: 28px 20px; color: #9a9a9a; font-size: 14px; text-align: center; }
  .att img { cursor: zoom-in; }
  /* The same box as a step group's line and the run's closing line: one
     takes the other's place as the run goes on, and nothing below moves. */
  .working { display: flex; align-items: center; gap: 10px; color: #9a9a9a; margin: 12px 0; padding: 2px 0; font-size: 14px; }
  .working .dot {
    flex: none; width: 8px; height: 8px; border-radius: 50%; background: #9a9a9a;
    animation: breathe 1.6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { background: #9a9a9a; }
    50% { background: #d1fa22; }
  }
  .composer {
    position: fixed; left: 12px; right: 12px; bottom: calc(4px + env(safe-area-inset-bottom));
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px;
    padding: 10px; border: 1px solid rgba(255,255,255,.14); border-radius: 24px;
    background: linear-gradient(145deg, rgba(255,255,255,.06), transparent 42%), rgba(31,31,31,.58);
    box-shadow: 0 18px 42px rgba(0,0,0,.26), inset 0 1px 0 rgba(255,255,255,.075);
    -webkit-backdrop-filter: blur(28px) saturate(125%);
    backdrop-filter: blur(28px) saturate(125%);
    z-index: 20;
  }
  /* The plan todo_write published last, folded to a line until tapped. */
  /* min-width 0: a flex item otherwise grows to fit its longest unwrapped
   * line, and the collapsed plan's one-line step pushed out of the composer. */
  #planRow { flex: 0 0 100%; min-width: 0; font-size: 12.5px; background: rgba(17,17,17,.42); border: 1px solid rgba(255,255,255,.13); border-radius: 12px; padding: 6px 10px; }
  #planRow .phead { display: flex; gap: 8px; align-items: center; }
  #planRow .phead:active .plabel { color: #d1fa22; }
  #planRow .plabel { color: #9a9a9a; flex: none; }
  #planRow .pcount { color: #6d6d6d; flex: none; font-variant-numeric: tabular-nums; }
  #planRow .pnow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #9a9a9a; }
  #planRow ol { margin: 6px 0 0; padding: 0; list-style: none; max-height: 30vh; overflow-y: auto; }
  #planRow li { display: flex; gap: 8px; padding: 1px 0; color: #9a9a9a; overflow-wrap: anywhere; }
  #planRow li .pm { flex: none; width: 12px; text-align: center; color: #6d6d6d; }
  #planRow li.done { color: #6d6d6d; text-decoration: line-through; }
  #planRow li.done .pm { color: #5ac37f; text-decoration: none; }
  #planRow li.now { color: #ededed; }
  /* Prompts waiting for the run to finish, oldest first, above everything else. */
  #queueRow { flex: 0 0 100%; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  #queueRow .qitem {
    display: flex; align-items: center; gap: 8px; font-size: 12.5px;
    background: rgba(17,17,17,.42); border: 1px solid rgba(255,255,255,.13); border-radius: 12px; padding: 6px 10px;
  }
  #queueRow .qn { flex: none; color: #6d6d6d; font-variant-numeric: tabular-nums; }
  #queueRow .qt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #9a9a9a; }
  #queueRow .qt:active, #queueRow .qx:active, #queueRow .qs:active { color: #d1fa22; }
  #queueRow .qx, #queueRow .qs { flex: none; background: none; border: none; color: #6d6d6d; font-size: 15px; line-height: 1; padding: 0 2px; }
  /* Staged files sit on their own row above the text box. */
  #stagedRow { flex: 0 0 100%; display: flex; gap: 8px; overflow-x: auto; }
  #stagedRow .vision-warning { flex: none; max-width: 250px; color: #f3aaaa; font-size: 12px; line-height: 1.35; }
  #stagedRow .chip {
    position: relative; display: flex; align-items: center; gap: 8px; flex: none;
    background: rgba(17,17,17,.42); border: 1px solid rgba(255,255,255,.13); border-radius: 14px; padding: 7px 28px 7px 7px;
  }
  #stagedRow .chip img, .att img { display: block; border-radius: 6px; object-fit: cover; }
  #stagedRow .chip img { width: 48px; height: 48px; border-radius: 10px; }
  /* A staged picture opens full size before it is sent, as it does after. */
  #stagedRow .chip.pic { cursor: pointer; }
  #stagedRow .chip.pic:active { border-color: #d1fa22; }
  #stagedRow .chip.pic:active .nm { color: #d1fa22; }
  #stagedRow .chip .nm { display: block; font-size: 12.5px; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #stagedRow .chip .sz { display: block; font-size: 11px; color: #6d6d6d; }
  #stagedRow .chip .x {
    position: absolute; top: 2px; right: 6px; background: none; border: none; color: #6d6d6d;
    font-size: 15px; line-height: 1; padding: 0;
  }
  .tag {
    flex: none; display: inline-flex; align-items: center; justify-content: center;
    width: 48px; height: 48px; border-radius: 10px; background: rgba(48,48,48,.82);
    font-size: 9px; font-weight: 600; letter-spacing: .5px; color: #9a9a9a;
  }
  .composer .attach {
    flex: none; width: 48px; height: 48px; background: rgba(46,46,46,.64); color: #ededed;
    border: 1px solid rgba(255,255,255,.08); border-radius: 16px;
    padding: 0; font-size: 25px; font-weight: 300; line-height: 1;
  }
  /* Attachments inside the transcript: pictures as pictures, the rest as cards. */
  .atts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin: 6px 0; }
  .att { flex: none; border: 1px solid var(--glass-border); border-radius: 12px; overflow: hidden; background: var(--glass-panel); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
  .att img { max-width: 58vw; max-height: 240px; }
  .att.file { display: flex; align-items: center; gap: 10px; padding: 8px 10px; max-width: 70vw; text-align: left; }
  .att.file .lbl { min-width: 0; }
  /* A long name gives up its middle, never its extension: the end of the name
   * is what says which file it is. */
  .att .nm { display: flex; font-size: 13px; white-space: nowrap; }
  .att .nm .stem { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .att .nm .ext { flex: none; }
  .att .sz { display: block; font-size: 11px; color: #6d6d6d; }
  .artifact {
    display: flex; align-items: center; gap: 10px; margin: 6px 0; padding: 8px 10px;
    background: var(--glass-panel); border: 1px solid var(--glass-border); border-radius: 10px;
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  }
  .artifact .nm {
    flex: 1; min-width: 0; font: 12.5px ui-monospace, Menlo, monospace;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .artifact, .att.file { cursor: pointer; }
  .artifact:active .nm, .artifact:active .tag, .att.file:active .nm, .att.file:active .tag { color: #d1fa22; }
  .artifact a, .dirrow .dl { color: #d1fa22; text-decoration: none; font-size: 13.5px; flex: none; }
  .dirrow .dl { padding: 0 6px; }
  .composer .promptbox { position: relative; flex: 1; min-width: 0; }
  .composer textarea {
    display: block; width: 100%; background: transparent; border: none;
    color: #ededed; padding: 12px 8px 9px; resize: none; min-height: 48px; max-height: 140px;
    font-family: inherit; line-height: 1.45; overflow-y: hidden;
  }
  /* The hint is drawn over the empty box rather than as the field's own
     placeholder, which wraps onto a second line the 48px box then cuts in
     half. It stays on one line, and when the phone is too narrow for it the
     end fades out the way a long model name does. */
  .composer .prompthint {
    display: none; position: absolute; left: 8px; right: 8px; top: 12px;
    color: #8a8a8a; line-height: 1.45; white-space: nowrap; overflow: hidden;
    pointer-events: none;
  }
  .composer textarea:placeholder-shown + .prompthint { display: block; }
  .composer .prompthint.clipped {
    -webkit-mask-image: linear-gradient(to right, #000 0, #000 68%, rgba(0,0,0,.72) 80%, transparent 100%);
    mask-image: linear-gradient(to right, #000 0, #000 68%, rgba(0,0,0,.72) 80%, transparent 100%);
  }
  /* The browser's own focus ring is a thick blue halo that belongs to no one's
     palette. A field being typed in wears one hairline of lime instead. */
  input.path:focus, select.wide:focus, textarea.editor:focus {
    outline: none; border-color: #d1fa22; box-shadow: 0 0 0 0.5px #d1fa22;
  }
  .composer textarea:focus { outline: none; }
  /* The send and pause glyphs are the desktop's own, drawn, not typed. */
  #sendBtn { display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; min-width: 48px; border-radius: 16px; }
  #sendBtn.lime { width: auto; gap: 8px; padding: 0 16px; }
  #sendBtn .sq { width: 10px; height: 10px; border-radius: 2px; background: currentColor; }
  .composer button {
    background: var(--glass-control); color: #ededed; border: 1px solid rgba(255,255,255,.1); border-radius: 10px;
    padding: 0 14px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.055);
    -webkit-backdrop-filter: blur(16px) saturate(120%); backdrop-filter: blur(16px) saturate(120%);
  }
  .composer button:disabled { color: #6d6d6d; }

  .composer .attach, .composer #sendBtn:not(.lime) {
    background: transparent; border-color: transparent; box-shadow: none;
    -webkit-backdrop-filter: none; backdrop-filter: none;
    transition: color .15s, background .15s, border-color .15s;
  }
  .composer .attach:active, .composer #sendBtn:not(.lime):active:not(:disabled) {
    color: #d1fa22; background: var(--glass-control); border-color: rgba(255,255,255,.1);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.055);
  }
  .composer button.lime { background: #d1fa22; color: #1a1a1a; }
  /* A small segmented pill, centred under the title: two short labels side by
     side, sized to their own text rather than the card's width. */
  .mode {
    display: flex; gap: 4px; margin: 0 auto 10px; padding: 3px; width: fit-content;
    background: rgba(20,20,20,.55); border: 1px solid var(--glass-border); border-radius: 10px;
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  }
  .mode button {
    background: none; color: #9a9a9a; border: 1px solid transparent;
    border-radius: 8px; padding: 5px 14px; font-size: 13px; font-weight: 600; transition: color .15s, background .15s;
  }
  .mode button:active { color: #d1fa22; }
  .mode button.on { color: #1a1a1a; background: #d1fa22; border-color: #d1fa22; }
  .path {
    width: 100%; background: var(--glass-field); border: 1px solid var(--glass-border); border-radius: 8px;
    color: #ededed; padding: 8px 10px; font: 16px ui-monospace, Menlo, monospace; margin-bottom: 8px;
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  }
  select.wide {
    width: 100%; background: var(--glass-field); border: 1px solid var(--glass-border); border-radius: 8px;
    color: #ededed; padding: 8px 10px; margin-bottom: 8px;
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  }
  textarea.editor {
    width: 100%; min-height: 45vh; background: var(--glass-field); border: 1px solid var(--glass-border);
    border-radius: 10px; color: #ededed; padding: 12px;
    font: 15px/1.6 ui-monospace, Menlo, monospace; white-space: pre; margin-bottom: 8px;
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .actions button {
    flex: 1; min-width: 0; background: var(--glass-control); color: #ededed;
    border: 1px solid var(--glass-border); border-radius: 8px; padding: 9px 13px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.055);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  }
  /* Layar sentuh tidak punya hover; ditekan adalah padanannya, dan lime. */
  .actions button:active:not(:disabled) { color: #d1fa22; }
  /* Appears only once a model id has been typed, so it reads as the thing to
     press next — same box as Start, its own colour. */
  .actions button.alt { background: #d1fa22; color: #1a1a1a; border-color: #d1fa22; }
  .actions button:disabled { color: #6d6d6d; border-color: #262626; }
  .hidden { display: none !important; }
  .crumb { font: 14px ui-monospace, Menlo, monospace; color: #9a9a9a; margin-bottom: 8px; word-break: break-all; }
  .dirrow { display: flex; align-items: baseline; gap: 8px; padding: 9px 2px; border-bottom: 1px solid #262626; cursor: pointer; }
  .dirrow:last-child { border-bottom: none; }
  .dirrow .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dirrow.folder .name { color: #b3b0f5; }
  .back { color: #9a9a9a; cursor: pointer; padding: 4px 2px; }
  /* The session's tabs, as chips: the active one reads as pressed. */
  #webTabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 8px; padding-bottom: 2px; }
  #webTabs .wtab {
    display: flex; align-items: center; gap: 6px; flex-shrink: 0; max-width: 60%;
    background: var(--glass-control); border: 1px solid var(--glass-border); border-radius: 8px;
    padding: 6px 8px 6px 10px; color: #9a9a9a; font-size: 14px;
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  }
  #webTabs .wtab.on { color: #ededed; border-color: rgba(255,255,255,.22); background: var(--glass-control); }
  #webTabs .wtab .wlabel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #webTabs .wtab .wx { background: none; border: none; color: #6d6d6d; font-size: 17px; padding: 0 2px; }
  #webTabs .wtab:active .wlabel, #webTabs .wtab .wx:active { color: #d1fa22; }
  #webTabs .wadd {
    flex-shrink: 0; background: none; border: 1px dashed #3a3a3a; border-radius: 8px;
    color: #9a9a9a; font-size: 17px; padding: 4px 12px;
  }
  #webTabs .wadd:active { color: #d1fa22; border-color: #d1fa22; }
  /* The page is rendered at a phone's width and its whole height, so it is
     read the way a phone reads a page: full width, scrolled with a thumb. The
     frame sits outside the card and out of main's padding, edge to edge, to
     give the page every pixel the screen has. */
  #webFrame { margin: 0 -16px; border-top: 1px solid #303030; background: #fff; position: relative; }
  #webShot { display: block; width: 100%; height: auto; }
  #webLoading {
    position: sticky; top: 0; background: #202020; color: #9a9a9a;
    font-size: 13px; padding: 6px 14px; border-bottom: 1px solid #303030;
  }
  /* The desktop composer's chip row, under the box: the model, Default or
     Auto, and Revert while paused. Plain words that turn lime under a finger. */
  #chipRow { flex: 0 0 100%; display: flex; align-items: center; gap: 2px; min-width: 0; padding: 0 2px 1px; }
  #chipRow .grow { flex: 1; }
  .composer #chipRow button {
    background: none; color: #9a9a9a; padding: 4px 8px; border-radius: 8px; font-size: 13px;
    border-color: transparent; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .composer #chipRow button:active {
    color: #d1fa22; background: var(--glass-control); border-color: rgba(255,255,255,.1);
  }
  .composer #chipRow #planChip.on {
    color: #d1fa22; background: var(--glass-control); border-color: rgba(255,255,255,.1);
  }
  .composer #chipRow #modelChip {
    position: relative; flex: 0 1 44vw; max-width: 44vw; text-align: left;
    font-family: ui-monospace, Menlo, monospace; text-overflow: clip;
  }
  #modelChip .modelText { display: block; overflow: hidden; white-space: nowrap; }
  #modelChip.clipped .modelText {
    -webkit-mask-image: linear-gradient(to right, #000 0, #000 68%, rgba(0,0,0,.72) 80%, transparent 100%);
    mask-image: linear-gradient(to right, #000 0, #000 68%, rgba(0,0,0,.72) 80%, transparent 100%);
  }
  .composer #chipRow #revertBtn { flex: none; color: #ededed; }
  /* Settings rise from the bottom over whatever is open, so a chat is still
     there, where it was, once they close. */
  #settingsSheet {
    position: fixed; inset: 0; z-index: 40; background: rgba(10,10,10,.3);
    display: flex; align-items: flex-end;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  #settingsSheet .sheet {
    width: 100%; max-height: 88vh; overflow: auto; background: var(--glass-panel);
    border: 1px solid var(--glass-border); border-bottom: none; border-radius: 22px 22px 0 0;
    padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
    box-shadow: 0 -18px 48px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.06);
    -webkit-backdrop-filter: blur(28px) saturate(125%); backdrop-filter: blur(28px) saturate(125%);
  }
  .sheet .shead { display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 17px; }
  .sheet .shead button { background: none; border: none; color: #ededed; font-size: 15px; padding: 6px 4px; }
  .sheet .shead button:active { color: #d1fa22; }
  .ssec { padding: 12px 0 4px; border-top: 1px solid #2a2a2a; margin-top: 10px; }
  .ssec > .muted { margin-bottom: 8px; font-size: 14px; }
  .ssec .mode { margin-bottom: 6px; }
  .mode button:active { color: #d1fa22; }
  /* The new-session page: the mode pill floats centred just under the blurred
     header, and the page it titles is an empty chat — nothing else. The
     provider/folder details are tucked away until anticode is picked. */
  #newSessionCard { padding-top: 4px; }
  #newSessionCard .mode { margin: 2px auto 0; }
  #newSessionCard .path, #newSessionCard select.wide, #newSessionCard .actions { display: none; }
  #newSessionCard.picking .path, #newSessionCard.picking select.wide { display: block; }
  #newSessionCard.picking .actions { display: flex; margin-top: 8px; }
  .usage { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; font-size: 14px; }
  .usage span:nth-child(odd) { color: #6d6d6d; }
  .prow { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid #262626; font-size: 15px; }
  .prow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pedit { padding: 10px 0; border-bottom: 1px solid #262626; }
  /* Removing a provider is destructive: red, never lime. */
  .prow .px { flex: none; background: none; border: none; color: #6d6d6d; font-size: 18px; line-height: 1; padding: 2px 6px; }
  .prow .px:active { color: #e06c6c; }
  .prow .nm .pdetail { color: #6d6d6d; font: 12.5px ui-monospace, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
  .prow .pstate { flex: none; color: #d1fa22; font-size: 13px; }
  .prow .pm { flex: none; background: none; border: none; color: #9a9a9a; font-size: 14px; padding: 2px 6px; }
  .prestore { background: none; border: none; color: #9a9a9a; font-size: 14px; padding: 10px 0 2px; }
  .prestore:active { color: #d1fa22; }
  .prow .pm:active { color: #d1fa22; }
  /* The desktop's switch: lime track with a dark knob when on, glass with a
     white knob when off. The knob lights up while a finger is on it. */
  .shead2 { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .shead2 .muted { font-size: 14px; }
  .switch {
    flex: none; width: 44px; height: 26px; border-radius: 13px; padding: 3px; cursor: pointer;
    background: var(--glass-control); border: 1px solid var(--glass-border); transition: background-color .15s;
  }
  .switch::after {
    content: ''; display: block; width: 18px; height: 18px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s, background-color .15s;
  }
  .switch:active::after { background: #d1fa22; }
  .switch.on { background: #d1fa22; border-color: #d1fa22; }
  .switch.on::after { transform: translateX(18px); background: #1a1a1a; }
  /* A provider's model ids, typed one per line — for gateways with no /models. */
  textarea.models {
    width: 100%; min-height: 84px; background: var(--glass-field); border: 1px solid var(--glass-border);
    border-radius: 8px; color: #ededed; padding: 8px 10px; margin: 8px 0;
    font: 15px/1.5 ui-monospace, Menlo, monospace; resize: vertical;
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  }
  textarea.models:focus { outline: none; border-color: #d1fa22; box-shadow: 0 0 0 0.5px #d1fa22; }
  .pedit .faint { display: block; margin-bottom: 8px; }
  #providerList { margin-bottom: 10px; }
  .serr { margin: 8px 0 0; padding: 8px 10px; border: 1px solid #945050; border-radius: 8px; color: #f3aaaa; font-size: 14px; overflow-wrap: anywhere; }
  #sessionSearch { margin-bottom: 8px; }
  /* Back and Forward are arrows, as in the desktop pane, so five fit a phone. */
  .actions button.navbtn { flex: 0 0 44px; padding: 5px 0; font-size: 22px; line-height: 1; }
  /* A diff waiting for approval reads the way the desktop draws it. */
  .dadd { color: #5ac37f; }
  .ddel { color: #e06c6c; }
</style>
</head>
<body>
<header>
  <div class="hfade" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <button class="roundbtn placeholder" id="headerBack" onclick="gotoSessions()" aria-label="Back">
    <svg width="21" height="21" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M10.5 2.5 5 8l5.5 5.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="headcopy">
    <span class="title" id="menuTitle">anticode</span>
    <span class="subtitle" id="menuSubtitle"></span>
  </div>
  <button class="roundbtn" id="menuBtn" onclick="toggleMenu(event)" aria-label="Menu">
    <svg width="23" height="7" viewBox="0 0 23 7" fill="currentColor" aria-hidden="true"><circle cx="3.5" cy="3.5" r="2"/><circle cx="11.5" cy="3.5" r="2"/><circle cx="19.5" cy="3.5" r="2"/></svg>
  </button>
</header>
<div id="menuDrop" class="hidden" onclick="if (event.target === this) closeMenu()">
  <div class="mcol">
    <button class="mrow" onclick="gotoNew()">New session</button>
    <button class="mrow" onclick="gotoSessions()">Sessions</button>
    <button class="mrow" onclick="gotoWeb()">Web</button>
    <button class="mrow" onclick="gotoFiles()">Files</button>
    <button class="mrow" id="exportRow" onclick="exportSession()">Export transcript</button>
    <button class="mrow" onclick="openSettings()">Settings</button>
  </div>
</div>
<div id="errorBanner" role="alert" class="hidden" style="margin:12px 16px;padding:12px;border:1px solid #945050;border-radius:8px;color:#f3aaaa;overflow-wrap:anywhere"><span id="errorMessage"></span><button style="margin-left:10px" onclick="document.getElementById('errorBanner').classList.add('hidden')">Dismiss</button></div>
<main>
  <section id="viewChat">
    <div id="dashboard" class="hidden">
      <div id="newSessionCard">
        <div class="mode" id="newModePill">
          <button id="modeChat" class="on" onclick="setMode('chat')">antichat</button>
          <button id="modeCode" onclick="setMode('code')">anticode</button>
        </div>
        <input class="path hidden" id="folderInput" list="knownFolders" autocapitalize="off" autocorrect="off" spellcheck="false"
          placeholder="Folder on the Mac, e.g. /Users/me/Projects/app" />
        <datalist id="knownFolders"></datalist>
        <select class="wide" id="providerSelect" aria-label="Provider" onchange="pickProvider(this.value)"></select>
        <select class="wide" id="modelSelect" aria-label="Model" onchange="pickModel(this.value)"></select>
        <input class="path" id="customModelId" placeholder="Custom model ID (optional)" oninput="updateModelIdBtn()" />
        <div class="actions" style="margin-bottom:0">
          <button onclick="startSession()">Start</button>
          <button id="useModelBtn" class="alt hidden" onclick="applyCustomModel()">Use model ID</button>
        </div>
      </div>
      <input class="path hidden" id="sessionSearch" type="search" placeholder="Search sessions"
        autocapitalize="off" autocorrect="off" spellcheck="false" oninput="renderSessionList()" />
      <div id="sessionList" class="card"></div>
    </div>
    <div id="chatView" class="hidden">
      <div id="transcript"></div>
    </div>
  </section>
  <section id="viewWeb" class="hidden">
    <div class="card">
      <select class="wide" id="webSession" aria-label="Session" onchange="pickWebSession(this.value)"></select>
      <div id="webTabs"></div>
      <input class="path" id="webAddress" placeholder="localhost:5173" autocapitalize="off" autocorrect="off" spellcheck="false"
        enterkeyhint="go" onkeydown="if (event.key === 'Enter') openWebAddress().catch(showError)" />
      <div class="actions">
        <button id="webBackBtn" class="navbtn" aria-label="Back" title="Back" onclick="stepWeb('back').catch(showError)" disabled>&#8249;</button>
        <button id="webFwdBtn" class="navbtn" aria-label="Forward" title="Forward" onclick="stepWeb('forward').catch(showError)" disabled>&#8250;</button>
        <button onclick="openWebAddress().catch(showError)">Open</button>
        <button onclick="refreshWebShot(true).catch(showError)">Reload</button>
        <button id="webHideBtn" onclick="toggleWebHidden().catch(showError)">Hide</button>
      </div>
      <div class="crumb" id="webNote" style="margin-bottom:0">No page yet — the agent opens one, or type an address.</div>
    </div>
    <div id="webFrame" class="hidden">
      <div id="webLoading" class="hidden">Loading…</div>
      <img id="webShot" alt="" />
    </div>
  </section>
  <section id="viewFiles" class="hidden">
    <div class="card">

<script>
const token = new URLSearchParams(location.search).get('token') || '';
const api = (path, options) => fetch(path + (path.includes('?') ? '&' : '?') + 'token=' + token, options);
const jfetch = (path, options) => api(path, options).then(async (r) => {
  const body = await r.json();
  if (!r.ok) {
    if (r.status === 401) {
      stopOverviewPolling();
      eventSource?.close(); eventSource = null; currentRunId = null;
      throw new Error('Pairing expired. Open the current pairing link from desktop Settings → Remote.');
    }
    throw new Error(body.error || r.status);
  }
  return body;
});
let currentSession = null;
let currentRunId = null;
let currentPlan = null;
/** The composer's build/plan choice, carried with each prompt. */
let phonePlan = false;
let planOpen = null;
let submitting = false;
let streamReady = null;
let openedSessionId = null;
let fileVersion = null;
let savedContent = '';
function escapeHtml(value) { return String(value).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showError(error) {
  document.getElementById('errorMessage').textContent = error?.message || String(error);
  document.getElementById('errorBanner').classList.remove('hidden');
  // Settings cover the banner; a failure there has to be said there.
  if (!document.getElementById('settingsSheet').classList.contains('hidden')) {
    const inSheet = document.getElementById('settingsError');
    inSheet.textContent = error?.message || String(error);
    inSheet.classList.remove('hidden');
  }
}
let eventSource = null;
/* A mirror of the Mac's pauses: pressed here or on the desktop, the main
 * process owns them and tells both screens, so either can resume. */
const pausedSessions = new Set();
let currentPath = '.';
let openedFile = null;
let folderReady = false;
let creatingSession = false;
let phoneMode = 'chat';
/** Prompt typed on the new-session page, sent once the session exists. */
let pendingFirstPrompt = null;
let modelInfo = null;
/** The model choice that is not one model: the Rotate usage pool (ROTATE_PROVIDER). */
const ROTATE = 'rotate';
/** Compact composer label; Settings keeps the fuller wording. */
const ROTATE_LABEL = 'rotate';
let overviewTimer = null;
let lastSessions = [];
let webList = [];
let webSessionId = null;
let webTimer = null;
/** Back and Forward for each pane's active tab, as the Mac tracks them. */
let webHistory = {};
/** Provider, model and Default/Auto, as the Mac last reported them. */
let lastStatus = null;
/** What the open session has used, from its last sync. */
let lastUsage = null;
/** Invalidates async work belonging to a session the phone already left. */
let sessionOpenSeq = 0;

let approvalRequestId = null;
async function pollApprovals() {
  const panel = document.getElementById('approvalPanel');
  if (!currentSession) { panel.classList.add('hidden'); approvalRequestId = null; return; }
  const id = currentSession;
  try {
    const { requests, exists, status } = await jfetch('/api/approvals?sessionId=' + encodeURIComponent(id));
    if (status) noteStatus(status);
    if (currentSession !== id) return;
    // Deleted from the desktop while it was open here: leave rather than sit
    // on a session that no longer exists.
    if (exists === false) {
      showError('Sesi ini sudah dihapus dari desktop.');
      forgetLastSession();
      gotoSessions();
      return;
    }
    const request = requests[0];
    if (!request) { panel.classList.add('hidden'); approvalRequestId = null; return; }
    if (request.requestId === approvalRequestId) return;
    approvalRequestId = request.requestId;
    panel.replaceChildren();
    const title = document.createElement('strong'); title.textContent = 'Approval · ' + request.toolName + ' · ' + request.risk;
    const detail = document.createElement('pre'); detail.style.cssText = 'white-space:pre-wrap;overflow-wrap:anywhere;max-height:30vh;overflow:auto';
    detail.textContent = request.preview.subject + '\n';
    for (const line of String(request.preview.detail).split('\n')) {
      const span = document.createElement('span');
      if (request.preview.kind === 'diff' && /^\+(?!\+\+)/.test(line)) span.className = 'dadd';
      else if (request.preview.kind === 'diff' && /^-(?!--)/.test(line)) span.className = 'ddel';
      span.textContent = line + '\n';
      detail.appendChild(span);
    }
    panel.append(title, detail);
    for (const decision of ['reject', 'approve', ...(request.allowAlways ? ['always'] : [])]) {
      const button = document.createElement('button'); button.textContent = decision === 'always' ? 'Allow this session' : decision === 'approve' ? 'Approve' : 'Reject';
      button.style.marginRight = '8px';
      button.onclick = async () => {
        button.disabled = true;
        try { await jfetch('/api/approval', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({requestId:request.requestId,decision})}); panel.classList.add('hidden'); approvalRequestId=null; }
        catch (error) { showError(error); button.disabled=false; }
      };
      panel.append(button);
    }
    panel.classList.remove('hidden');
  } catch { /* Poll again after a transient connection failure. */ }
}
setInterval(() => { void pollApprovals(); }, 1000);

/* A question the agent asked: options answer with a tap, like approvals. */
let questionRequestId = null;
async function pollQuestions() {
  const panel = document.getElementById('questionPanel');
  if (!currentSession) { panel.classList.add('hidden'); questionRequestId = null; return; }
  const id = currentSession;
  try {
    const { requests } = await jfetch('/api/questions?sessionId=' + encodeURIComponent(id));
    if (currentSession !== id) return;
    const request = requests[0];
    if (!request) { panel.classList.add('hidden'); questionRequestId = null; return; }
    if (request.requestId === questionRequestId) return;
    questionRequestId = request.requestId;
    panel.replaceChildren();
    const title = document.createElement('strong'); title.textContent = 'Pertanyaan';
    const body = document.createElement('p'); body.textContent = request.question;
    panel.append(title, body);
    const answer = async (optionId, text) => {
      try { await jfetch('/api/answer', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({requestId:request.requestId,optionId,text})}); panel.classList.add('hidden'); questionRequestId=null; }
      catch (error) { showError(error); }
    };
    for (const option of request.options) {
      const button = document.createElement('button');
      button.className = 'qopt'; button.style.cssText = 'display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;background:#2a2a2a;border:1px solid #555;border-radius:10px;color:#ededed';
      const label = document.createElement('div'); label.textContent = option.label;
      button.append(label);
      if (option.hint) { const hint = document.createElement('div'); hint.style.cssText = 'font-size:12px;color:#9a9a9a'; hint.textContent = option.hint; button.append(hint); }
      button.onclick = () => { void answer(option.id, ''); };
      panel.append(button);
    }
    if (request.allowCustom) {
      const row = document.createElement('div'); row.style.cssText = 'display:flex;gap:8px;margin-top:6px';
      const input = document.createElement('input');
      input.placeholder = 'Atau jawab sendiri…'; input.style.cssText = 'flex:1;background:#1a1a1a;border:1px solid #555;border-radius:10px;padding:10px 12px;color:#ededed';
      const send = document.createElement('button'); send.textContent = 'Kirim';
      send.onclick = () => { if (input.value.trim() !== '') void answer(null, input.value.trim()); };
      row.append(input, send); panel.append(row);
    }
    const skip = document.createElement('button'); skip.textContent = 'Lewati'; skip.style.cssText = 'margin-top:8px';
    skip.onclick = () => { void answer(null, ''); };
    panel.append(skip);
    panel.classList.remove('hidden');
  } catch { /* Poll again after a transient connection failure. */ }
}
setInterval(() => { void pollQuestions(); }, 1000);

/* ---------- Navigation: one dropdown behind the session title ---------- */

function setMenuTitle(text, subtitle = '', canGoBack = false) {
  document.getElementById('menuTitle').textContent = text;
  // A session named after its folder would say the same thing twice; the
  // white title alone is enough then.
  const same = subtitle.trim().toLowerCase() === String(text).trim().toLowerCase();
  document.getElementById('menuSubtitle').textContent = same ? '' : subtitle;
  document.getElementById('headerBack').classList.toggle('placeholder', !canGoBack);
}

/** The open session's name over its kind — antichat, or the folder it works in. */
function showSessionHeader(id) {
  const spec = lastSessions.find((entry) => entry.id === id);
  const subtitle = spec?.mode === 'code'
    ? (spec.workspaceRoot?.split(/[\\/]/).filter(Boolean).pop() || 'anticode')
    : 'antichat';
  setMenuTitle(titleFor(id), subtitle, true);
}

function titleFor(id) {
  const s = lastSessions.find((entry) => entry.id === id);
  if (s === undefined) return phoneMode === 'code' ? 'anticode' : 'antichat';
  if (s.title) return s.title;
  return s.mode === 'code' && s.workspaceRoot
    ? s.workspaceRoot.split(/[\\/]/).pop()
    : 'antichat';
}

/** Swipe right advances through the overview order; swipe left goes back. */
async function switchHeaderSession(step) {
  if (currentSession === null || lastSessions.length < 2) return;
  const from = currentSession;
  await loadOverview();
  if (currentSession !== from) return;
  const index = lastSessions.findIndex((entry) => entry.id === currentSession);
  if (index < 0) { forgetLastSession(); gotoSessions(); return; }
  const target = lastSessions[(index + step + lastSessions.length) % lastSessions.length];
  if (target !== undefined && target.id !== currentSession) await openSession(target.id);
}

/**
 * A sideways swipe changes session. `canStart` turns away a touch that means
 * something else where it lands; `canFinish` one that turned out to be
 * something else — a text selection — by the time the finger lifts.
 */
function addSessionSwipe(area, minDistance, canStart = () => true, canFinish = () => true) {
  let start = null;
  area.addEventListener('pointerdown', (event) => {
    if (currentSession === null || event.isPrimary === false || !canStart(event)) return;
    start = { id: currentSession, pointerId: event.pointerId, x: event.clientX, y: event.clientY };
  });
  // The browser took the touch for scrolling: not a swipe.
  area.addEventListener('pointercancel', () => { start = null; });
  area.addEventListener('pointerup', (event) => {
    const began = start;
    start = null;
    if (began === null || began.pointerId !== event.pointerId || began.id !== currentSession) return;
    const dx = event.clientX - began.x;
    const dy = event.clientY - began.y;
    if (Math.abs(dx) < minDistance || Math.abs(dx) < Math.abs(dy) * 1.25 || !canFinish()) return;
    void switchHeaderSession(dx > 0 ? 1 : -1).catch(showError);
  });
}

/** Code, tables, file chips: a sideways drag there scrolls them, not the session. */
function inSidewaysScroller(target) {
  for (let node = target instanceof Element ? target : null; node && node.tagName !== 'MAIN'; node = node.parentElement) {
    const overflow = getComputedStyle(node).overflowX;
    if ((overflow === 'auto' || overflow === 'scroll') && node.scrollWidth > node.clientWidth) return true;
  }
  return false;
}

// The title is hard to reach one-handed, so the conversation itself swipes
// too — the whole chat area, the empty room under a short one included.
addSessionSwipe(document.querySelector('header .headcopy'), 48);
addSessionSwipe(
  document.querySelector('main'),
  64,
  (event) =>
    !document.getElementById('viewChat').classList.contains('hidden') &&
    !document.getElementById('chatView').classList.contains('hidden') &&
    !(event.target instanceof Element && event.target.closest('input, textarea, select')) &&
    !inSidewaysScroller(event.target),
  () => (window.getSelection()?.toString() ?? '') === ''
);

function toggleMenu(event) {
  event?.stopPropagation();
  // Export only makes sense inside an open session.
  document.getElementById('exportRow').classList.toggle('hidden', currentSession === null);
  document.getElementById('menuDrop').classList.toggle('hidden');
}

/** Pulls the export the Mac wrote (into its Downloads) as a normal download.
 * Redaction is on by default — a phone should not carry raw keys. */
async function exportSession() {
  closeMenu();
  if (currentSession === null) return;
  const redact = confirm('Redact API keys and tokens from the export? (OK = redact, Cancel = raw)');
  try {
    const response = await api('/api/session/' + currentSession + '/export', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ format: 'markdown', redact, assets: false })
    });
    if (!response.ok) {
      const body = await response.json().catch(() => ({}));
      throw new Error(body.error || ('Export failed: ' + response.status));
    }
    const blob = await response.blob();
    const name = (response.headers.get('content-disposition') || '').match(/filename="([^"]+)"/)?.[1]
      || 'anticode-transcript.md';
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = name;
    link.click();
    URL.revokeObjectURL(url);
  } catch (error) { showError(error); }
}

function closeMenu() {
  document.getElementById('menuDrop').classList.add('hidden');
}

/* ---------- Chat ---------- */

async function loadOverview() {
  const { sessions, web, history, status } = await jfetch('/api/overview');
  if (status) noteStatus(status);
  lastSessions = sessions;
  fillKnownFolders(sessions);
  if (Array.isArray(web)) webList = web;
  if (history) webHistory = history;
  renderSessionList();
}

/** The folders sessions already use, offered when a new one is started — the
 * phone's stand-in for the desktop's folder picker and project list. */
function fillKnownFolders(sessions) {
  const list = document.getElementById('knownFolders');
  list.replaceChildren();
  for (const root of [...new Set(sessions.map((s) => s.workspaceRoot).filter(Boolean))]) {
    const option = document.createElement('option');
    option.value = root;
    list.appendChild(option);
  }
}

/** The list, narrowed by the search box the way the desktop dashboard's is. */
function renderSessionList() {
  const sessions = lastSessions;
  const needle = document.getElementById('sessionSearch').value.trim().toLowerCase();
  const shown = sessions.filter((s) => needle === '' ||
    [s.title, s.workspaceRoot].some((value) => (value || '').toLowerCase().includes(needle)));
  const list = document.getElementById('sessionList');
  list.innerHTML = '<div class="muted" style="padding:4px 2px">Sessions</div>';
  if (sessions.length === 0) {
    list.innerHTML += '<div class="faint" style="padding:4px 2px">No sessions yet — start one from the menu.</div>';
  } else if (shown.length === 0) {
    list.innerHTML += '<div class="faint" style="padding:4px 2px">No session matches.</div>';
  }
  for (const s of shown) {
    const row = document.createElement('div');
    row.className = 'row';
    row.setAttribute('role', 'button'); row.tabIndex = 0;
    row.onkeydown = (event) => { if (event.key === 'Enter') void openSession(s.id).catch(showError); };
    const badge = badgeFor(s);
    row.innerHTML = `<span class="badge" style="background:${badge.bg}">${s.running ? '<span class="radar"></span>' : badge.letter}</span>
      <span class="title">${escapeHtml(s.title || (s.workspaceRoot ? s.workspaceRoot.split(/[\\\\/]/).pop() : 'chat'))}</span>
      <span class="faint">${s.messageCount} msg</span>`;
    row.onclick = () => openSession(s.id).catch(showError);
    const del = document.createElement('button');
    del.className = 'delbtn';
    del.textContent = 'Delete';
    del.title = 'Delete session';
    del.onclick = (e) => {
      e.stopPropagation();
      if (!confirm('Delete this session? Its transcript is removed everywhere.')) return;
      jfetch('/api/session/' + s.id, { method: 'DELETE' })
        .then(() => {
          if (currentSession === s.id) { gotoSessions(); return; }
          void loadOverview().catch(showError);
        })
        .catch((error) => showError(error));
    };
    row.appendChild(del);
    list.appendChild(row);
  }
}

function setMode(mode) {
  phoneMode = mode;
  document.getElementById('modeCode').classList.toggle('on', mode === 'code');
  document.getElementById('modeChat').classList.toggle('on', mode === 'chat');
  // The header names the mode the same way the session it is about to make will.
  if (currentSession === null) setMenuTitle(mode === 'code' ? 'anticode' : 'antichat');
  // The folder lives on the Mac; a chat has none, so the field (and a plain
  // Start button for people who would rather not type first) is anticode's.
  document.getElementById('newSessionCard').classList.toggle('picking', mode === 'code');
  document.getElementById('folderInput').classList.toggle('hidden', mode !== 'code');
}

/* The open session's model, or with none open the one new sessions start on.
 * Each session keeps its own: picking here never moves another one. */
async function loadModels() {
  const id = currentSession;
  try {
    const info = await jfetch('/api/models' + (id ? '?sessionId=' + encodeURIComponent(id) : ''));
    if (currentSession !== id) return;
    modelInfo = info;
  } catch { modelInfo = null; }
  fillModelPickers('providerSelect', 'modelSelect');
  fillModelPickers('setProvider', 'setModel');
  updateChips();
  renderProviders();
  renderStaged();
}

/** The same pickers in two places: the new-session card and Settings. */
function fillModelPickers(providerId, modelId) {
  const providers = document.getElementById(providerId);
  providers.replaceChildren();
  for (const provider of modelInfo?.providers ?? []) {
    const option = document.createElement('option'); option.value = provider.id; option.textContent = provider.label; option.disabled = !provider.available; option.selected = provider.id === modelInfo.provider; providers.append(option);
  }
  // Rotate, only while Rotate usage is on and has something to rotate over.
  if (modelInfo?.rotationEnabled === true && (modelInfo?.rotation ?? []).length > 0) {
    const option = document.createElement('option'); option.value = ROTATE; option.textContent = 'Rotate usage'; option.selected = modelInfo.provider === ROTATE; providers.append(option);
  }
  const select = document.getElementById(modelId);
  const locked = modelInfo?.rotationEnabled === true;
  providers.disabled = locked;
  select.disabled = locked;
  if (modelInfo !== null) {
    select.innerHTML = '';
    const current = document.createElement('option');
    current.value = modelInfo.provider + '|' + modelInfo.model;
    const group = activeRotationGroup(modelInfo);
    const count = group === null ? modelInfo.rotation.length : group.entries.length;
    current.textContent = modelInfo.provider === ROTATE
      ? 'rotate: ' + (group === null ? '' : group.name + ' · ') + count + (count === 1 ? ' model' : ' models')
      : 'model: ' + (modelInfo.model || modelInfo.provider);
    select.appendChild(current);
    // The models chosen in desktop Settings → Models are the whole list — the
    // same short list the desktop composer offers. None chosen, none listed.
    const picked = (modelInfo.rotation ?? []).filter((item) => item.provider === modelInfo.provider).map((item) => item.model);
    for (const m of picked) {
      if (m === modelInfo.model) continue;
      const option = document.createElement('option');
      option.value = modelInfo.provider + '|' + m;
      option.textContent = m;
      select.appendChild(option);
    }
    if (picked.length === 0 && modelInfo.provider !== ROTATE) {
      const hint = document.createElement('option');
      hint.disabled = true;
      hint.textContent = 'Choose models in Settings → Models on the Mac';
      select.appendChild(hint);
    }
  }
}

async function pickProvider(provider) {
  await pickModel(provider + '|');
}
/** Nothing typed, nothing to apply — the button stays out of the way. */
function updateModelIdBtn() {
  const typed = document.getElementById('customModelId').value.trim();
  document.getElementById('useModelBtn').classList.toggle('hidden', typed === '');
}

async function applySettingsModel() {
  const field = document.getElementById('setCustomModel');
  const model = field.value.trim();
  if (model && modelInfo && modelInfo.provider !== ROTATE) await pickModel(modelInfo.provider + '|' + model);
  field.value = '';
  field.blur();
}

async function applyCustomModel() {
  const field = document.getElementById('customModelId');
  const model = field.value.trim();
  if (model && modelInfo && modelInfo.provider !== ROTATE) await pickModel(modelInfo.provider + '|' + model);
  field.value = '';
  updateModelIdBtn();
}

async function pickModel(value) {
  const [provider, model] = value.split('|');
  try {
    await jfetch('/api/model', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ provider, model, sessionId: currentSession })
    });
  } catch (error) { showError('Ganti model gagal: ' + error.message); }
  void loadModels();
}

async function startSession() {
  if (creatingSession) return;
  const body = { mode: phoneMode };
  if (phoneMode === 'code') {
    body.folder = document.getElementById('folderInput').value.trim();
    if (body.folder === '') { showError('Isi dulu folder proyeknya di Mac.'); return; }
  }
  creatingSession = true;
  try {
    const { sessionId } = await jfetch('/api/session', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body)
    });
    await openSession(sessionId);
    // A prompt typed before the session existed goes in as its first message.
    if (pendingFirstPrompt !== null && currentSession === sessionId) {
      const prompt = pendingFirstPrompt;
      pendingFirstPrompt = null;
      await submitPrompt(prompt);
    }
  } catch (error) { showError(error); pendingFirstPrompt = null; }
  finally { creatingSession = false; }
}

/**
 * While a run is live the phone follows the event stream, but a dropped delta
 * would leave the transcript short until the run ended. A slow re-fetch keeps
 * it honest without fighting the live append.
 */
let runSyncTimer = null;
function scheduleRunSync(id) {
  if (runSyncTimer !== null) { clearTimeout(runSyncTimer); runSyncTimer = null; }
  if (currentRunId === null || currentSession !== id) return;
  runSyncTimer = setTimeout(() => {
    runSyncTimer = null;
    if (currentRunId === null || currentSession !== id) return;
    // A redraw now would drop a passage being selected to reply to; try later.
    if (holdsSelection(document.getElementById('transcript'))) { scheduleRunSync(id); return; }
    void syncSession(id).catch(() => undefined);
  }, 8000);
}

async function openSession(id) {
  const openSeq = ++sessionOpenSeq;
  currentSession = id;
  syncedSession = null;
  appliedRevision = 0; syncEvents = []; syncing = false; ++syncSeq;
  try { sessionStorage.setItem(LAST_SESSION_KEY, id); } catch { /* private mode */ }
  currentRunId = null;
  lastUsage = null;
  liveEl = null;
  hideWorking();
  // Never leave the previous conversation painted while this one's snapshot
  // is in flight. This was the visible flash when switching quickly, and was
  // especially confusing if the old conversation had just been deleted.
  document.getElementById('transcript').replaceChildren();
  following = true;
  stopOverviewPolling();
  closeMenu();
  showChatSection();
  document.getElementById('dashboard').classList.add('hidden');
  document.getElementById('chatView').classList.remove('hidden');
  document.getElementById('inputRow').classList.remove('hidden');
  showSessionHeader(id);
  // Each session has its own model; the chip shows this one's.
  void loadModels();
  try {
    // Snapshot and live stream start together. The snapshot can paint without
    // waiting for the stream handshake; events arriving meanwhile are queued.
    await Promise.all([listen(id), syncSession(id)]);
  } catch (error) {
    // A later navigation superseded this one; its closed stream must not put
    // a stale connection error over the destination session.
    if (currentSession !== id || sessionOpenSeq !== openSeq) return;
    if (eventSource) { eventSource.close(); eventSource = null; }
    forgetLastSession();
    gotoSessions();
    void loadOverview().catch(() => undefined);
    throw error;
  }
}
/** Snapshot events and SSE share a main-process revision. Buffer every event
 * during a fetch, then replay only the events newer than that snapshot. */
let syncSeq = 0;
let syncing = false;
let syncEvents = [];
let appliedRevision = 0;
/* The session the transcript was last drawn for. */
let syncedSession = null;
async function syncSession(id) {
  const seq = ++syncSeq;
  syncing = true;
  let payload;
  try {
    payload = await jfetch('/api/session/' + id);
  } catch (error) {
    if (seq === syncSeq) {
      syncing = false;
      const pending = syncEvents; syncEvents = [];
      for (const entry of pending) if (entry.id === currentSession) await applyStreamEvent(entry.id, entry.event);
    }
    throw error;
  }
  if (currentSession !== id || seq !== syncSeq) return;
  syncing = false;
  const pending = syncEvents; syncEvents = [];
  currentRunId = payload.runId;
  if (payload.paused) pausedSessions.add(id); else pausedSessions.delete(id);
  hideWorking();
  liveEl = null; liveRun = null; liveGroup = null; sealedGroups = []; steerAnchor = null;
  // Redrawn from scratch when a run ends: a reader scrolled up stays where
  // they were; a session just opened starts at its latest reply.
  if (syncedSession !== id) following = true;
  syncedSession = id;
  const readingAt = window.scrollY;
  renderTranscript(payload.messages, payload.summaries);
  if (following) followBottom(); else window.scrollTo(0, readingAt);
  lastUsage = { id, summaries: payload.summaries ?? [], messages: (payload.messages ?? []).length };
  renderQueue(payload.queue ?? []);
  currentPlan = planOf(payload.messages ?? []);
  renderPlan();
  for (const event of payload.events ?? []) await applyStreamEvent(id, event);
  appliedRevision = payload.revision ?? 0;
  // A dropped connection pauses too, but nobody took a break: its error says why.
  if (pausedSessions.has(id) && payload.pausedForRetry !== true) appendNotice(PAUSE_LABEL);
  if (currentRunId && !tailRunning) showWorking();
  for (const entry of pending) {
    if (entry.id === id && (entry.event.revision ?? Infinity) > appliedRevision) await applyStreamEvent(id, entry.event);
  }
  updateSendBtn();
  scheduleRunSync(id);
}

/* Tool calls fold into three simple groups, mirroring the desktop. */
function toolCategory(name) {
  if (name === 'task') return 'agent';
  if (name.startsWith('mcp__')) return 'mcp';
  if (name === 'run_command') return 'code';
  if (/^(write|edit|delete|add|fill)_/.test(name)) return 'edit';
  return 'explore';
}

function toolSubject(item) {
  const input = item.input || {};
  for (const key of ['command', 'path', 'url', 'query', 'cell', 'description']) {
    if (typeof input[key] === 'string' && input[key] !== '') return input[key];
  }
  return item.name;
}


/* The same glass gradients the desktop badges use; a session always gets the
 * same colour by hashing its id. */
const BADGE_COLOURS = [
  ['#7a5cc4', '#4f3a8f'], ['#3f8f86', '#2c6b64'], ['#c2603f', '#8f4630'],
  ['#3f7fc2', '#2c5e92'], ['#b0873a', '#82632c'], ['#8f4f7a', '#6a3c5c'],
  ['#4f8f4f', '#386b38'], ['#c24f7a', '#923a5c'], ['#5c7ac2', '#43598f'],
  ['#c27a3f', '#925c30']
];

/* The colour is the main process's, the same index the desktop paints; a hash
 * only stands in for a session saved before colours were kept there, until the
 * desktop hands its colour over. */
function badgeFor(s) {
  const title = s.mode === 'code'
    ? (s.workspaceRoot ? s.workspaceRoot.split(/[\\/]/).pop() : 'session')
    : 'antichat';
  let index = Number.isInteger(s.colour) ? s.colour : null;
  if (index === null) {
    let hash = 0;
    for (const ch of s.id) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
    index = hash;
  }
  const [c1, c2] = BADGE_COLOURS[index % BADGE_COLOURS.length];
  return { letter: title.charAt(0).toUpperCase(), bg: `linear-gradient(135deg, ${c1}f2, ${c2}d9)` };
}

/* Lightweight markdown so the phone reads like the desktop: **bold**, `code`
 * in a quiet mono chip, sized headings, bullet and numbered lists, quotes,
 * tables, and blank lines kept as gaps. */
function copyBar(text, label, bottom) {
  const bar = document.createElement('div');
  bar.className = bottom ? 'pbar bottom' : 'pbar';
  const name = document.createElement('span');
  name.className = 'plabel';
  name.textContent = bottom ? '' : label;
  const button = document.createElement('button');
  button.className = 'pcopy';
  button.textContent = 'Copy';
  button.onclick = () => {
    void navigator.clipboard?.writeText(text).then(() => {
      button.textContent = 'copied';
      setTimeout(() => { button.textContent = 'Copy'; }, 1500);
    }).catch(() => { button.textContent = 'Copy'; });
  };
  bar.append(name, button);
  return bar;
}

function appendPromptBlock(parent, text, label) {
  const box = document.createElement('div');
  box.className = 'promptblock';
  const body = document.createElement('pre');
  body.textContent = text;
  box.append(copyBar(text, label, false), body, copyBar(text, label, true));
  parent.appendChild(box);
}

/* `code`, **bold** and [links](…) inside one line; a bold run may itself hold
 * code, as in **`vercel.json` (root)**, so its inside goes through the same
 * pass. Kept in step with the desktop's RichText.tsx. */
function appendInline(parent, content) {
  const re = /(\*\*[^*]+\*\*|`[^`]+`|\[[^\]\n]+\]\([^)\s]+\))/g;
  let last = 0;
  let match;
  while ((match = re.exec(content)) !== null) {
    if (match.index > last) parent.appendChild(document.createTextNode(content.slice(last, match.index)));
    const token = match[0];
    if (token.startsWith('**')) {
      const b = document.createElement('strong');
      appendInline(b, token.slice(2, -2));
      parent.appendChild(b);
    } else if (token.startsWith('[')) {
      // A markdown link reads as its label, as on the desktop.
      const link = token.match(/^\[([^\]]+)\]\(([^)]+)\)$/);
      const label = document.createElement('span');
      if (link !== null) label.title = link[2];
      appendInline(label, link !== null ? link[1] : token);
      parent.appendChild(label);
    } else {
      const c = document.createElement('code');
      c.className = 'icode';
      c.textContent = token.slice(1, -1);
      parent.appendChild(c);
    }
    last = match.index + token.length;
  }
  if (last < content.length) parent.appendChild(document.createTextNode(content.slice(last)));
}

function mdCells(row) {
  return row.replace(/^\s*\||\|\s*$/g, '').split('|').map((cell) => cell.trim());
}

function isMdSeparator(row) {
  return /^\|?[\s:-]*-[\s:|-]*\|?$/.test(row) && row.includes('-');
}

function appendMdTable(parent, rows) {
  const wrap = document.createElement('div');
  wrap.className = 'md-table';
  const table = document.createElement('table');
  const [header, , ...body] = rows;
  const head = table.createTHead().insertRow();
  for (const cell of mdCells(header)) {
    const th = document.createElement('th');
    appendInline(th, cell);
    head.appendChild(th);
  }
  const tbody = table.createTBody();
  for (const row of body) {
    const tr = tbody.insertRow();
    for (const cell of mdCells(row)) appendInline(tr.insertCell(), cell);
  }
  wrap.appendChild(table);
  parent.appendChild(wrap);
}

function appendRichText(parent, text) {
  const lines = text.split('\n');
  // What the last block was, so a blank line after a heading or another blank
  // does not stack a second gap on the heading's own margin.
  let lastKind = 'start';
  const push = (node, kind) => { parent.appendChild(node); lastKind = kind; };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    // A fenced block, or a whole paragraph in quotes: a prompt the model wrote
    // out to be taken away, not prose to read.
    if (line.trimStart().startsWith('```')) {
      const body = [];
      const language = line.trim().slice(3).trim();
      i++;
      while (i < lines.length && !lines[i].trimStart().startsWith('```')) { body.push(lines[i]); i++; }
      appendPromptBlock(parent, body.join('\n'), language === '' ? 'Code' : language);
      lastKind = 'block';
      continue;
    }
    if (/^\s*["\u201c]/.test(line)) {
      const paragraph = [];
      let scan = i;
      while (scan < lines.length && lines[scan].trim() !== '') { paragraph.push(lines[scan]); scan++; }
      const joined = paragraph.join('\n').trim();
      if (/["\u201d]$/.test(joined) && joined.length > 60) {
        i = scan - 1;
        appendPromptBlock(parent, joined.replace(/^["\u201c]/, '').replace(/["\u201d]$/, '').trim(), 'Prompt');
        lastKind = 'block';
        continue;
      }
    }
    if (line.trimStart().startsWith('|') && isMdSeparator(lines[i + 1] ?? '')) {
      const rows = [];
      while (i < lines.length && lines[i].trimStart().startsWith('|')) { rows.push(lines[i]); i++; }
      i--;
      appendMdTable(parent, rows);
      lastKind = 'block';
      continue;
    }
    // A blank line is a visible gap, as on the desktop \u2014 without it every
    // paragraph, list and heading ran into the next.
    if (line.trim() === '') {
      if (lastKind !== 'start' && lastKind !== 'gap' && lastKind !== 'heading') {
        const gap = document.createElement('div');
        gap.className = 'md-gap';
        push(gap, 'gap');
      }
      continue;
    }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) {
      const rule = document.createElement('div');
      rule.className = 'md-hr';
      push(rule, 'heading');
      continue;
    }
    const heading = line.match(/^(#{1,6})\s+(.*)$/);
    if (heading !== null) {
      const h = document.createElement('div');
      h.className = 'md-h md-h' + Math.min(heading[1].length, 3) + (lastKind === 'start' ? ' first' : '');
      appendInline(h, heading[2].replace(/^\*\*(.*)\*\*$/, '$1'));
      push(h, 'heading');
      continue;
    }
    // Bullets and numbered items hang from their marker, indented by how deep
    // the model nested them.
    const item = line.match(/^(\s*)(?:([-*+])|(\d+)[.)])\s+(.*)$/);
    if (item !== null) {
      const li = document.createElement('div');
      li.className = 'md-li';
      const depth = Math.min(Math.floor(item[1].replace(/\t/g, '  ').length / 2), 4);
      li.style.paddingLeft = (2 + depth * 18) + 'px';
      let body = item[4];
      const marker = document.createElement('span');
      const ticked = item[2] !== undefined ? body.match(/^\[([ xX])\]\s*/) : null;
      if (ticked !== null) {
        // A checklist reads as one: a ticked item takes the green mark, as on the desktop.
        body = body.slice(ticked[0].length);
        marker.className = 'md-tick';
        marker.textContent = ticked[1] === ' ' ? '\u2610' : '\u2705';
      } else if (item[2] !== undefined) {
        marker.className = depth === 0 ? 'md-dot' : 'md-dot sub';
      } else {
        marker.className = 'md-num';
        marker.textContent = item[3] + '.';
      }
      const content = document.createElement('span');
      content.className = 'md-body';
      appendInline(content, body.replace(/\s*[\u2713\u2714]\s*$/, ' \u2705'));
      li.append(marker, content);
      push(li, 'item');
      continue;
    }
    const quote = line.match(/^\s*>\s?(.*)$/);
    const row = document.createElement('div');
