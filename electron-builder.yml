appId: com.anticode.app
productName: anticode
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
# sharp ships platform-specific binaries that cannot be loaded from inside asar.
asarUnpack:
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'
mac:
  icon: build/icon.png
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  # Personal local builds: no developer certificate, skip signing entirely.
  identity: null
win:
  icon: build/icon.png
  target:
    - nsis
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Development
# Remote updates (Settings -> Updates). Building writes a feed file into release/
# -- latest-mac.yml, latest.yml, latest-linux.yml -- listing each build's version,
# file name and sha512. Host that folder as-is (GitHub Release, static host, or a
# local folder) and point Settings -> Updates at it. See docs/RELEASING.md.
publish:
  provider: generic
  url: https://example.com/anticode/
