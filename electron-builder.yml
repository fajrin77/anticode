appId: com.anticode.app
productName: anticode
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  # A build is the app and nothing else: local credentials, notes, and any
  # stray environment file stay on the machine that made it.
  - '!**/.env'
  - '!**/.env.*'
  - '!**/*.local'
  - '!**/.anticode/**'
# sharp ships platform-specific binaries that cannot be loaded from inside asar.
asarUnpack:
  - '**/node_modules/@anthropic-ai/claude-agent-sdk*/**'
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'
# Fuses are compiled into the Electron binary, so they hold even when someone
# else runs the app. Without them another local program could start anticode
# as plain Node (ELECTRON_RUN_AS_NODE, NODE_OPTIONS, --inspect) and act with its
# identity, including reading what it keeps in the OS keychain, or swap the
# code in app.asar. Packaged tests attach through --remote-debugging-port, a
# Chromium switch these fuses leave alone (scripts/packaged-launch.mjs).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # Unsigned arm64 builds: flipping a fuse edits the binary, so its ad-hoc
  # signature is redone or macOS refuses to start the app.
  resetAdHocDarwinSignature: true
mac:
  icon: build/icon.png
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  # Personal local builds: no developer certificate, skip signing entirely.
  identity: null
win:
  icon: build/icon.png
  target:
    - nsis
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Development
# Remote updates (Settings -> Updates). Building writes a feed file into release/
# -- latest-mac.yml, latest.yml, latest-linux.yml -- listing each build's version,
# file name and sha512. These are published together with the builds as assets of
# a GitHub Release, which is where installed apps look for updates. See docs/RELEASING.md.
publish:
  provider: github
  owner: fajrin77
  repo: anticode
